<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="730" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 3 · MVCC</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">One open snapshot, a table that keeps growing</text><rect x="60" y="150" width="420" height="540" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="384" height="6" rx="3" fill="#B7791F"/><text x="90" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">Nightly export job</text><text x="90" y="238" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">REPEATABLE READ</text><rect x="90" y="270" width="360" height="56" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="270" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="middle">idle in transaction for hours</text><text x="90" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">Upload to storage hung.</text><text x="90" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">The transaction never ended,</text><text x="90" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">so its snapshot never ended.</text><text x="90" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Cleanup must keep every</text><text x="90" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">version changed since it began.</text><rect x="520" y="150" width="820" height="540" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="538" y="149" width="784" height="6" rx="3" fill="#D9480F"/><text x="550" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">tickets table on disk</text><text x="550" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">live rows stay the same — dead versions pile up</text><rect x="580" y="520" width="64" height="90" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="580" y="495" width="64" height="22" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="612" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">02:00</text><rect x="688" y="520" width="64" height="90" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="688" y="463" width="64" height="54" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">08:00</text><rect x="796" y="520" width="64" height="90" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="796" y="431" width="64" height="86" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="828" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">12:00</text><rect x="904" y="520" width="64" height="90" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="904" y="399" width="64" height="118" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="936" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">16:00</text><rect x="1012" y="520" width="64" height="90" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="1012" y="367" width="64" height="150" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1044" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">20:0