-weight="400" fill="#1A1D24" text-anchor="start">A version is visible if it was created by a transaction that committed before your snapshot,</text><text x="90" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">and not replaced by one that committed before your snapshot.</text></svg>