rif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">PostgreSQL</text><text x="90" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">old versions stay in the table</text><rect x="90" y="262" width="345" height="94" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="106" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">table page</text><rect x="106" y="300" width="313" height="24" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="118" y="318" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">v2 · current</text><rect x="106" y="330" width="313" height="24" rx="5" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="118" y="348" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">v1 · dead</text><text x="90" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">cleaned up by</text><text x="90" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">VACUUM / autovacuum</text><text x="90" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• Table and indexes bloat</text><text x="90" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• Space reused, file not shrunk</text><rect x="497" y="150" width="405" height="440" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="149" width="369" height="6" rx="3" fill="#B7791F"/><text x="527" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">MySQL InnoDB, Oracle</text><text x="527" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">updated in place, old version to undo</text><rect x="527" y="262" width="345" height="64" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="543" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">table page</text><rect x="543" y="300" width="313" height="24" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="555" y="318" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">v2 · current</text><rect x="527" y="340" width="345" height="64" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="543" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">undo log</text><rect x="543" y="378" width="313" height="24" rx="5" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="555" y="396" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">v1 ← v0 …</text><text x="527" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">cleaned up by</text><text x="527" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">purge thread</text><text x="527" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• Undo log grows</text><text x="527" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• Old reads walk longer chains</text><rect x="934" y="150" width="405" height="440" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="149" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="964" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">CockroachDB, Spanner</text><text x="964" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">every version kept with a timestamp</text><rect x="964" y="262" width="345" height="124" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="980" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">key</text><rect x="980" y="300" width="313" height="24" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="992" y="318" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">@ t3 · current</text><rect x="980" y="330" width="313" height="24" rx="5" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="992" y="348" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">@ t2</text><rect x="980" y="360" width="313" height="24" rx="5" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="992" y="378" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">@ t1</text><text x="964" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">cleaned up by</text><text x="964" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">GC after a retention window</text><text x="964" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• Long reads limited by the window</text><text x="964" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• Old versions cost storage</text></svg>