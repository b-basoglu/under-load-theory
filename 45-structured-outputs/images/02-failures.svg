<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="795" viewBox="0 0 1400 795"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="795" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 45 · STRUCTURED OUTPUTS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What “please return JSON” produces at scale</text><rect x="60" y="150" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="150" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Wrapping</text><rect x="400" y="162" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="191" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">```json\n{ &quot;title&quot;: … }\n```</text><text x="930" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">chat models are trained on fenced code</text><rect x="60" y="232" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="232" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Extra text</text><rect x="400" y="244" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="273" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">Sure! Here&#x27;s the ticket: { … }</text><text x="930" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">preamble or explanation around the object</text><rect x="60" y="314" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="314" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Value outside the enum</text><rect x="400" y="326" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="355" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;severity&quot;: &quot;critical&quot;</text><text x="930" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">a sensible word the API rejects</text><rect x="60" y="396" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="396" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Renamed or missing key</text><rect x="400" y="408" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="437" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;customerId&quot;: &quot;CUS-10442&quot;</text><text x="930" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">close enough for a person, not for code</text><rect x="60" y="478" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="478" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Wrong type</text><rect x="400" y="490" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="519" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;severity&quot;: 3</text><text x="930" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">a number where a string was expected</text><rect x="60" y="560" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="560" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="602" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Syntax slip</text><rect x="400" y="572" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="601" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">{ &#x27;title&#x27;: &#x27;Login&#x27;, }</text><text x="930" y="602" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">single quotes, trailing comma</text><rect x="60" y="642" width="1280" height="68" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="642" width="10" height="68" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Truncation</text><rect x="400" y="654" width="500" height="44" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="418" y="683" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: &quot;Users in the EU offi</text><text x="930" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">token limit reached mid-object</text><text x="60" y="755" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Each is rare per call. One in a hundred, a million times a day, is ten thousand broken integrations.</text></svg>