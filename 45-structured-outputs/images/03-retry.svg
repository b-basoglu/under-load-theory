<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 45 · STRUCTURED OUTPUTS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The cost of validate-and-retry</text><rect x="60" y="200" width="220" height="90" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="170.0" y="239.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="middle">Model call</text><text x="170.0" y="265.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">free-form JSON</text><rect x="360" y="200" width="220" height="90" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="470.0" y="239.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">Parse + validate</text><text x="470.0" y="265.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">against the schema</text><rect x="660" y="200" width="220" height="90" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="770.0" y="251.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="middle">Use the output</text><line x1="284" y1="245" x2="356" y2="245" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="584" y1="245" x2="656" y2="245" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="620" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">ok</text><path d="M 470 294 Q 470 380 270 380 Q 170 380 170 296" fill="none" stroke="#D9480F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="320" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">invalid → call again, often with the error message</text><rect x="940" y="150" width="400" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="958" y="149" width="364" height="6" rx="3" fill="#B7791F"/><text x="968" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start">What the loop costs</text><text x="968" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Latency</text><text x="968" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">every retry is a full call; the tail</text><text x="968" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">pays two or three times</text><text x="968" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Tokens</text><text x="968" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">cost grows with the failure rate</text><text x="968" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start"></text><text x="968" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">No guarantee</text><text x="968" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">failures for the same input are</text><text x="968" y="488" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">correlated — some fail every time</text><text x="968" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Side effects</text><text x="968" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">a retry after acting can act twice —</text><text x="968" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">needs idempotency keys</text><text x="968" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Hidden drift</text><text x="968" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">a rising failure rate shows up as</text><text x="968" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">latency, not errors</text><rect x="60" y="470" width="840" height="240" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="469" width="804" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">Where validation belongs</text><text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">Keep it — for meaning: does the customer exist, is the severity plausible?</text><text x="90" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">Don&#x27;t rely on it for format: that&#x27;s enforced more cheaply during generation.</text><text x="90" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">Retry loops treat the symptom; constrained decoding removes the cause.</text></svg>