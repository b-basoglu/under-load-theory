<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="795" viewBox="0 0 1400 795"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="795" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 45 · STRUCTURED OUTPUTS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Arguments a program can actually use</text><rect x="60" y="150" width="410" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="374" height="6" rx="3" fill="#D9480F"/><text x="88" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#D9480F" text-anchor="start">Prompt only</text><text x="88" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">“Return only JSON with exactly these keys.”</text><rect x="88" y="262" width="354" height="50" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="104" y="293" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">```json  { … }  ```</text><rect x="88" y="332" width="354" height="50" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="104" y="363" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">Here is the ticket: { … }</text><rect x="88" y="402" width="354" height="50" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="104" y="433" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;severity&quot;: &quot;critical&quot;</text><rect x="88" y="472" width="354" height="50" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="104" y="503" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: &quot;Login fail</text><rect x="88" y="542" width="354" height="50" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="104" y="573" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;customerId&quot;: &quot;CUS-…&quot;</text><text x="88" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">At scale: a steady stream of breakage</text><rect x="500" y="150" width="410" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="518" y="149" width="374" height="6" rx="3" fill="#2B8A3E"/><text x="528" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B8A3E" text-anchor="start">Constrained decoding</text><text x="528" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">decoder can only emit schema-valid tokens</text><rect x="528" y="262" width="354" height="50" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="544" y="293" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: …, &quot;severity&quot;: &quot;high&quot;, …}</text><rect x="528" y="332" width="354" height="50" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="544" y="363" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: …, &quot;severity&quot;: &quot;high&quot;, …}</text><rect x="528" y="402" width="354" height="50" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="544" y="433" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: …, &quot;severity&quot;: &quot;high&quot;, …}</text><rect x="528" y="472" width="354" height="50" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="544" y="503" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: …, &quot;severity&quot;: &quot;low&quot;, …}</text><rect x="528" y="542" width="354" height="50" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="544" y="573" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start">{&quot;title&quot;: …, &quot;severity&quot;: &quot;urgent&quot;, …}</text><text x="528" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">Always parses, always matches the schema</text><rect x="940" y="150" width="400" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="958" y="149" width="364" height="6" rx="3" fill="#B7791F"/><text x="968" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#B7791F" text-anchor="start">…but valid ≠ right</text><text x="968" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">what the schema can&#x27;t check</text><rect x="968" y="262" width="344" height="150" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="986" y="296" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">{</text><text x="1002" y="324" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;title&quot;: &quot;Login outage&quot;,</text><text x="1002" y="352" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#D9480F" text-anchor="start">&quot;severity&quot;: &quot;low&quot;,</text><text x="1002" y="380" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#D9480F" text-anchor="start">&quot;customer_id&quot;: &quot;CUS-10442&quot;</text><text x="986" y="404" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">}</text><text x="968" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">• severity: one of four words —</text><text x="984" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">the wrong one</text><text x="968" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">• customer ID: matches the pattern —</text><text x="984" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">not in the email at all</text><text x="968" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">Format is guaranteed; meaning isn&#x27;t</text><text x="60" y="755" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Constrain the structure during generation. Validate the meaning in code before anything acts on it.</text></svg>