eight="100" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1223.0" y="214.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="middle">Create ticket</text><text x="1223.0" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">idempotency key</text><path d="M 905 274 L 905 340" fill="none" stroke="#D9480F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="790" y="344" width="230" height="70" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="905.0" y="373.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">Review queue</text><text x="905.0" y="399.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">or “needs review” flag</text><rect x="60" y="450" width="1280" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start">What the meaning check asks</text><circle cx="110" cy="540" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="144" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">Does CUS-10442 exist — and does its account own the sender&#x27;s domain?</text><text x="1310" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">would have stopped the Halcyon leak</text><circle cx="110" cy="590" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="144" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">Is the severity plausible? “everyone” + “can&#x27;t log in” isn&#x27;t low.</text><text x="1310" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">rules or a second classifier</text><circle cx="110" cy="640" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="647" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="144" y="647" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">Is the title specific, non-empty, within length?</text><text x="1310" y="647" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">not just “Issue”</text><circle cx="110" cy="690" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="697" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="144" y="697" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">Are referenced products, plans and agents real and visible to this customer?</text><text x="1310" y="697" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">no cross-tenant references</text></svg>