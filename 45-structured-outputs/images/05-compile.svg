<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="810" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 45 · STRUCTURED OUTPUTS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">From schema to a per-token mask</text><rect x="60" y="170" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="190.0" y="219.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="middle">JSON Schema</text><text x="190.0" y="245.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">fields, enums, patterns</text><rect x="400" y="170" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="530.0" y="219.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="middle">Grammar / regex</text><text x="530.0" y="245.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">every valid string</text><rect x="740" y="170" width="260" height="110" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="870.0" y="219.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="middle">State machine</text><text x="870.0" y="245.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">+ stack for nesting</text><rect x="1080" y="170" width="260" height="110" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1210.0" y="219.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="middle">Mask per step</text><text x="1210.0" y="245.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">allowed tokens</text><line x1="324" y1="225" x2="396" y2="225" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="664" y1="225" x2="736" y2="225" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="1004" y1="225" x2="1076" y2="225" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="530" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle">compiled once, cached</text><text x="1210" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle">looked up every token</text><rect x="60" y="350" width="1280" height="220" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Inside the severity value: a tiny piece of the state machine</text><circle cx="150" cy="480" r="34" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5"/><text x="150" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="middle">S0</text><text x="150" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">start</text><line x1="188" y1="480" x2="390" y2="480" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><circle cx="430" cy="480" r="34" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5"/><text x="430" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="middle">S1</text><text x="430" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">u / h / m / l</text><line x1="468" y1="480" x2="680" y2="480" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><circle cx="720" cy="480" r="34" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5"/><text x="720" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="middle">S2</text><text x="720" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">…rgent / …igh</text><line x1="758" y1="480" x2="990" y2="480" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><circle cx="1030" cy="480" r="34" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5"/><text x="1030" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="middle">S3</text><text x="1030" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">closing quote</text><text x="290" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">&quot;</text><text x="575" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1D24" text-anchor="middle">letters of an allowed word</text><text x="875" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">&quot;</text><rect x="60" y="600" width="620" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="599" width="584" height="6" rx="3" fill="#B7791F"/><text x="90" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Tokens don&#x27;t align with grammar symbols</text><text x="90" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">One token can be  &quot;: &quot;  or  urgent&quot;  — several characters</text><text x="90" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">across a boundary. Each token&#x27;s full string is checked.</text><rect x="720" y="600" width="620" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="738" y="599" width="584" height="6" rx="3" fill="#D9480F"/><text x="750" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">Don&#x27;t be stricter than JSON</text><text x="750" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Forcing unusual spacing pushes the model toward token</text><text x="750" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">sequences it rarely saw — and can worsen the content.</text></svg>