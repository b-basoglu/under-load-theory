 Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">DC-A (old primary)</text><text x="90" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">sees only silence from the other side</text><rect x="90" y="262" width="460" height="64" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="320.0" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">keeps being primary</text><text x="320.0" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">never told otherwise</text><text x="90" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">accepts writes from local agents</text><text x="90" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">ticket 4412: status = closed</text><text x="90" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">acknowledged ✓</text><rect x="820" y="150" width="520" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="838" y="149" width="484" height="6" rx="3" fill="#D9480F"/><text x="850" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8A3FB8" text-anchor="start">DC-B (standby)</text><text x="850" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">sees only silence from the other side</text><rect x="850" y="262" width="460" height="64" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1080.0" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">promotes itself to primary</text><text x="1080.0" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">&#x27;no heartbeat for 2 s → it must be dead&#x27;</text><text x="850" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">accepts writes from local agents</text><text x="850" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">ticket 4412: reply added, reassigned</text><text x="850" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">acknowledged ✓</text><line x1="590" y1="300" x2="810" y2="300" stroke="#D9480F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="700" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">✕ link down</text><rect x="60" y="510" width="1280" height="90" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="90" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">When the link returns: two acknowledged histories of the same tickets</text><text x="90" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">and no automatically correct way to combine them.</text></svg>