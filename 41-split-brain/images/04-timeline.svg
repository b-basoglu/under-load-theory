<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 41 · SPLIT BRAIN</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The old primary must stop before the new one starts</text><text x="60" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Quorum lease, old primary keeps writing until it gives up</text><rect x="666.5454545454545" y="204" width="444.3636363636365" height="152" rx="0" fill="#FDEBE3" stroke="#FDEBE3" stroke-width="2" opacity="1"/><line x1="354.54545454545456" y1="200" x2="354.54545454545456" y2="360" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="354.54545454545456" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D24" text-anchor="middle">partition</text><line x1="638.1818181818182" y1="200" x2="638.1818181818182" y2="360" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><text x="638.1818181818182" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end">lease expires on the majority</text><text x="888.7272727272727" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">both accepting writes</text><text x="60" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">DC-A</text><line x1="260.0" y1="228" x2="1300.0" y2="228" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><rect x="260.0" y="210" width="850.909090909091" height="36" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="0.9"/><text x="1098.909090909091" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="end">primary</text><text x="60" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8A3FB8" text-anchor="start">DC-B</text><line x1="260.0" y1="298" x2="1300.0" y2="298" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><rect x="666.5454545454545" y="280" width="633.4545454545455" height="36" rx="6" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="0.9"/><text x="1288.0" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="end">promoted: accepts writes</text><text x="60" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">Quorum lease + self-fencing (read-only once renewal is overdue)</text><rect x="505.8181818181818" y="474" width="160.7272727272727" height="152" rx="0" fill="#FBF1DC" stroke="#FBF1DC" stroke-width="2" opacity="1"/><line x1="354.54545454545456" y1="470" x2="354.54545454545456" y2="630" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="354.54545454545456" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D24" text-anchor="middle">partition</text><line x1="638.1818181818182" y1="470" x2="638.1818181818182" y2="630" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><text x="638.1818181818182" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end">lease expires on the majority</text><text x="586.1818181818181" y="682" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">no primary — the price of never having two</text><text x="60" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">DC-A</text><line x1="260.0" y1="498" x2="1300.0" y2="498" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><rect x="260.0" y="480" width="245.8181818181818" height="36" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="0.9"/><text x="493.8181818181818" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="end">primary</text><rect x="505.8181818181818" y="480" width="794.1818181818182" height="36" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="0.9"/><text x="1288.0" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end">self-fenced: read-only</text><text x="60" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8A3FB8" text-anchor="start">DC-B</text><line x1="260.0" y1="568" x2="1300.0" y2="568" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><rect x="666.5454545454545" y="550" width="633.4545454545455" height="36" rx="6" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="0.9"/><text x="1288.0" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="end">promoted: accepts writes</text><text x="60" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">The old primary&#x27;s deadline is measured from when it sent its last renewal, and kept well under the TTL.</text></svg>