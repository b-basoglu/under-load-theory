<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="740" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 41 · SPLIT BRAIN</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A majority can exist on only one side</text><rect x="60" y="160" width="420" height="330" rx="16" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="270" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">DC-A</text><rect x="560" y="160" width="780" height="330" rx="16" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="950" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8A3FB8" text-anchor="middle">DC-B</text><rect x="150" y="230" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="270.0" y="266.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">etcd e1</text><text x="270.0" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">1 of 3 votes</text><rect x="640" y="230" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="760.0" y="276.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">etcd e2</text><rect x="1020" y="230" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1140.0" y="276.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">etcd e3</text><line x1="486" y1="270" x2="556" y2="270" stroke="#D9480F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="520" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">✕</text><text x="270" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">writes:</text><text x="270" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="middle">all refused</text><text x="270" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">no majority → no leader</text><text x="950" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">writes:</text><text x="950" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="middle">committed normally</text><text x="950" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">2 of 3 votes → keeps a leader</text><rect x="60" y="520" width="1280" height="180" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="519" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Placing the votes</text><text x="90" y="602" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• an odd number of voters (3, 5) so a tie is impossible</text><text x="90" y="634" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• spread across ≥ 3 failure domains — with only 2 DCs, the side holding 2 votes always wins</text><text x="90" y="666" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• a small &#x27;witness&#x27; voter in a third site breaks the tie without holding data</text></svg>