<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="820" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 35 · SHARDING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Where the routing happens</text><rect x="60" y="150" width="410" height="500" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="374" height="6" rx="3" fill="#2F5BEA"/><text x="88" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">In the application</text><rect x="165" y="222" width="200" height="46" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="265.0" y="251.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">app</text><rect x="100" y="386" width="100" height="44" rx="12" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="150.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 0</text><line x1="265" y1="270" x2="150" y2="380" stroke="#2F5BEA" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="220" y="386" width="100" height="44" rx="12" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="270.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 1</text><line x1="265" y1="270" x2="270" y2="380" stroke="#2F5BEA" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="340" y="386" width="100" height="44" rx="12" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="390.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 2</text><line x1="265" y1="270" x2="390" y2="380" stroke="#2F5BEA" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="88" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• service computes the shard</text><text x="88" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• one connection pool per shard</text><text x="88" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• no extra network hop</text><text x="88" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• every service must agree on the map</text><text x="88" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">client library</text><rect x="495" y="150" width="410" height="500" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="513" y="149" width="374" height="6" rx="3" fill="#8A3FB8"/><text x="523" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="start">In a proxy / coordinator</text><rect x="600" y="222" width="200" height="46" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700.0" y="251.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">app</text><rect x="600" y="300" width="200" height="46" rx="12" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="700.0" y="329.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">proxy</text><line x1="700" y1="270" x2="700" y2="294" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="535" y="386" width="100" height="44" rx="12" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="585.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A3FB8" text-anchor="middle">shard 0</text><line x1="700" y1="348" x2="585" y2="380" stroke="#8A3FB8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-8A3FB8)"/><rect x="655" y="386" width="100" height="44" rx="12" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="705.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A3FB8" text-anchor="middle">shard 1</text><line x1="700" y1="348" x2="705" y2="380" stroke="#8A3FB8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-8A3FB8)"/><rect x="775" y="386" width="100" height="44" rx="12" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="825.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A3FB8" text-anchor="middle">shard 2</text><line x1="700" y1="348" x2="825" y2="380" stroke="#8A3FB8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-8A3FB8)"/><text x="523" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• app talks to one endpoint</text><text x="523" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• proxy finds the shard key</text><text x="523" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• can fan out keyless queries,</text><text x="523" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">  which hides mistakes</text><text x="523" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">Vitess VTGate · Citus · mongos</text><rect x="930" y="150" width="410" height="500" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="948" y="149" width="374" height="6" rx="3" fill="#2B8A3E"/><text x="958" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">In the database</text><rect x="1035" y="222" width="200" height="46" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1135.0" y="251.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">app</text><rect x="955" y="300" width="360" height="150" rx="12" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1" stroke-dasharray="6 5"/><text x="1135" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">one logical database</text><line x1="1135" y1="270" x2="1135" y2="296" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="970" y="386" width="100" height="44" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1020.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">shard 0</text><rect x="1090" y="386" width="100" height="44" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1140.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">shard 1</text><rect x="1210" y="386" width="100" height="44" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1260.0" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">shard 2</text><text x="958" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• partitions split and move by themselves</text><text x="958" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• client sees one database</text><text x="958" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">• key choice still matters:</text><text x="958" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">  usually the primary key prefix</text><text x="958" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">CockroachDB · Spanner · DynamoDB</text><rect x="60" y="680" width="1280" height="100" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="679" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">The shard map is critical metadata.</text><text x="90" y="756" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">Keep it in a strongly consistent store, version it, and reject requests routed with a stale version.</text></svg>