<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 35 · SHARDING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Hash or range — and on what?</text><rect x="60" y="150" width="410" height="360" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="374" height="6" rx="3" fill="#2F5BEA"/><text x="88" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">Hash sharding</text><text x="88" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">shard = hash(key) mod N, or a ring</text><text x="88" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ spreads keys evenly</text><text x="88" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ no hotspot from new data</text><text x="88" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ range queries hit every shard</text><text x="88" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ a hot key is still one shard</text><text x="88" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">tenant_id, ticket_id</text><rect x="495" y="150" width="410" height="360" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="513" y="149" width="374" height="6" rx="3" fill="#8A3FB8"/><text x="523" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8A3FB8" text-anchor="start">Range sharding</text><text x="523" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">each shard owns a range: A–F, 2026-10</text><text x="523" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ range scans stay on one shard</text><text x="523" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ easy to split a range in two</text><text x="523" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ sequential keys pile onto the end</text><text x="523" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ ranges drift out of balance</text><text x="523" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">dates, ids, names</text><rect x="930" y="150" width="410" height="360" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="948" y="149" width="374" height="6" rx="3" fill="#B7791F"/><text x="958" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start">Directory sharding</text><text x="958" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">a lookup table: tenant 4812 → shard 3</text><text x="958" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ any placement, moved per key</text><text x="958" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ big tenants placed by hand</text><text x="958" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ extra lookup on every request</text><text x="958" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ the map must be consistent, cached</text><text x="958" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">often over logical shards</text><rect x="60" y="540" width="1280" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="539" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">A good shard key</text><text x="90" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• many distinct values   • traffic spread across them, not just rows</text><text x="90" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• the most common queries answered by one shard   • rarely changes for a row</text><text x="90" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">Locality favours coarse keys (tenant); balance favours fine keys (ticket). Choose on purpose.</text></svg>