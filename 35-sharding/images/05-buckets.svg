size="12" font-weight="700" fill="#B7791F" text-anchor="middle">(Halcyon, bucket 4)</text><line x1="294" y1="245" x2="356" y2="292" stroke="#D9D6CF" stroke-width="1" stroke-linecap="round"/><rect x="360" y="310" width="200" height="24" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2" opacity="1"/><text x="460" y="327" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">(Halcyon, bucket 5)</text><line x1="294" y1="245" x2="356" y2="322" stroke="#D9D6CF" stroke-width="1" stroke-linecap="round"/><rect x="360" y="340" width="200" height="24" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2" opacity="1"/><text x="460" y="357" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">(Halcyon, bucket 6)</text><line x1="294" y1="245" x2="356" y2="352" stroke="#D9D6CF" stroke-width="1" stroke-linecap="round"/><rect x="360" y="370" width="200" height="24" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2" opacity="1"/><text x="460" y="387" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">(Halcyon, bucket 7)</text><line x1="294" y1="245" x2="356" y2="382" stroke="#D9D6CF" stroke-width="1" stroke-linecap="round"/><rect x="660" y="160" width="160" height="52" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="740.0" y="192.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 0</text><rect x="660" y="222" width="160" height="52" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="740.0" y="254.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 1</text><rect x="660" y="284" width="160" height="52" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="740.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 2</text><rect x="660" y="346" width="160" height="52" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="740.0" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">shard 3</text><line x1="564" y1="172" x2="656" y2="186" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="202" x2="656" y2="372" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="232" x2="656" y2="310" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="262" x2="656" y2="248" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="292" x2="656" y2="186" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="322" x2="656" y2="372" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="352" x2="656" y2="310" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><line x1="564" y1="382" x2="656" y2="248" stroke="#D9D6CF" stroke-width="1.2" stroke-linecap="round"/><text x="60" y="340" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">bucket = hash(ticket_id) mod 8</text><text x="60" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">Halcyon only; every other tenant</text><text x="60" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">keeps one bucket on one shard</text><rect x="870" y="150" width="470" height="270" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="888" y="149" width="434" height="6" rx="3" fill="#2B8A3E"/><text x="900" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">What changes</text><text x="900" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">✓ Halcyon&#x27;s writes spread over all shards</text><text x="900" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">✓ one ticket still lives in one bucket</text><text x="900" y="294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">✓ other tenants don&#x27;t move at all</text><text x="900" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">✗ Halcyon&#x27;s tenant-wide pages read 8 buckets</text><text x="900" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">✗ routers must agree on who is bucketed</text><text x="900" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">✗ changing the bucket count moves data</text><rect x="60" y="450" width="1280" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Other ways out of a hot partition</text><text x="90" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• give the biggest tenants their own shard or cluster — a bulkhead for data (Part 17)</text><text x="90" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• cache and coalesce hot reads (Parts 9, 12); rate-limit or shed the excess (Parts 22–25)</text><text x="90" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• split an overfull shard (Part 37) — works for many keys, not for one key</text><text x="90" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• a single hot row (a counter) needs a redesign: split counters, async aggregation</text></svg>