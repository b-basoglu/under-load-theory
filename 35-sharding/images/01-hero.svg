ns-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Sharded by tenant · share of writes per shard (illustrative)</text><text x="90" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">shard 0</text><rect x="170" y="230" width="460" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="170" y="230" width="124.2" height="34" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="850" y="253" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="end">comfortable</text><text x="90" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">shard 1</text><rect x="170" y="280" width="460" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="170" y="280" width="101.2" height="34" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="850" y="303" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="end">comfortable</text><text x="90" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">shard 2</text><rect x="170" y="330" width="460" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="170" y="330" width="92.0" height="34" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="850" y="353" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="end">comfortable</text><text x="90" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">shard 3</text><rect x="170" y="380" width="460" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="170" y="380" width="193.2" height="34" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="850" y="403" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="end">over capacity</text><line x1="323.318" y1="222" x2="323.318" y2="432" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="331.318" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1D24" text-anchor="start">one shard&#x27;s capacity</text><rect x="910" y="150" width="430" height="360" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="928" y="149" width="394" height="6" rx="3" fill="#D9480F"/><text x="940" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">shard 3: Halcyon + its neighbours</text><text x="940" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D9480F" text-anchor="start">offered more than it</text><text x="940" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D9480F" text-anchor="start">can process</text><text x="940" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• its queue grows for as long as</text><text x="940" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">  the peak lasts</text><text x="940" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• every tenant on it is slow</text><text x="940" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the other three have capacity</text><text x="940" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">  nobody can use</text><text x="60" y="555" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">The cluster is at 75% of its total capacity. One tenant sends a fifth of all writes — and all of them go to one shard.</text></svg>