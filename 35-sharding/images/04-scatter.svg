<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="830" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 35 · SHARDING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Even traffic, scattered queries</text><rect x="60" y="150" width="610" height="380" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Sharded by tenant</text><text x="90" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">&quot;Halcyon&#x27;s latest 50 tickets&quot;</text><rect x="265" y="250" width="200" height="56" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="365.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">router</text><rect x="90" y="400" width="124" height="56" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="152.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9D6CF" text-anchor="middle">shard 0</text><rect x="232" y="400" width="124" height="56" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="294.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9D6CF" text-anchor="middle">shard 1</text><rect x="374" y="400" width="124" height="56" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="436.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">shard 2</text><line x1="365" y1="308" x2="436" y2="394" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="516" y="400" width="124" height="56" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="578.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9D6CF" text-anchor="middle">shard 3</text><text x="90" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">one shard answers the page</text><rect x="730" y="150" width="610" height="380" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="760" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="start">Sharded by ticket id</text><text x="760" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">&quot;Halcyon&#x27;s latest 50 tickets&quot;</text><rect x="935" y="250" width="200" height="56" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1035.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">router</text><rect x="760" y="400" width="124" height="56" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="822.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">shard 0</text><line x1="1035" y1="308" x2="822" y2="394" stroke="#B7791F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-B7791F)"/><rect x="902" y="400" width="124" height="56" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="964.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">shard 1</text><line x1="1035" y1="308" x2="964" y2="394" stroke="#B7791F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-B7791F)"/><rect x="1044" y="400" width="124" height="56" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1106.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">shard 2</text><line x1="1035" y1="308" x2="1106" y2="394" stroke="#B7791F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-B7791F)"/><rect x="1186" y="400" width="124" height="56" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1248.0" y="434.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">shard 3</text><line x1="1035" y1="308" x2="1248" y2="394" stroke="#B7791F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-B7791F)"/><text x="760" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">every shard answers, router merges</text><rect x="60" y="560" width="1280" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="559" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Fan-out multiplies more than latency</text><text x="90" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the query is as slow as the slowest shard: P(any slow) = 1 − 0.99ⁿ → ~4% at 4 shards, ~15% at 16, ~47% at 64</text><text x="90" y="676" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• every shard does work for every tenant page — more shards means more total work per page</text><text x="90" y="708" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• one slow or down shard breaks the page for every tenant</text><text x="90" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• merging: each shard returns its top 50, the router sorts them all to keep 50</text><text x="90" y="772" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">Choose the key so the most common queries hit one shard.</text></svg>