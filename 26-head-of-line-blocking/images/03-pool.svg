="#2F5BEA" text-anchor="middle">read</text><text x="964" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">helps only if slots are the bottleneck</text><text x="964" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">8 heavy exports = 2× load on the database</text><rect x="60" y="600" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="599" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Other levers</text><text x="90" y="682" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">reserve a slot or two for fast work · priority + a cap on slow slots · weighted fairness so exports don&#x27;t starve</text><text x="90" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">timeouts with cancellation · split one 2 s export into many short chunks</text></svg>