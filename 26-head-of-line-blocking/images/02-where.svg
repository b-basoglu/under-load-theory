<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="760" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 26 · HEAD-OF-LINE BLOCKING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Find the serialization point</text><rect x="60" y="150" width="1280" height="78" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><circle cx="104" cy="189" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140" y="183" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One worker or pool</text><text x="140" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">slow jobs occupy every slot; fast jobs queue behind</text><text x="1310" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">thread pools, job queues, DB connection pools</text><rect x="60" y="242" width="1280" height="78" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><circle cx="104" cy="281" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="140" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One ordered partition</text><text x="140" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">a message can&#x27;t be processed until the one before it is</text><text x="1310" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">Kafka partitions, SQS FIFO groups, ordered streams</text><rect x="60" y="334" width="1280" height="78" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><circle cx="104" cy="373" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="140" y="367" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One connection</text><text x="140" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">responses or packets delivered strictly in order</text><text x="1310" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">HTTP/1.1, HTTP/2 over TCP, a DB connection</text><rect x="60" y="426" width="1280" height="78" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><circle cx="104" cy="465" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="140" y="459" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One lock</text><text x="140" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">every request touching the row waits for the holder</text><text x="1310" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">hot rows, mutexes, advisory locks (Part 5)</text><rect x="60" y="518" width="1280" height="78" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><circle cx="104" cy="557" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="140" y="551" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One thread</text><text x="140" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">a single event loop or server thread does one thing at a time</text><text x="1310" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">Node.js event loop, a slow Redis command</text><rect x="60" y="610" width="1280" height="78" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><circle cx="104" cy="649" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="140" y="643" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One shared FIFO</text><text x="140" y="670" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">a slow class and a fast class share one line</text><text x="1310" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">a single queue for interactive + batch work</text><text x="60" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Symptom: queue wait grows while service time stays flat. Measure the two separately.</text></svg>