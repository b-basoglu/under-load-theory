<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="810" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 26 · HEAD-OF-LINE BLOCKING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">One connection, many responses</text><rect x="60" y="150" width="1280" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Application layer: response 1 is slow to produce; the others are ready immediately</text><text x="90" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">HTTP/1.1</text><text x="90" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">every response waits for response 1</text><line x1="420" y1="250" x2="1280" y2="250" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><circle cx="1125.1999999999998" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1142.4" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1159.6" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1176.8" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1194.0" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1211.1999999999998" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1228.4" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="1245.6" cy="250" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><text x="90" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">HTTP/2 (multiplexed)</text><text x="90" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">ready responses go first; only the slow one is late</text><line x1="420" y1="340" x2="1280" y2="340" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><circle cx="1125.1999999999998" cy="340" r="9" fill="#D9480F" stroke="none" stroke-width="0"/><circle cx="523.2" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><circle cx="527.5" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><circle cx="531.8" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><circle cx="536.1" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><circle cx="540.4" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><circle cx="544.7" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><circle cx="549.0" cy="340" r="9" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1280" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">time each response finishes →</text><circle cx="426.0" cy="426" r="7" fill="#D9480F" stroke="none" stroke-width="0"/><text x="440.0" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">response 1 (slow)</text><rect x="60" y="480" width="1280" height="290" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Transport layer: one lost packet</text><text x="90" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">HTTP/2 over TCP</text><rect x="330" y="566" width="104" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="382" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">waits</text><rect x="450" y="566" width="104" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="502" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">waits</text><rect x="570" y="566" width="104" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="622" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">waits</text><rect x="690" y="566" width="104" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="742" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">waits</text><rect x="810" y="566" width="104" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="862" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">waits</text><text x="940" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start"></text><text x="330" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">bytes are delivered in order for the whole connection: every stream waits for the retransmit</text><text x="90" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">HTTP/3 over QUIC</text><rect x="330" y="662" width="104" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="382" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">waits</text><rect x="450" y="662" width="104" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="502" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">flows</text><rect x="570" y="662" width="104" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="622" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">flows</text><rect x="690" y="662" width="104" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="742" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">flows</text><rect x="810" y="662" width="104" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="862" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">flows</text><text x="940" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="start"></text><text x="330" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">order is kept per stream: only the stream that lost the packet waits</text></svg>