<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="670" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 26 · HEAD-OF-LINE BLOCKING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A 10 ms request that waits two seconds</text><rect x="60" y="150" width="1280" height="250" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">One FIFO queue, 4 workers — ticket reads (10 ms) and CSV exports (2 s) mixed</text><text x="90" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">worker 1</text><rect x="190" y="226" width="520" height="30" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="450" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">export · 2 s</text><text x="90" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">worker 2</text><rect x="190" y="264" width="520" height="30" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="450" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">export · 2 s</text><text x="90" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">worker 3</text><rect x="190" y="302" width="520" height="30" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="450" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">export · 2 s</text><text x="90" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">worker 4</text><rect x="190" y="340" width="520" height="30" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="450" y="361" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">export · 2 s</text><rect x="760" y="266" 