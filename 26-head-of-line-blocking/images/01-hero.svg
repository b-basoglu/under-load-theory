"200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="429" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#D9480F" text-anchor="start">Shared queue</text><text x="90" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#D9480F" text-anchor="start">up to ~2 s</text><text x="90" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">queue wait of a read when exports overlap</text><text x="90" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">service time stays ~10 ms — the read isn&#x27;t slow</text><rect x="715" y="430" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="429" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Separate pools (2 reads + 2 exports)</text><text x="745" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#2B8A3E" text-anchor="start">tens of ms</text><text x="745" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">queue wait of a read · same 4 workers</text><text x="745" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">exports now wait for each other instead</text></svg>