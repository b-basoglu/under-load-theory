<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="770" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 26 · HEAD-OF-LINE BLOCKING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">One slow webhook endpoint, one ordered partition</text><rect x="60" y="150" width="1280" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">In order, one at a time: every message behind a slow one waits</text><rect x="90" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="132" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant A</text><rect x="188" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="230" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant B</text><rect x="286" y="230" width="84" height="60" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="328" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">slow</text><rect x="384" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="426" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant C</text><rect x="482" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="524" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant A</text><rect x="580" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="622" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant D</text><rect x="678" y="230" width="84" height="60" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">slow</text><rect x="776" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="818" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant B</text><rect x="874" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="916" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant E</text><rect x="972" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1014" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant C</text><rect x="1070" y="230" width="84" height="60" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1112" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">slow</text><rect x="1168" y="230" width="84" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1210" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">tenant A</text><text x="90" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">slow tenant: 5 msgs/s × 2 s each = 10 s of work per second</text><text x="90" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">the partition can never catch up — every tenant&#x27;s lag grows for as long as the endpoint is slow</text><text x="90" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">nothing is wrong with tenants A–E. They are in the same line.</text><rect x="60" y="480" width="405" height="210" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="479" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Time out + park</text><text x="90" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">50 ms timeout, then a retry topic</text><text x="90" y="602" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">partition keeps flowing; that key</text><text x="90" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">may now arrive out of order</text><rect x="497" y="480" width="405" height="210" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="479" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="527" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Per-key concurrency</text><text x="527" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">keys in parallel, each key in order</text><text x="527" y="602" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">only the slow tenant&#x27;s own</text><text x="527" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">messages wait for each other</text><rect x="934" y="480" width="405" height="210" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="479" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="964" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Separate the noisy tenant</text><text x="964" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">its own partition or topic</text><text x="964" y="602" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">coarser; no special consumer</text><text x="964" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">logic needed</text><text x="60" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Keep ordering only where it&#x27;s needed — per key, not per partition.</text></svg>