<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 50 · CONTINUOUS BATCHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The scheduler&#x27;s loop runs once per step</text><rect x="90" y="170" width="580" height="150" rx="16" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><circle cx="130" cy="216" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="130" y="223" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="162" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5BEA" text-anchor="start">Run one step</text><text x="130" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">one new token for every running sequence</text><rect x="730" y="170" width="580" height="150" rx="16" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5" opacity="1"/><circle cx="770" cy="216" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="770" y="223" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="802" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">Retire</text><text x="770" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">finished, length-capped or cancelled → free their KV blocks</text><rect x="730" y="400" width="580" height="150" rx="16" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5" opacity="1"/><circle cx="770" cy="446" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="770" y="453" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="802" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#B7791F" text-anchor="start">Admit</text><text x="770" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">waiting requests whose prompt + growth fits in memory</text><rect x="90" y="400" width="580" height="150" rx="16" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2.5" opacity="1"/><circle cx="130" cy="446" r="17" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="130" y="453" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="162" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#8A3FB8" text-anchor="start">Stream and repeat</text><text x="130" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">send new tokens to clients; next step</text><line x1="670" y1="245" x2="724" y2="245" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="1020" y1="320" x2="1020" y2="394" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="730" y1="475" x2="676" y2="475" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="380" y1="400" x2="380" y2="326" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="60" y="590" width="640" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="589" width="604" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Waiting queue</text><text x="90" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">requests not yet admitted; time here is queue time</text><text x="90" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">grows when demand exceeds what the GPU can produce</text><rect x="730" y="590" width="610" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="589" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="760" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Running set</text><text x="760" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">sequences in the batch, each with its own KV cache</text><text x="760" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">selective batching: shared matmuls, per-sequence attention</text></svg>