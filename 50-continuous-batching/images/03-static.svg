<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="770" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 50 · CONTINUOUS BATCHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Static batching: finished sequences hold their seats</text><rect x="60" y="150" width="1280" height="400" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">seat 1</text><rect x="300.0" y="200" width="36.75" height="42" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="336.75" y="200" width="943.2500000000001" height="42" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1" stroke-dasharray="5 4"/><text x="808.375" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">finished — seat idle</text><text x="90" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">seat 2</text><rect x="300.0" y="264" width="147.0" height="42" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="373.5" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">60 tokens</text><rect x="447.0" y="264" width="833.0000000000001" height="42" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1" stroke-dasharray="5 4"/><text x="863.5" y="291" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">finished — seat idle</text><text x="90" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">seat 3</text><rect x="300.0" y="328" width="294.0" height="42" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="447.0" y="354.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">120 tokens</text><rect x="594.0" y="328" width="686.0" height="42" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1" stroke-dasharray="5 4"/><text x="937.0" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">finished — seat idle</text><text x="90" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">seat 4</text><rect x="300.0" y="392" width="980.0000000000001" height="42" rx="6" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="790.0" y="418.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="middle">400 tokens</text><line x1="1280.0" y1="186" x2="1280.0" y2="470" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="1274.0" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1D24" text-anchor="end">batch ends; next batch can start</text><text x="300" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">step 0</text><text x="90" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">useful slot-steps: 15 + 60 + 120 + 400 = 595 of 4 × 400 = 1,600  →  about 37%</text><rect x="60" y="580" width="410" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="579" width="374" height="6" rx="3" fill="#D9480F"/><text x="86" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Idle seats</text><text x="86" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">the more output lengths vary, the more</text><text x="86" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">of every batch is padding</text><rect x="490" y="580" width="410" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="508" y="579" width="374" height="6" rx="3" fill="#D9480F"/><text x="516" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Head-of-line blocking</text><text x="516" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">a request arriving at step 1 waits ~400</text><text x="516" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">steps to even start</text><rect x="920" y="580" width="410" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="938" y="579" width="374" height="6" rx="3" fill="#D9480F"/><text x="946" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Dynamic batching doesn&#x27;t fix it</text><text x="946" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">it only decides how batches form; the</text><text x="946" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">batch is still fixed once it runs</text></svg>