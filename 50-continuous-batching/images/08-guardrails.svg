<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 50 · CONTINUOUS BATCHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Batching guardrails</text><rect x="60" y="150" width="1280" height="600" rx="20" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><circle cx="120" cy="226" r="24" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="120" y="235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="170" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">Serve with an engine that batches per step</text><text x="170" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#B8BEC9" text-anchor="start">vLLM, SGLang, TensorRT-LLM — never a request loop or fixed batches</text><line x1="170" y1="282" x2="1290" y2="282" stroke="#2E333D" stroke-width="1.5" stroke-linecap="round"/><circle cx="120" cy="334" r="24" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="120" y="343" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="170" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">Admission respects KV cache budgets</text><text x="170" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#B8BEC9" text-anchor="start">Sequence and token limits, bounded output, preemption as a safety valve</text><line x1="170" y1="390" x2="1290" y2="390" stroke="#2E333D" stroke-width="1.5" stroke-linecap="round"/><circle cx="120" cy="442" r="24" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="120" y="451" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="170" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">Long prefills are chunked</text><text x="170" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#B8BEC9" text-anchor="start">Or disaggregated, so one prompt can&#x27;t freeze every stream</text><line x1="170" y1="498" x2="1290" y2="498" stroke="#2E333D" stroke-width="1.5" stroke-linecap="round"/><circle cx="120" cy="550" r="24" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="120" y="559" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="170" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">Batch limits come from latency targets</text><text x="170" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#B8BEC9" text-anchor="start">Optimize goodput, not raw tokens per second</text><line x1="170" y1="606" x2="1290" y2="606" stroke="#2E333D" stroke-width="1.5" stroke-linecap="round"/><circle cx="120" cy="658" r="24" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="120" y="667" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="170" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">Bulk work is isolated; cancellation propagates</text><text x="170" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#B8BEC9" text-anchor="start">Queue time, TTFT and inter-token latency watched together</text></svg>