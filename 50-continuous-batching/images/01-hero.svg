ize="14" font-weight="600" fill="#6B7280" text-anchor="start">time (decode steps) →</text><text x="1340" y="770" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="end">dashed grey = a seat held by a finished sequence. Illustrative.</text></svg>