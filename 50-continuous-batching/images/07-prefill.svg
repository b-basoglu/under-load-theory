<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="830" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 50 · CONTINUOUS BATCHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A long prefill stalls everyone — unless it&#x27;s chunked</text><rect x="60" y="150" width="1280" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#D9480F" text-anchor="start">Prefill added to one step</text><rect x="90" y="220" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="150" y="220" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="210" y="220" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="270" y="220" width="514" height="60" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="527.0" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">decodes + whole 6,000-token prefill</text><rect x="790" y="220" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="850" y="220" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="910" y="220" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="90" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">each box = one step; width = step time (illustrative)</text><text x="90" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">every running stream freezes for the long step</text><rect x="60" y="410" width="1280" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="409" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Chunked prefill under a per-step token budget</text><rect x="90" y="480" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="150" y="480" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="210" y="480" width="144" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="282.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">decodes +</text><text x="282.0" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">prefill chunk</text><rect x="360" y="480" width="144" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="432.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">decodes +</text><text x="432.0" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">prefill chunk</text><rect x="510" y="480" width="144" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="582.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">decodes +</text><text x="582.0" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">prefill chunk</text><rect x="660" y="480" width="144" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="732.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">decodes +</text><text x="732.0" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">prefill chunk</text><rect x="810" y="480" width="54" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="90" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">each box = one step; width = step time (illustrative)</text><text x="90" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">steps stay short and even; the new request&#x27;s first token arrives a little later</text><rect x="60" y="680" width="1280" height="110" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="679" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">Or separate them: prefill–decode disaggregation</text><text x="90" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">prefill on compute-tuned machines, decode on memory-tuned ones, the KV cache transferred between them</text></svg>