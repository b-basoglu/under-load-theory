<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="730" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 21 · CONTINUOUS PROFILING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Compare in CPU time per request, not percentages</text><rect x="60" y="150" width="520" height="500" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="484" height="6" rx="3" fill="#B7791F"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">Share of samples</text><text x="90" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">looks like a modest change</text><text x="90" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">masking, before</text><rect x="90" y="306" width="460" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="90" y="306" width="368.0" height="44" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="446.0" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="end">80%</text><text x="90" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">masking, after</text><rect x="90" y="426" width="460" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="90" y="426" width="423.2" height="44" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="501.20000000000005" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="end">92%</text><text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="start">shares are bounded by 100%,</text><text x="90" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="start">so a dominant function can&#x27;t grow much</text><text x="90" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="start">in share — however much slower it gets</text><rect x="610" y="150" width="730" height="500" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="628" y="149" width="694" height="6" rx="3" fill="#2B8A3E"/><text x="640" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">Absolute: share × CPU per request</text><text x="640" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">the same profiles, normalized by work done</text><text x="640" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">total CPU per request</text><rect x="640" y="304" width="168.0" height="26" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="818.0" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">1.0 ms</text><rect x="640" y="338" width="420.0" height="26" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1070.0" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">2.5 ms</text><text x="1310" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">before / after</text><text x="640" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">masking</text><rect x="640" y="414" width="134.4" height="26" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="784.4" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">0.8 ms</text><rect x="640" y="448" width="386.4" height="26" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1036.4" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">2.3 ms</text><text x="1310" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">before / after</text><text x="640" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6B7280" text-anchor="start">everything else</text><rect x="640" y="524" width="33.6" height="26" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="683.6" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">0.2 ms</text><rect x="640" y="558" width="33.6" height="26" rx="6" fill="#6B7280" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="683.6" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">0.2 ms</text><text x="1310" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">before / after</text><text x="640" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">masking nearly tripled; everything else didn&#x27;t move</text><text x="60" y="694" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="start">Round numbers, for illustration. Differential flame graphs must be normalized the same way.</text></svg>