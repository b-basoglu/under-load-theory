" y="736" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">1</text><text x="700" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">share of samples ≈ share of CPU time</text><text x="700" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">cheap: the program runs undisturbed between samples</text><text x="700" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">statistical: more samples → more precision (±√n)</text><text x="700" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">blind to rare, very short events and to waiting</text></svg>