eue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">Metric: CPU per request</text><text x="94" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">illustrative</text><line x1="110" y1="520" x2="630" y2="520" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="630" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><path d="M 110 470 L 360 470 L 360 330 L 610 330" fill="none" stroke="#2F5BEA" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="360" y1="270" x2="360" y2="520" stroke="#D9480F" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="368" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">Tuesday&#x27;s deploy</text><text x="94" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">It went up. It doesn&#x27;t say why.</text><rect x="730" y="150" width="610" height="480" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">Profile diff, per request</text><text x="764" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">the suspect</text><text x="764" y="296" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">re.compile</text><text x="1300" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="end">≈ unchanged (cached)</text><text x="764" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">the real cause</text><text x="764" y="406" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">mask_pii → re.sub</text><text x="1300" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="end">grew ~3×</text><text x="764" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">the masking loop ran three times</text><text x="764" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">Reverting the obvious suspect</text><text x="764" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">would have fixed nothing.</text></svg>