6B7280" text-anchor="middle">own write visible?</text><text x="720" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">never backwards?</text><text x="960" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">load on the primary</text><rect x="80" y="214" width="1240" height="70" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1" opacity="1"/><text x="100" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">spread across replicas</text><text x="100" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">depends entirely on lag</text><circle cx="470" cy="248" r="16" fill="#D9480F" stroke="none" stroke-width="0"/><text x="470" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✕</text><circle cx="720" cy="248" r="16" fill="#D9480F" stroke="none" stroke-width="0"/><text x="720" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="960" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">none</text><rect x="80" y="296" width="1240" height="70" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1" opacity="1"/><text x="100" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">primary for N s after a write</text><text x="100" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">leaks when lag &gt; N</text><circle cx="470" cy="330" r="16" fill="#B7791F" stroke="none" stroke-width="0"/><text x="470" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">~</text><circle cx="720" cy="330" r="16" fill="#B7791F" stroke="none" stroke-width="0"/><text x="720" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">~</text><text x="960" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">every recent writer</text><rect x="80" y="378" width="1240" height="70" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1" opacity="1"/><text x="100" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">sticky to one replica</text><text x="100" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">stuck on a slow replica</text><circle cx="470" cy="412" r="16" fill="#D9480F" stroke="none" stroke-width="0"/><text x="470" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✕</text><circle cx="720" cy="412" r="16" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="720" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="960" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">none</text><rect x="80" y="460" width="1240" height="70" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="100" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">log-position token</text><text x="100" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">facts, not guesses</text><circle cx="470" cy="494" r="16" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="470" y="501" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓</text><circle cx="720" cy="494" r="16" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="720" y="501" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="960" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">only reads no replica can serve</text><rect x="80" y="542" width="1240" height="70" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1" opacity="1"/><text x="100" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">everything on the primary</text><text x="100" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">replicas do nothing</text><circle cx="470" cy="576" r="16" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="470" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓</text><circle cx="720" cy="576" r="16" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="720" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="960" y="582" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">all reads</text><text x="60" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Only the token gets both guarantees while keeping reads on replicas.</text></svg>