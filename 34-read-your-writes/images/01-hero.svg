, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">Reads spread across replicas</text><text x="90" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">save &#x27;Sam (Billing)&#x27;</text><rect x="290" y="236" width="365" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="306" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">primary</text><text x="90" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">reload</text><rect x="290" y="290" width="365" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="306" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">lagging replica → &#x27;Sam&#x27;</text><text x="90" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">reload</text><rect x="290" y="344" width="365" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="306" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">fresh replica → &#x27;Sam (Billing)&#x27;</text><text x="90" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">reload</text><rect x="290" y="398" width="365" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="306" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">lagging replica → &#x27;Sam&#x27; again</text><circle cx=