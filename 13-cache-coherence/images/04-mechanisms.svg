<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="820" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 13 · CACHE COHERENCE</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Coherence mechanisms and their costs</text><text x="90" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">mechanism</text><text x="480" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">freshness</text><text x="900" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">cost</text><rect x="60" y="190" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="190" width="10" height="88" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="90" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">TTL only</text><text x="90" y="256" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">no coordination</text><text x="480" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">stale up to one TTL; copies disagree</text><text x="900" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#D9480F" text-anchor="start">free</text><rect x="60" y="294" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="294" width="10" height="88" rx="4" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="90" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Broadcast invalidation</text><text x="90" y="360" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">&quot;ticket 7 changed&quot; → drop copy</text><text x="480" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">stale for ~one message delivery</text><text x="900" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2F5BEA" text-anchor="start">an extra reload per change</text><rect x="60" y="398" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="398" width="10" height="88" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="90" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Update propagation</text><text x="90" y="464" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">&quot;ticket 7 is urgent, v12&quot;</text><text x="480" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">no reload needed</text><text x="900" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#B7791F" text-anchor="start">ordering + catch-up must be handled</text><rect x="60" y="502" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="502" width="10" height="88" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="90" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Synchronous update</text><text x="90" y="568" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">write every cache before acking</text><text x="480" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">freshest</text><text x="900" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#B7791F" text-anchor="start">write latency + coupling to every cache</text><rect x="60" y="606" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="606" width="10" height="88" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="90" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Validate on read</text><text x="90" y="672" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">&quot;still version 12?&quot; (ETag)</text><text x="480" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">exact at the moment of the check</text><text x="900" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2B8A3E" text-anchor="start">a small round trip per read</text><rect x="60" y="720" width="1280" height="60" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Common choice: broadcast invalidation for speed, TTL as the backstop for lost messages.</text></svg>