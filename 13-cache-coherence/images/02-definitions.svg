<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="700" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 13 · CACHE COHERENCE</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Coherence vs consistency</text><rect x="60" y="150" width="610" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#2F5BEA"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2F5BEA" text-anchor="start">Coherence</text><text x="94" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">do the copies converge?</text><text x="94" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• invalidations and updates</text><text x="94" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• versions on every value</text><text x="94" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• recovery after missed messages</text><text x="94" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">• a mechanism</text><rect x="730" y="150" width="610" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#B7791F" text-anchor="start">Consistency</text><text x="764" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">what may a reader see?</text><text x="764" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• always the latest</text><text x="764" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• read-your-writes</text><text x="764" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• at most N seconds old</text><text x="764" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">• a contract, per data type</text><rect x="60" y="600" width="1280" height="64" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Decide the contract for each data type first — then pick the coherence mechanism that meets it.</text></svg>