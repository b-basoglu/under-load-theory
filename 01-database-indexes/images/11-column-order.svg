<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="810" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 1 · DATABASE INDEXES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Column order decides which query the index serves</text><rect x="60" y="150" width="1280" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="620" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">My Queue (one agent, newest 50)</text><text x="990" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">lead view (whole workspace, newest 50)</text><text x="90" y="274" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">(workspace, assignee, updated_at)</text><text x="90" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">WHERE state &lt;&gt; &#x27;closed&#x27;</text><circle cx="634" cy="268" r="14" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="634" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="660" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">seek, read 50, stop</text><circle cx="1004" cy="268" r="14" fill="#B7791F" stroke="none" stroke-width="0"/><text x="1004" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">~</text><text x="1030" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">find workspace, then sort</text><text x="90" y="394" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">(assignee, workspace, updated_at)</text><text x="90" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">WHERE state &lt;&gt; &#x27;closed&#x27;</text><circle cx="634" cy="388" r="14" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="634" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="660" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">seek, read 50, stop</text><circle cx="1004" cy="388" r="14" fill="#D9480F" stroke="none" stroke-width="0"/><text x="1004" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✗</text><text x="1030" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">can&#x27;t find the workspace</text><text x="90" y="514" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">(updated_at, workspace, assignee)</text><text x="90" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">WHERE state &lt;&gt; &#x27;closed&#x27;</text><circle cx="634" cy="508" r="14" fill="#B7791F" stroke="none" stroke-width="0"/><text x="634" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">~</text><text x="660" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">walk newest tickets, filter</text><circle cx="1004" cy="508" r="14" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1004" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="1030" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">read the newest, stop</text><rect x="60" y="650" width="1280" height="120" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="649" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">Equality columns first, the sort column last. Each order is fast for some queries and slow for others.</text><text x="90" y="734" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">The lead view needs its own index, e.g. (workspace_id, updated_at DESC) WHERE state &lt;&gt; &#x27;closed&#x27;.</text></svg>