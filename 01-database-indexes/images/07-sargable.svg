<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="1030" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 1 · DATABASE INDEXES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Patterns that defeat an index</text><text x="60" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Can&#x27;t seek</text><text x="750" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">Can seek</text><text x="60" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Truncating a timestamp</text><rect x="60" y="220" width="640" height="64" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><circle cx="92" cy="252" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="92" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="124" y="259" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">date_trunc(&#x27;day&#x27;, created_at) = &#x27;2025-06-01&#x27;</text><line x1="706" y1="252" x2="742" y2="252" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="750" y="220" width="590" height="64" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="782" cy="252" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="259" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">created_at &gt;= &#x27;2025-06-01&#x27; AND &lt; &#x27;2025-06-02&#x27;</text><text x="60" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">COALESCE to find missing values</text><rect x="60" y="348" width="640" height="64" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><circle cx="92" cy="380" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="92" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="124" y="387" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">COALESCE(assignee_id, 0) = 0</text><line x1="706" y1="380" x2="742" y2="380" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="750" y="348" width="590" height="64" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="782" cy="380" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="387" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">assignee_id IS NULL  + partial index</text><text x="60" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Substring search</text><rect x="60" y="476" width="640" height="64" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><circle cx="92" cy="508" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="92" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="124" y="515" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">subject ILIKE &#x27;%chargeback%&#x27;</text><line x1="706" y1="508" x2="742" y2="508" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="750" y="476" width="590" height="64" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="782" cy="508" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="515" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">pg_trgm GIN index, or a search engine</text><text x="60" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Querying inside JSON</text><rect x="60" y="604" width="640" height="64" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><circle cx="92" cy="636" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="92" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="124" y="643" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">metadata-&gt;&gt;&#x27;channel&#x27; = &#x27;api&#x27;</text><line x1="706" y1="636" x2="742" y2="636" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="750" y="604" width="590" height="64" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="782" cy="636" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="643" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">expression index, or promote to a column</text><text x="60" y="716" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Type mismatch</text><rect x="60" y="732" width="640" height="64" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><circle cx="92" cy="764" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="92" y="772" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="124" y="771" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">id = 3481213.0   -- bigint vs numeric</text><line x1="706" y1="764" x2="742" y2="764" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="750" y="732" width="590" height="64" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="782" cy="764" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="772" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="771" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">id = 3481213</text><text x="60" y="844" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Skipping the first column</text><rect x="60" y="860" width="640" height="64" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><circle cx="92" cy="892" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="92" y="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="124" y="899" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">INDEX (workspace_id, assignee_id) · WHERE assignee_id = …</text><line x1="706" y1="892" x2="742" y2="892" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="750" y="860" width="590" height="64" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="782" cy="892" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="899" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">filter on workspace_id too, or add an index</text><text x="60" y="988" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B7280" text-anchor="start">The index is sorted by the stored value. Ask about a calculated value and the sort order can&#x27;t help.</text></svg>