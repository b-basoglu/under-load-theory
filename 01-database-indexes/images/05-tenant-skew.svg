<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="790" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 1 · DATABASE INDEXES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Your biggest tenant isn&#x27;t average</text><rect x="60" y="150" width="700" height="600" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">Tickets per workspace</text><text x="90" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">illustrative</text><text x="90" y="309" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">Halcyon (after import)</text><rect x="290" y="325" width="380.0" height="30" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="682.0" y="347" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">millions</text><text x="90" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">large customer</text><rect x="290" y="421" width="45.6" height="30" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="347.6" y="443" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">hundreds of thousands</text><text x="90" y="501" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">mid-size customer</text><rect x="290" y="517" width="11.4" height="30" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="313.4" y="539" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">tens of thousands</text><text x="90" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">typical workspace</text><rect x="290" y="613" width="6" height="30" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="308" y="635" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">a few thousand</text><text x="90" y="725" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">One workspace can hold most of the table.</text><rect x="800" y="150" width="540" height="185" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="818" y="149" width="504" height="6" rx="3" fill="#2B8A3E"/><circle cx="838" cy="200" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="838" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="870" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">Typical workspace</text><text x="838" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">the poor plan reads a few hundred rows:</text><text x="838" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">nobody notices</text><rect x="800" y="360" width="540" height="185" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="818" y="359" width="504" height="6" rx="3" fill="#D9480F"/><circle cx="838" cy="410" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="838" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="870" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">Halcyon</text><text x="838" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">the same plan reads thousands of rows</text><text x="838" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">per request, for every agent at once</text><rect x="800" y="580" width="540" height="170" rx="16" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="830" y="625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Why the planner gets it wrong</text><text x="830" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D5D9E0" text-anchor="start">• per-column statistics miss that Halcyon&#x27;s</text><text x="846" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D5D9E0" text-anchor="start">tickets are almost all closed</text><text x="830" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D5D9E0" text-anchor="start">• a reused generic plan ignores the values</text></svg>