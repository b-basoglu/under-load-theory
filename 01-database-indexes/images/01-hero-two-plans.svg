<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 1 · DATABASE INDEXES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Same query, two plans</text><rect x="60" y="150" width="610" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="94" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#D9480F" text-anchor="start">Before</text><text x="94" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#6B7280" text-anchor="start">three single-column indexes</text><text x="94" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Fetch all of the agent&#x27;s tickets</text><rect x="94" y="324" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="94" y="324" width="540.0" height="26" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="94" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Throw away the closed ones</text><rect x="94" y="406" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="94" y="406" width="496.8" height="26" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="94" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Sort what&#x27;s left by date</text><rect x="94" y="488" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="94" y="488" width="43.2" height="26" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="94" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Return 50</text><rect x="94" y="570" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="94" y="570" width="10.8" height="26" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="94" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">Work grows with the size of the tenant</text><text x="94" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">bar length = rows the database touches (illustrative)</text><rect x="730" y="150" width="610" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B8A3E" text-anchor="start">After</text><text x="764" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#6B7280" text-anchor="start">one composite partial index</text><text x="764" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Seek to (workspace, agent)</text><rect x="764" y="324" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="764" y="324" width="10" height="26" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="764" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Read 50 entries, already in order</text><rect x="764" y="406" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="764" y="406" width="10.8" height="26" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="764" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1A1D24" text-anchor="start">Stop</text><rect x="764" y="488" width="540" height="26" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="764" y="488" width="10" height="26" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="764" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Work stays at ~50 entries, whatever the size</text><text x="764" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">bar length = rows the database touches (illustrative)</text></svg>