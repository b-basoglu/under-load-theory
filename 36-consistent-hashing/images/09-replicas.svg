ddle">A#5</text><text x="559.1858428704209" y="581.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">✕</text><circle cx="475.0" cy="659.1858428704209" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="515.0" y="665.1858428704209" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">B#61</text><text x="475.0" y="665.1858428704209" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="281.33536703509617" cy="676.129302780759" r="18" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="241.33536703509617" y="682.129302780759" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A3FB8" text-anchor="middle">D#2</text><circle cx="143.8706972192411" cy="538.6646329649038" r="18" fill="#B7791F" stroke="none" stroke-width="0"/><text x="103.8706972192411" y="544.6646329649038" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">C#40</text><circle cx="160.81415712957912" cy="345.0" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="120.81415712957912" y="351.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">B#8</text><circle cx="262.79779979963917" cy="251.5492089815705" r="18" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="222.79779979963917" y="257.5492089815705" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A3FB8" text-anchor="middle">D#77</text><text x="360" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">walk clockwise</text><text x="360" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">from the key</text><rect x="680" y="170" width="660" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="698" y="169" width="624" height="6" rx="3" fill="#2F5BEA"/><text x="710" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">Replication factor 3</text><text x="710" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">1. A#17 → node A: first replica</text><text x="710" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">2. A#93 → node A again: skip</text><text x="710" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">3. C#4 → node C: second replica</text><text x="710" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">4. A#5 → node A again: skip</text><text x="710" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">5. B#61 → node B: third replica, done</text><text x="710" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Take the first N distinct physical nodes,</text><text x="710" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">not the first N tokens.</text><text x="710" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">Then apply topology rules</text><text x="710" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• copies in different racks or zones</text><text x="710" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• e.g. Cassandra NetworkTopologyStrategy</text><text x="710" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">The ring orders the candidates;</text><text x="710" y="666" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">topology decides which are acceptable.</text></svg>