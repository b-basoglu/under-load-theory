4" text-anchor="start">Worked example: five balanced nodes, then one ticket gets 10% of all reads</text><text x="90" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">node A</text><rect x="420" y="230" width="640" height="40" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="230" width="329.14285714285717" height="40" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1080" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">~18% of reads</text><text x="90" y="317" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">node B (owns the hot ticket)</text><rect x="420" y="290" width="640" height="40" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="290" width="512.0" height="40" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1080" y="317" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">~28% of reads</text><text x="90" y="377" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">node C</text><rect x="420" y="350" width="640" height="40" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="350" width="329.14285714285717" height="40" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1080" y="377" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">~18% of reads</text><text x="90" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">node D</text><rect x="420" y="410" width="640" height="40" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="410" width="329.14285714285717" height="40" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1080" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">~18% of reads</text><text x="90" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">node E</text><rect x="420" y="470" width="640" height="40" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="470" width="329.14285714285717" height="40" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1080" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">~18% of reads</text><text x="785.7142857142858" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">fair share 20%</text><line x1="785.7142857142858" y1="224" x2="785.7142857142858" y2="520" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="60" y="580" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="579" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">Placement decides where keys live; it can&#x27;t split one key</text><text x="90" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">B serves 10% (the hot key) + a fifth of the other 90% = 28%. More virtual nodes don&#x27;t change that.</text><text x="90" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">Fixes: local cache in front (Part 9), request coalescing (Part 12), copies of the key under several names, bounded loads.</text></svg>