1A1D24" text-anchor="start">Share of keys that change owner going from N to N+1 nodes (arithmetic, uniform hash)</text><text x="90" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">4 → 5 nodes</text><text x="300" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">mod N</text><rect x="420" y="236" width="760" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="236" width="608.0" height="34" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1038.0" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">80%  = N/(N+1)</text><text x="300" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">consistent</text><rect x="420" y="280" width="760" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="280" width="152.0" height="34" rx="6" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="582.0" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">20%  = 1/(N+1)</text><text x="90" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">9 → 10 nodes</text><text x="300" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">mod N</text><rect x="420" y="356" width="760" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="356" width="684.0" height="34" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1114.0" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">90%  = N/(N+1)</text><text x="300" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">consistent</text><rect x="420" y="400" width="760" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="400" width="76.0" height="34" rx="6" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="506.0" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">10%  = 1/(N+1)</text><text x="90" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">19 → 20 nodes</text><text x="300" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">mod N</text><rect x="420" y="476" width="760" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="476" width="722.0" height="34" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1152.0" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">95%  = N/(N+1)</text><text x="300" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">consistent</text><rect x="420" y="520" width="760" height="34" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="420" y="520" width="38.0" height="34" rx="6" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="468.0" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">5%  = 1/(N+1)</text><text x="90" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">With mod N, a bigger cluster makes adding one node worse. The minimum possible is the new node&#x27;s fair share.</text></svg>