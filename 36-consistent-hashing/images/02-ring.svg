<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="730" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 36 · CONSISTENT HASHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Nodes and keys on the same circle</text><circle cx="360" cy="450" r="230" fill="none" stroke="#D9D6CF" stroke-width="6"/><circle cx="507.84115022790405" cy="273.80977808263503" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="589.1247805611015" cy="429.95417916803865" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="475.0" cy="649.1858428704209" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="399.939080863394" cy="676.5057831928078" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="183.8097780826351" cy="597.8411502279041" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="133.49421680719215" cy="489.93908086339394" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="212.15884977209592" cy="273.8097780826351" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="320.060919136606" cy="223.49421680719215" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><circle cx="438.66463296490383" cy="233.8706972192411" r="22" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="438.66463296490383" y="240.8706972192411" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">A</text><circle cx="576.129302780759" cy="528.6646329649038" r="22" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="576.129302780759" y="535.6646329649038" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">B</text><circle cx="281.33536703509617" cy="666.129302780759" r="22" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="281.33536703509617" y="673.129302780759" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">C</text><circle cx="143.87069721924107" cy="371.3353670350962" r="22" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="143.87069721924107" y="378.3353670350962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">D</text><circle cx="563.0779463575532" cy="342.0215405592451" r="22" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="563.0779463575532" y="349.0215405592451" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">E</text><text x="360" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">hash space</text><text x="360" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">0 … 2⁶⁴, wraps around</text><rect x="680" y="170" width="660" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="698" y="169" width="624" height="6" rx="3" fill="#2F5BEA"/><text x="710" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">How it works</text><text x="710" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• hash each node to a point on the circle</text><text x="710" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• hash each key to a point on the same circle</text><text x="710" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• a key belongs to the next node clockwise</text><text x="710" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">Adding node E</text><text x="710" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">E lands between A and B and takes over the keys</text><text x="710" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">between A and E — from B only. Everything else stays.</text><text x="710" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">Removing a node</text><text x="710" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">its keys move to the next node clockwise;</text><text x="710" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">no other key moves</text><text x="710" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">mod N, by contrast, changes the owner of a key</text><text x="710" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">whenever N changes — N/(N+1) of keys for N → N+1</text></svg>