<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="745" viewBox="0 0 1400 745"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="745" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 27 · MESSAGE QUEUES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Consumer lag is a capacity signal</text><line x1="60" y1="165" x2="90" y2="165" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/><text x="100" y="171" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">1 consumer</text><line x1="223.0" y1="165" x2="253.0" y2="165" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/><text x="263.0" y="171" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">2 consumers</text><line x1="394.3" y1="165" x2="424.3" y2="165" stroke="#8A3FB8" stroke-width="3" stroke-linecap="round"/><text x="434.3" y="171" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">3 consumers</text><line x1="565.6" y1="165" x2="595.6" y2="165" stroke="#2B8A3E" stroke-width="3" stroke-linecap="round"/><text x="605.6" y="171" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">4 consumers</text><rect x="60" y="195" width="860" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><line x1="120" y1="610" x2="890" y2="610" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="120" y1="610" x2="120" y2="240" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="120" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">backlog (messages not yet processed)</text><text x="890" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><polyline points="120.0,610.0 890.0,274.0" fill="none" stroke="#D9480F" stroke-width="3.5" stroke-linejoin="round"/><text x="884" y="264.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="end">+280/s</text><polyline points="120.0,610.0 890.0,418.0" fill="none" stroke="#B7791F" stroke-width="3.5" stroke-linejoin="round"/><text x="884" y="408.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="end">+160/s</text><polyline points="120.0,610.0 890.0,562.0" fill="none" stroke="#8A3FB8" stroke-width="3.5" stroke-linejoin="round"/><text x="884" y="552.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="end">+40/s</text><polyline points="120.0,602.8 890.0,602.8" fill="none" stroke="#2B8A3E" stroke-width="3.5" stroke-linejoin="round"/><text x="884" y="592.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="end">flat</text><rect x="950" y="195" width="390" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="968" y="194" width="354" height="6" rx="3" fill="#2F5BEA"/><text x="980" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">The arithmetic</text><text x="980" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">illustrative rates</text><text x="980" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">publish rate  λ = 400 / s</text><text x="980" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">per consumer  μ ≈ 120 / s</text><rect x="980" y="392" width="330" height="54" rx="10" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1145" y="426" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">backlog grows by λ − n·μ</text><text x="980" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">n = 1 → +280 / s</text><text x="980" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">n = 2 → +160 / s</text><text x="980" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">n = 3 → +40 / s</text><text x="980" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">n = 4 → keeps up, drains</text><text x="980" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">Wait ≈ backlog ÷ drain rate</text><text x="60" y="705" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Lag that keeps growing isn&#x27;t a glitch: consumers are under capacity, and the backlog grows for as long as that&#x27;s true.</text></svg>