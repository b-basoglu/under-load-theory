ue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">saw solved has moved backwards.</text><text x="90" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">No error anywhere in the logs.</text><rect x="715" y="340" width="625" height="290" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="339" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Apply only if newer</text><text x="745" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">compare the event&#x27;s version with the stored one</text><rect x="745" y="450" width="124" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="807" y="478" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">v1</text><rect x="885" y="450" width="124" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="947" y="478" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">v2</text><rect x="1025" y="450" width="124" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1087" y="478" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">v3</text><rect x="1165" y="450" width="124" height="44" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1227" y="478" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">v1 skip</text><text x="7