<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="665" viewBox="0 0 1400 665"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="665" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 27 · MESSAGE QUEUES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Queue or log?</text><rect x="60" y="150" width="625" height="430" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2F5BEA" text-anchor="start">Queue</text><text x="90" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">RabbitMQ, SQS, ActiveMQ</text><circle cx="100" cy="282" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">a message goes to one consumer, then it&#x27;s gone</text><circle cx="100" cy="338" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">per-message ack, redelivery, DLQ built in</text><circle cx="100" cy="394" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">consumers scale freely; order is loose</text><circle cx="100" cy="450" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">routing, priorities, delays</text><circle cx="100" cy="506" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="512" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">good for: jobs, commands, task fan-out</text><rect x="715" y="150" width="625" height="430" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#8A3FB8"/><text x="745" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8A3FB8" text-anchor="start">Log</text><text x="745" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">Kafka, Kinesis, Redis Streams, Pulsar</text><circle cx="755" cy="282" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">messages stay for a retention period</text><circle cx="755" cy="338" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">each consumer group tracks its own offset</text><circle cx="755" cy="394" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">order per partition; parallelism = partitions</text><circle cx="755" cy="450" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">replay from any point in time</text><circle cx="755" cy="506" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="512" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">good for: event streams, many readers, rebuilds</text><text x="60" y="625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Both deliver at-least-once by default. The guarantee is decided by when the consumer acks or commits.</text></svg>