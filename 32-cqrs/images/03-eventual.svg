Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="start">Where the lag comes from</text><rect x="90.0" y="240" width="24.25" height="36" rx="6" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="104.125" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D24" text-anchor="middle">commit</text><rect x="118.25" y="240" width="222.0" height="36" rx="6" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="231.25" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">relay / CDC</text><rect x="344.25" y="240" width="80.74999999999999" height="36" rx="6" fill="#6B7280" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="386.625" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">broker</text><rect x="429.0" y="240" width="165.50000000000003" height="36" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="513.75" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">projector</text><rect x="598.5" y="240" width="52.499999999999986" height="36" rx="6" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="626.75" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">write</text><text x="90" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">healthy: tens to hundreds of ms</text><text x="90" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">deploy, backlog, outage: seconds to minutes</text><text x="90" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">the user&#x27;s own read right after a write</text><text x="90" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">usually lands inside that window</text><rect x="715" y="150" width="625" height="320" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Making &#x27;my own change&#x27; visible</text><text x="745" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• return the new state from the command itself</text><text x="745" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• overlay the user&#x27;s pending changes in the client</text><text x="745" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• read the write model for the item just changed</text><text x="745" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• pass the event version; wait until the</text><text x="745" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">  projection reaches it (bounded)</text><text x="745" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">define the freshness each query needs</text></svg>