if" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">comment_count = comment_count + 1</text><text x="90" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">event v7 delivered twice (at-least-once)</text><text x="90" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">row before</text><rect x="300" y="270" width="340" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="470" y="296" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">count 11 · v6</text><text x="90" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">apply v7</text><rect x="300" y="332" width="340" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="470" y="358" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">count 12 · v7</text><text x="90" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">apply v7 again</text><rect x="300" y="394" width="340" height="40" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="470" y="420" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">count 13 · v7  ✕</text><text x="90" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">wrong forever — no error anywhere</text><rect x="715" y="150" width="625" height="360" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">apply only if the event is newer</text><text x="745" y="240" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">UPDATE ticket_list_view</text><text x="745" y="270" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">   SET comment_count = comment_count + 1,</text><text x="745" y="300" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">       version = $v</text><text x="745" y="330" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start"> WHERE ticket_id = $id</text><text x="745" y="360" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">   AND version &lt; $v;</text><text x="745" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">duplicate of v7 when the row is at v7:</text><text x="745" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">0 rows match → no change; replays are safe</text><rect x="60" y="540" width="1280" height="120" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="539" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Divergence check</text><text x="90" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">periodically recompute a sample of rows from the write model and compare — drifted rows become an alert with ticket IDs</text></svg>