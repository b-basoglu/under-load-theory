#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="419" width="944" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Separating the two sides</text><text x="90" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">write side: invariants, validation, normalized for correctness</text><text x="90" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">read side: one model per query shape, denormalized, indexed for that query</text><text x="90" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">each projection can be rebuilt from the write model or the events</text><text x="90" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">CQRS does not require event sourcing: the write model here is ordinary tables</text></svg>