<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="575" viewBox="0 0 1400 575"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="575" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 32 · CQRS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">CQRS is not event sourcing</text><rect x="60" y="150" width="625" height="340" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2F5BEA" text-anchor="start">CQRS</text><circle cx="100" cy="262" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">separate models for writing and reading</text><circle cx="100" cy="318" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">write model can be ordinary tables</text><circle cx="100" cy="374" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">read models built from changes (events, CDC)</text><circle cx="100" cy="430" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">used for: read-heavy pages, search, dashboards</text><rect x="715" y="150" width="625" height="340" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#8A3FB8"/><text x="745" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8A3FB8" text-anchor="start">Event sourcing</text><circle cx="755" cy="262" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">the events ARE the source of truth</text><circle cx="755" cy="318" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">current state = replaying the event history</text><circle cx="755" cy="374" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">full audit and time travel built in</text><circle cx="755" cy="430" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">usually paired with CQRS — but not required</text><text x="60" y="535" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">CQRS without event sourcing is common: normalised tables + outbox events + projections.</text></svg>