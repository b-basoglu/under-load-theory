<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="690" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 42 · LOCKS VS LEASES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Expiry lets the next worker in; it doesn&#x27;t stop the last one</text><text x="60" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">worker A</text><line x1="220.0" y1="238" x2="1300.0" y2="238" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><rect x="220.0" y="220" width="64.80000000000001" height="36" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="252.4" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">lease</text><rect x="284.8" y="220" width="648.0" height="36" rx="6" fill="#EFEDE8" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="608.8" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle"></text><rect x="932.8" y="220" width="64.80000000000007" height="36" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="965.2" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle"></text><text x="60" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A3FB8" text-anchor="start">worker B</text><line x1="220.0" y1="348" x2="1300.0" y2="348" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><rect x="652.0" y="330" width="345.6" height="36" rx="6" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="824.8" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="middle">lease granted at 10 s · writes</text><line x1="652.0" y1="190" x2="652.0" y2="380" stroke="#D9480F" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="658.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="start">lease expires (TTL 10 s)</text><text x="457.6" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">frozen 15 s (GC pause)</text><text x="1010.56" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="start">writes anyway</text><text x="220.0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">0 s</text><text x="436.0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">5 s</text><text x="652.0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">10 s</text><text x="868.0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">15 s</text><text x="1084.0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">20 s</text><text x="1300.0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">25 s</text><rect x="60" y="450" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">Two holders</text><text x="90" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">the same invoice issued by both workers</text><text x="90" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">A&#x27;s check (&#x27;no invoice yet&#x27;) happened</text><text x="90" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">before the pause; it&#x27;s stale by the time it writes</text><rect x="715" y="450" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="449" width="589" height="6" rx="3" fill="#B7791F"/><text x="745" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">…and then a plain DEL</text><text x="745" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">A deletes the lock that now belongs to B</text><text x="745" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">worker A releases &#x27;its&#x27; lock — which is now B&#x27;s,</text><text x="745" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">letting a third worker in while B still works</text></svg>