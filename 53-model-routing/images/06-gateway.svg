<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="860" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 53 · MODEL ROUTING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A gateway routes for cost and for availability</text><rect x="60" y="300" width="220" height="120" rx="14" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="170" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="middle">support app</text><text x="170" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">every model call</text><line x1="284" y1="360" x2="356" y2="360" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="360" y="170" width="440" height="520" rx="18" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="580" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">LLM gateway</text><rect x="384" y="246" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">model registry: price, limits, approved types</text><rect x="384" y="308" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">rules + cheap classifier</text><rect x="384" y="370" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">validators → escalate on failure</text><rect x="384" y="432" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">circuit breaker, timeout, retry budget per model</text><rect x="384" y="494" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">prompt version per model</text><rect x="384" y="556" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">log: model, tokens, cost, latency, outcome</text><rect x="384" y="618" width="392" height="48" rx="8" fill="#2A2F39" stroke="#3A404C" stroke-width="1.5" opacity="1"/><text x="400" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="start">shadow, canary and holdout traffic</text><line x1="804" y1="430" x2="920" y2="226" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="930" y="190" width="410" height="72" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="954" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">small model</text><text x="954" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">ok</text><line x1="804" y1="430" x2="920" y2="366" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="930" y="330" width="410" height="72" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="954" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">large model</text><text x="954" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">ok</text><line x1="804" y1="430" x2="920" y2="506" stroke="#B7791F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-B7791F)"/><rect x="930" y="470" width="410" height="72" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="954" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">large model, provider B</text><text x="954" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">failover</text><line x1="804" y1="430" x2="920" y2="646" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="930" y="610" width="410" height="72" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1" stroke-dasharray="6 5"/><text x="954" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">provider A</text><text x="954" y="666" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">breaker open</text><rect x="60" y="720" width="1280" height="100" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="719" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">Falling back up keeps quality and raises cost; falling back down keeps the service up at lower quality —</text><text x="90" y="792" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">make it deliberate and visible. Each route needs its own prompt and evaluation, and prompt caches are per model.</text></svg>