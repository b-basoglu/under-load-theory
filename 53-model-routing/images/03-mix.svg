<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="840" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 53 · MODEL ROUTING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The saving depends on the traffic mix</text><text x="60" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">Illustrative units: large model = 1 per short answer, 10 per long answer; small model = 1/6 of large.</text><rect x="60" y="190" width="1280" height="220" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="189" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Mix A — a third each: extraction, article choice, calculation</text><text x="90" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">all large</text><rect x="330" y="266" width="800.0" height="44" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1144.0" y="295" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">4.00 per request</text><text x="90" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">extraction → small</text><rect x="330" y="328" width="744.0" height="44" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1088.0" y="357" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">3.72 per request</text><text x="1310" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="end">≈ 7% less</text><rect x="60" y="440" width="1280" height="220" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="439" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Mix B — 80% extraction, 15% article choice, 5% calculation</text><text x="90" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">all large</text><rect x="330" y="516" width="290.0" height="44" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="634.0" y="545" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">1.45 per request</text><text x="90" y="608" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">extraction → small</text><rect x="330" y="578" width="156.0" height="44" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="500.0" y="607" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">0.78 per request</text><text x="1310" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="end">≈ 46% less</text><rect x="60" y="700" width="1280" height="100" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="699" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">Same rule, same models. Routing saves in proportion to the cost spent on work the cheap model can do.</text><text x="90" y="774" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">First step: measure requests, input and output tokens by type — then choose the router.</text></svg>