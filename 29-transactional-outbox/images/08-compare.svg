<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="705" viewBox="0 0 1400 705"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="705" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 29 · TRANSACTIONAL OUTBOX</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Polling relay or CDC?</text><rect x="60" y="150" width="625" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2F5BEA" text-anchor="start">Polling relay</text><circle cx="100" cy="262" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">a worker and two SQL statements</text><circle cx="100" cy="320" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">latency ≈ polling interval</text><circle cx="100" cy="378" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">queries the DB even when idle</text><circle cx="100" cy="436" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">outbox rows must be marked and cleaned up</text><circle cx="100" cy="494" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">ordering: one worker per shard</text><circle cx="100" cy="552" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="120" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">no extra infrastructure</text><rect x="715" y="150" width="625" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#8A3FB8"/><text x="745" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8A3FB8" text-anchor="start">Debezium (CDC)</text><circle cx="755" cy="262" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">Kafka Connect + connector + slot</text><circle cx="755" cy="320" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">latency: low, driven by the WAL stream</text><circle cx="755" cy="378" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">reads the WAL; no queries on the table</text><circle cx="755" cy="436" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">rows can be deleted in the same transaction</text><circle cx="755" cy="494" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">order of the WAL, keyed by aggregate</text><circle cx="755" cy="552" r="6" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="775" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">slot, WAL and connector to operate</text><text x="60" y="665" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Both are at-least-once. Start with polling at modest volume; move to CDC when latency or DB load matters.</text></svg>