<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="710" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 29 · TRANSACTIONAL OUTBOX</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Without Debezium: a polling relay</text><rect x="60" y="150" width="700" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="90" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">relay loop</text><text x="90" y="230" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">SELECT seq, aggregate_id, payload FROM outbox</text><text x="90" y="260" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start"> WHERE published_at IS NULL</text><text x="90" y="290" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start"> ORDER BY seq LIMIT 200</text><text x="90" y="320" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start"> FOR UPDATE SKIP LOCKED;</text><text x="90" y="350" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">-- send each to Kafka, wait for acks</text><text x="90" y="380" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">UPDATE outbox SET published_at = now()</text><text x="90" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start"> WHERE seq = ANY($1);  COMMIT;</text><text x="90" y="440" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">-- empty batch? sleep(interval)</text><rect x="790" y="150" width="550" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="808" y="149" width="514" height="6" rx="3" fill="#2F5BEA"/><text x="820" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Polling interval vs latency</text><text x="820" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">an event waits for the next poll</text><line x1="830" y1="300" x2="1300" y2="300" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="830.0" y1="286" x2="830.0" y2="314" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="830.0" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F5BEA" text-anchor="middle">poll</text><line x1="947.5" y1="286" x2="947.5" y2="314" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="947.5" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F5BEA" text-anchor="middle">poll</text><line x1="1065.0" y1="286" x2="1065.0" y2="314" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="1065.0" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F5BEA" text-anchor="middle">poll</text><line x1="1182.5" y1="286" x2="1182.5" y2="314" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="1182.5" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F5BEA" text-anchor="middle">poll</text><line x1="1300.0" y1="286" x2="1300.0" y2="314" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="1300.0" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F5BEA" text-anchor="middle">poll</text><circle cx="965.125" cy="300" r="8" fill="#B7791F" stroke="none" stroke-width="0"/><text x="951.125" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="end">commit</text><path d="M 965.125 266 Q 1015.0625 230 1061.0 282" fill="none" stroke="#B7791F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B7791F)"/><text x="820" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">average wait ≈ half the interval, worst ≈ the interval</text><text x="820" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">shorter interval → lower latency, more idle queries</text><text x="820" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">LISTEN/NOTIFY wakes the relay on commit; poll as fallback</text><rect x="60" y="510" width="1280" height="160" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Relay crashes after sending, before UPDATE … published_at</text><text x="90" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">rows are still unpublished → the next poll sends the same batch again → nothing lost, some events twice</text><text x="90" y="634" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">Marking first would lose events instead. At-least-once: consumers dedupe by event_id.</text></svg>