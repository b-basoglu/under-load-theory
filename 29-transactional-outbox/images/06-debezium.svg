 fill="#1A1D24" text-anchor="middle">PostgreSQL</text><text x="175.0" y="242.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">outbox_events INSERT</text><rect x="340" y="170" width="230" height="100" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="455.0" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="middle">WAL</text><text x="455.0" y="242.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">replication slot</text><rect x="620" y="170" width="300" height="100" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="770.0" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="middle">Debezium connector</text><text x="770.0" y="242.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Kafka Connect, pgoutput</text><rect x="970" y="170" width="370" height="100" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1155.0" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="middle">outbox.event.Ticket</text><text x="1155.0" y="242.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">key = aggregateid · value = payload</text><line x1="294" y1="220" x2="336" y2="220" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="574" y1="220" x2="616" y2="220" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="924" y1="220" x2="966" y2="220" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="770" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">EventRouter SMT: route by aggregatetype, key by aggregateid</text><rect x="60" y="330" width="620" height="280" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">connector config (excerpt)</text><text x="90" y="404" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;connector.class&quot;: &quot;…PostgresConnector&quot;,</text><text x="90" y="434" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;plugin.name&quot;: &quot;pgoutput&quot;,</text><text x="90" y="464" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;table.include.list&quot;: &quot;public.outbox_events&quot;,</text><text x="90" y="494" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;transforms&quot;: &quot;outbox&quot;,</text><text x="90" y="524" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;transforms.outbox.type&quot;:</text><text x="90" y="554" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">  &quot;io.debezium.transforms.outbox.EventRouter&quot;</text><rect x="710" y="330" width="630" height="280" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="728" y="329" width="594" height="6" rx="3" fill="#2B8A3E"/><text x="740" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">What changes for the application</text><text x="740" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">nothing: insert into the outbox in the same tx</text><text x="740" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">rows can be deleted in that same transaction —</text><text x="740" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">the insert is still in the WAL, the table stays empty</text><text x="740" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">Connect worker restarts from its last saved</text><text x="740" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">offset: nothing lost, events since that flush</text><text x="740" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">are published again</text></svg>