<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="690" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 29 · TRANSACTIONAL OUTBOX</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">More relay workers, broken order</text><rect x="60" y="150" width="1280" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Two workers with SKIP LOCKED: different batches, sent concurrently</text><text x="90" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">worker 1</text><rect x="200" y="234" width="200" height="38" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="300" y="259" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">48213 v1</text><rect x="400" y="234" width="380" height="38" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="590" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">slow send / retry</text><text x="90" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">worker 2</text><rect x="300" y="294" width="200" height="38" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="400" y="319" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">48213 v2</text><line x1="504" y1="313" x2="840" y2="313" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="784" y1="253" x2="840" y2="280" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="850" y="240" width="450" height="100" rx="10" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="870" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">partition (key = 48213)</text><rect x="870" y="286" width="120" height="38" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="930" y="311" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">v2</text><rect x="1000" y="286" width="120" height="38" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1060" y="311" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">v1</text><text x="90" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Same key, same partition — wrong order. A consumer applying events as they arrive moves the ticket backwards.</text><rect x="60" y="480" width="1280" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="479" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Fix: shard by aggregate, not by row</text><text x="90" y="566" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">WHERE published_at IS NULL AND abs(hashtext(aggregate_id)) % N = worker_index</text><text x="90" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">All events of one ticket go through one worker, published in order. Consumers still check versions.</text></svg>