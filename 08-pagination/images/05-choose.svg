<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 8 · PAGINATION</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Choosing a pagination strategy</text><rect x="60" y="150" width="610" height="400" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#B7791F" text-anchor="start">Use OFFSET for</text><circle cx="112" cy="262" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">small, bounded lists (admin screens, settings)</text><circle cx="112" cy="328" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">jumping to a page by number</text><circle cx="112" cy="394" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">data that doesn&#x27;t change while paging</text><circle cx="112" cy="460" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">search results capped at a few pages</text><rect x="730" y="150" width="610" height="400" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B8A3E" text-anchor="start">Use cursors for</text><circle cx="782" cy="262" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">large lists: feeds, queues, activity</text><circle cx="782" cy="328" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">public APIs, syncs and exports</text><circle cx="782" cy="394" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">data that changes while someone pages</text><circle cx="782" cy="460" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">anything walked from start to end</text><rect x="60" y="580" width="1280" height="180" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="579" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">Cursors still don&#x27;t solve</text><text x="90" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• a sort key that changes while paging (updated_at) — rows can repeat or vanish</text><text x="90" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• an exact point-in-time snapshot — use a high-water mark or CDC, not a long transaction</text></svg>