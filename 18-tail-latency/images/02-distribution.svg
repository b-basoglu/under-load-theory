ight="700" fill="#B7791F" text-anchor="middle">2%</text><text x="90" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">P50 ≈ 40 ms</text><text x="360" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">P99 &gt; 1 s</text><text x="90" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">mean ≈ 65 ms</text><rect x="730" y="150" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2F5BEA"/><text x="760" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">Service B: consistently ~65 ms</text><text x="760" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">share of calls by latency (illustrative)</text><line x1="780" y1="500" x2="1300" y2="500" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="780.0" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">10 ms</text><text x="880.1578150369157" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">30 ms</text><text x="989.9210924815421" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">100 ms</text><text x="1090.0789075184578" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">300 ms</text><text x="1199.8421849630843" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">1 s</text><text x="1300.0" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">3 s</text><rect x="932.6476599193057" y="280.0" width="36" height="220.0" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="950.6476599193057" y="270.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">100%</text><text x="760" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">P50 ≈ 65 ms</text><text x="1030" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">P99 ≈ 70 ms</text><text x="760" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">mean ≈ 65 ms</text><text x="60" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">The mean squashes the distribution into one number — and throws away the slow 2% users remember.</text></svg>