ial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">Unchanged: every decode step, which still reads the whole context&#x27;s keys and values — cached prefix included.</text><text x="90" y="674" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">Illustrative timeline, not to scale.</text></svg>