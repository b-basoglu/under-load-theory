<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="690" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 49 · CONTEXT CACHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Reuse the prefix&#x27;s KV cache; compute only the rest</text><rect x="60" y="160" width="900" height="70" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="510.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">shared prefix: instructions + tools + policies</text><rect x="970" y="160" width="370" height="70" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1155.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="middle">new suffix: the customer&#x27;s message</text><text x="510" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">keys and values looked up by hash of (model + exact tokens)</text><text x="1155" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">prefilled now (a few dozen tokens)</text><rect x="60" y="310" width="400" height="290" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="309" width="364" height="6" rx="3" fill="#2F5BEA"/><text x="88" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">Context (prefix) caching</text><text x="88" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• stores internal computation, not answers</text><text x="88" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the model runs on every request</text><text x="88" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• output = what recomputation gives</text><text x="88" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• needs an exact token match from the start</text><rect x="500" y="310" width="400" height="290" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="518" y="309" width="364" height="6" rx="3" fill="#8A3FB8"/><text x="528" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8A3FB8" text-anchor="start">Response caching</text><text x="528" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• stores the final answer</text><text x="528" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the model doesn&#x27;t run on a hit</text><text x="528" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• only for identical requests</text><text x="528" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• answers can go stale (Part 9)</text><rect x="940" y="310" width="400" height="290" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="958" y="309" width="364" height="6" rx="3" fill="#D9480F"/><text x="968" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">Semantic caching</text><text x="968" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• stores answers by meaning</text><text x="968" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• returns an answer to a similar question</text><text x="968" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• can answer the wrong question</text><text x="968" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• a product decision, not just speed</text><text x="60" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Only context caching keeps the answer exactly as fresh as without a cache.</text></svg>