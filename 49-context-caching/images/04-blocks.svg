enlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#B7791F" text-anchor="middle">h6a = H(h5, ·)</text><line x1="1152" y1="192" x2="1166" y2="192" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="60" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Request B</text><rect x="220" y="360" width="170" height="64" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="305" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">block 1</text><text x="305" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="middle">You are the</text><text x="305" y="456" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#2F5BEA" text-anchor="middle">h1 = H(·)</text><rect x="410" y="360" width="170" height="64" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="495" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">block 2</text><text x="495" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="middle">support asst.</text><text x="495" y="456" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#2F5BEA" text-anchor="middle">h2 = H(h1, ·)</text><line x1="392" y1="392" x2="406" y2="392" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="600" y="360" width="170" height="64" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="685" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">block 3</text><text x="685" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="middle">Tools: …</text><text x="685" y="456" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#2F5BEA" text-anchor="middle">h3 = H(h2, ·)</text><line x1="582" y1="392" x2="596" y2="392" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="790" y="360" width="170" height="64" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="875" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">block 4</text><text x="875" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="middle">Refunds: …</text><text x="875" y="456" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#2F5BEA" text-anchor="middle">h4 = H(h3, ·)</text><line x1="772" y1="392" x2="786" y2="392" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="980" y="360" width="170" height="64" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1065" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">block 5</text><text x="1065" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="middle">Escalate: …</text><text x="1065" y="456" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#2F5BEA" text-anchor="middle">h5 = H(h4, ·)</text><line x1="962" y1="392" x2="976" y2="392" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="1170" y="360" width="170" height="64" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1255" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">block 6</text><text x="1255" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#1A1D24" text-anchor="middle">Q: password</text><text x="1255" y="456" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#B7791F" text-anchor="middle">h6b = H(h5, ·)</text><line x1="1152" y1="392" x2="1166" y2="392" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="210" y="150" width="950" height="330" rx="14" fill="none" stroke="#2B8A3E" stroke-width="2.5" opacity="1" stroke-dasharray="8 6"/><text x="685" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">same hash chain → blocks 1–5 are computed once and shared (reference-counted)</text><rect x="60" y="550" width="1280" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="549" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="1300" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">H(parent hash, this block&#x27;s tokens)</text><text x="90" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">How a self-hosted engine finds the cached part (vLLM automatic prefix caching)</text><text x="90" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the KV cache is stored in fixed-size blocks (16 tokens by default); only full blocks are cached</text><text x="90" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• walk the new request&#x27;s block hashes from the start; every hit is reused, the first miss is where prefill starts</text><text x="90" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• unused cached blocks stay until memory is needed, then the least recently used are overwritten</text></svg>