<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="850" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 49 · CONTEXT CACHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A prefix cache is only as good as the routing in front of it</text><rect x="60" y="150" width="610" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">Round-robin</text><text x="90" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">same prefix lands anywhere</text><rect x="90" y="260" width="150" height="60" rx="10" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="165" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">router</text><rect x="420" y="250" width="220" height="85" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="440" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">replica 1</text><rect x="420" y="355" width="220" height="85" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="440" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">replica 2</text><rect x="420" y="460" width="220" height="85" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="440" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">replica 3</text><line x1="240" y1="290" x2="414" y2="295" stroke="#D9480F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="440" y="296" width="84" height="28" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="482" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5BEA" text-anchor="middle">Halcyon</text><rect x="532" y="296" width="84" height="28" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="574" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">others</text><line x1="240" y1="290" x2="414" y2="400" stroke="#D9480F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="440" y="401" width="84" height="28" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="482" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5BEA" text-anchor="middle">Halcyon</text><rect x="532" y="401" width="84" height="28" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="574" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">others</text><line x1="240" y1="290" x2="414" y2="505" stroke="#D9480F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="440" y="506" width="84" height="28" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="482" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5BEA" text-anchor="middle">Halcyon</text><rect x="532" y="506" width="84" height="28" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="574" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">others</text><text x="90" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">every replica builds and holds its own copy;</text><text x="90" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">hit rate falls as replicas are added</text><rect x="730" y="150" width="610" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="760" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">Cache-aware routing</text><text x="760" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">same prefix → same replica</text><rect x="760" y="260" width="150" height="60" rx="10" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="835" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">router</text><rect x="1090" y="250" width="220" height="85" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1110" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">replica 1</text><rect x="1090" y="355" width="220" height="85" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1110" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">replica 2</text><rect x="1090" y="460" width="220" height="85" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1110" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">replica 3</text><line x1="910" y1="290" x2="1084" y2="295" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="1110" y="296" width="176" height="28" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="1198" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5BEA" text-anchor="middle">Halcyon</text><line x1="910" y1="290" x2="1084" y2="400" stroke="#B7791F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-B7791F)"/><rect x="1110" y="401" width="176" height="28" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="1198" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">tenants A–M</text><line x1="910" y1="290" x2="1084" y2="505" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="1110" y="506" width="176" height="28" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="1198" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B8A3E" text-anchor="middle">tenants N–Z</text><text x="760" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">hash of prefix or session (consistent hashing),</text><text x="760" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">overridden when that replica&#x27;s queue is too long</text><rect x="60" y="700" width="1280" height="110" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="699" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="744" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">Locality vs balance: routing purely by prefix turns the biggest tenant into a hot spot.</text><text x="90" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">After a deploy every cache is cold — warm new replicas with the common prefixes before they take traffic.</text></svg>