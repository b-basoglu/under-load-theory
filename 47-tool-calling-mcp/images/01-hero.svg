<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 47 · TOOL CALLING &amp; MCP</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Where the truth lives decides the mechanism</text><rect x="60" y="160" width="1280" height="100" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="160" width="10" height="100" rx="4" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="92" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">“How long is the refund window on annual plans?”</text><text x="92" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">written down → documents</text><rect x="1040" y="186" width="270" height="48" rx="10" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1175" y="217" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">RAG</text><rect x="60" y="280" width="1280" height="100" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="280" width="10" height="100" rx="4" fill="#8A3FB8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="92" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">“Which plan is CUS-10442 on, and how many seats are left?”</text><text x="92" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">changes daily → billing system</text><rect x="1040" y="306" width="270" height="48" rx="10" fill="#8A3FB8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="1175" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Tool call</text><rect x="60" y="400" width="1280" height="100" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="400" width="10" height="100" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">“Refund INV-881.”</text><text x="92" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">changes the world → billing API</text><rect x="1040" y="426" width="270" height="48" rx="10" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1175" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Write tool + guards</text><rect x="60" y="530" width="1280" height="210" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="529" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">And MCP?</text><text x="90" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">Not a fourth way to know things — the standard plug between AI applications and the systems behind tools.</text><text x="90" y="652" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">One MCP server for the ticketing product serves the support assistant, Halcyon&#x27;s internal agent and an IDE agent.</text><text x="90" y="704" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">Rule of thumb: documents → retrieve · live systems → call · many apps × many systems → standardize the plug</text></svg>