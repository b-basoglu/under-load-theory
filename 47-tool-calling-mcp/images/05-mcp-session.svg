f" text-anchor="middle">Client (in the host)</text><line x1="300" y1="210" x2="300" y2="700" stroke="#D9D6CF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="950" y="150" width="300" height="56" rx="10" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1100" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Server</text><line x1="1100" y1="210" x2="1100" y2="700" stroke="#D9D6CF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/><line x1="310" y1="250" x2="1088" y2="250" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="700" y="240" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">server/discover   (optional)</text><circle cx="110" cy="250" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="110" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="1090" y1="300" x2="312" y2="300" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="700" y="290" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">{supportedVersions, capabilities, serverInfo}</text><line x1="310" y1="360" x2="1088" y2="360" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="700" y="350" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">tools/list   _meta: {protocolVersion, clientCapabilities}</text><circle cx="110" cy="360" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="110" y="367" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="1090" y1="410" x2="312" y2="410" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="700" y="400" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">{tools: [{name, description, inputSchema}, …]}</text><line x1="310" y1="470" x2="1088" y2="470" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="700" y="460" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">tools/call  {name: &quot;get_customer&quot;, arguments: {…}}</text><circle cx="110" cy="470" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="110" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="1090" y1="520" x2="312" y2="520" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="700" y="510" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">{content: [...], isError: false}</text><line x1="310" y1="580" x2="1088" y2="580" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="700" y="570" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">subscriptions/listen  {toolsListChanged: true}</text><circle cx="110" cy="580" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="110" y="587" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="1090" y1="630" x2="312" y2="630" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="700" y="620" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">notifications/tools/list_changed</text><text x="140" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">Describe</text><text x="140" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">Discover</text><text x="140" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">Use</text><text x="140" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">React to change</text><rect x="60" y="700" width="1280" height="80" rx="14" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="90" y="734" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Stateless JSON-RPC 2.0 (spec 2026-07-28): every request carries its version; no handshake, no session.</text><text x="90" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#D5D9E0" text-anchor="start">Over stdio (local subprocess) or Streamable HTTP (remote, OAuth 2.1). A new server tool needs no client code change.</text></svg>