<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="720" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 40 · LEADER ELECTION</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The leader that doesn&#x27;t know it was replaced</text><line x1="200.0" y1="240" x2="1280.0" y2="240" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="200.0" y1="380" x2="1280.0" y2="380" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="90" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">ing-a</text><text x="90" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A3FB8" text-anchor="start">ing-b</text><rect x="215.42857142857142" y="225" width="216.00000000000003" height="30" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="323.42857142857144" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">leader, epoch 7</text><line x1="431.42857142857144" y1="200" x2="431.42857142857144" y2="262" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="431.42857142857144" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5BEA" text-anchor="middle">checks lease: OK</text><rect x="431.42857142857144" y="225" width="617.142857142857" height="30" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="740.0" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">frozen mid-batch (8 s) — its lease expires 5 s after the last renewal</text><rect x="1048.5714285714284" y="225" width="108.0" height="30" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1102.5714285714284" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#D9480F" text-anchor="middle">writes</text><rect x="832.5714285714286" y="365" width="447.42857142857144" height="30" rx="6" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="1056.2857142857142" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="middle">new leader, epoch 8 — same emails</text><text x="200.0" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">0 s</text><text x="354.2857142857143" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">2 s</text><text x="508.57142857142856" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">4 s</text><text x="662.8571428571429" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">6 s</text><text x="817.1428571428571" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">8 s</text><text x="971.4285714285714" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">10 s</text><text x="1125.7142857142858" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">12 s</text><text x="1280.0" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">14 s</text><rect x="60" y="480" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="479" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">No fencing</text><text x="90" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">epoch 7&#x27;s writes land after epoch 8 began</text><text x="90" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">checking leadership first doesn&#x27;t help:</text><text x="90" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">the pause falls between the check and the write</text><rect x="715" y="480" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="479" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Epoch checked where the write lands</text><text x="745" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">epoch 7 &lt; 8 → rejected</text><text x="745" y="610" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">UPDATE fence SET max_epoch = :e</text><text x="745" y="634" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="start">  WHERE max_epoch &lt;= :e</text></svg>