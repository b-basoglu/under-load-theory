 sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">No coordination</text><rect x="260" y="220" width="225" height="60" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="372.5" y="256.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">support mailbox</text><rect x="90" y="350" width="175" height="64" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="177.5" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">ing-a</text><text x="177.5" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">polls</text><line x1="178" y1="346" x2="372" y2="284" stroke="#D9480F" stroke-width="2" stroke-linecap="round"/><rect x="285" y="350" width="175" height="64" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="372.5" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">ing-b</text><text x="372.5" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">polls</text><line x1="373" y1="346" x2="372" y2="284" stroke="#D9480F" stroke-width="2" stroke-linecap="round"/><rect x="480" y="350" width="175" height="64" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="567.5" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">ing-c</text><text x="567.5" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">polls</text><line x1="568" y1="346" x2="372" y2="284" stroke="#D9480F" stroke-width="2" stroke-linecap="round"/><text x="90" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">the same email fetched by two or three instances</text><text x="90" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">→ duplicate tickets, duplicate auto-replies</text><text x="90" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">→ agents work the same request twice</text><text x="90" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start"></text><rect x="715" y="150" width="625" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">One elected leader</text><rect x="915" y="220" width="225" height="60" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1027.5" y="256.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">support mailbox</text><rect x="745" y="350" width="175" height="64" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="832.5" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">ing-a</text><text x="832.5" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">leader</text><line x1="833" y1="346" x2="1027" y2="284" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round"/><rect x="940" y="350" width="175" height="64" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1027.5" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9D6CF" text-anchor="middle">ing-b</text><text x="1027.5" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">follower, watching</text><rect x="1135" y="350" width="175" height="64" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1222.5" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9D6CF" text-anchor="middle">ing-c</text><text x="1222.5" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">follower, watching</text><text x="745" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">exactly one instance polls at a time</text><text x="745" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">→ if it dies, a follower takes over</text><text x="745" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">→ availability of three, duplicates of one</text><text x="745" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">the hard part: the seconds when two believe they lead</text><text x="60" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Elect the leader through a quorum-backed store; fence its writes with an epoch.</text></svg>