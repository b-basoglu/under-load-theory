="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">longer than real pauses,</text><text x="694.0" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">within the job&#x27;s tolerance</text><rect x="60" y="600" width="625" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="599" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">Leader crashes</text><text x="90" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">no work until the lease expires and a follower wins</text><text x="90" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">clean shutdown: resign, so handover is immediate</text><rect x="715" y="600" width="625" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="599" width="589" height="6" rx="3" fill="#B7791F"/><text x="745" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">Leader pauses (GC, throttling, VM freeze)</text><text x="745" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">stops renewing exactly like a dead one</text><text x="745" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">pause &gt; TTL → needless election, flapping</text></svg>