<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="890" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 51 · SPECULATIVE DECODING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The best draft length depends on acceptance</text><rect x="60" y="150" width="1280" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><line x1="160" y1="620" x2="1000" y2="620" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="620" x2="160" y2="220" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="580.0" y="666" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">draft tokens per round, k</text><text x="148" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">speedup (formula)</text><line x1="160" y1="505.7142857142857" x2="1000" y2="505.7142857142857" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="148" y="510.7142857142857" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">1×</text><line x1="160" y1="391.42857142857144" x2="1000" y2="391.42857142857144" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="148" y="396.42857142857144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">2×</text><line x1="160" y1="277.14285714285717" x2="1000" y2="277.14285714285717" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="148" y="282.14285714285717" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">3×</text><text x="160.0" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">1</text><text x="389.0909090909091" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">4</text><text x="694.5454545454545" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">8</text><text x="1000.0" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">12</text><path d="M 160 424 L 236 366 L 313 327 L 389 300 L 465 283 L 542 273 L 618 268 L 695 267 L 771 268 L 847 272 L 924 277 L 1000 282" fill="none" stroke="#2B8A3E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="694.5454545454545" cy="266.6194808163265" r="8" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1020" y="287.4912790674285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">α = 0.8: best k ≈ 8</text><path d="M 160 446 L 236 416 L 313 404 L 389 400 L 465 402 L 542 406 L 618 412 L 695 418 L 771 424 L 847 430 L 924 436 L 1000 442" fill="none" stroke="#2F5BEA" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="389.0909090909091" cy="400.4190476190476" r="8" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="1020" y="446.6617981074286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">α = 0.6: best k ≈ 4</text><path d="M 160 468 L 236 458 L 313 459 L 389 463 L 465 468 L 542 474 L 618 479 L 695 484 L 771 489 L 847 493 L 924 497 L 1000 501" fill="none" stroke="#B7791F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="236.36363636363637" cy="457.92207792207796" r="8" fill="#B7791F" stroke="none" stroke-width="0"/><text x="1020" y="505.95317986742856" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">α = 0.4: best k ≈ 2</text><text x="90" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Computed from the idealized formula with a draft costing 5% of a target step — the shape, not a measurement.</text><rect x="60" y="740" width="1280" height="110" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="739" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="784" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">Each extra draft token costs c, and only helps if every token before it was accepted (probability α^k).</text><text x="90" y="818" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">High acceptance favours long drafts; low acceptance favours short ones. Engines can adapt k at runtime.</text></svg>