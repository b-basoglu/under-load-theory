<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 51 · SPECULATIVE DECODING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The acceptance rule keeps the target&#x27;s distribution exactly</text><rect x="60" y="150" width="760" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Next-token probabilities (illustrative)</text><rect x="140" y="260.0" width="56" height="300.0" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="204" y="410.0" width="56" height="150.0" rx="4" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="200" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">card</text><text x="168" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">0.50</text><text x="232" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">0.25</text><rect x="305" y="470.0" width="56" height="90.0" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="369" y="290.0" width="56" height="270.0" rx="4" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="365" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">next</text><text x="333" y="462.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">0.15</text><text x="397" y="282.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">0.45</text><rect x="470" y="410.0" width="56" height="150.0" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="534" y="500.0" width="56" height="60.0" rx="4" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="530" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">bank</text><text x="498" y="402.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">0.25</text><text x="562" y="492.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">0.10</text><rect x="635" y="500.0" width="56" height="60.0" rx="4" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><rect x="699" y="440.0" width="56" height="120.0" rx="4" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="695" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">acct</text><text x="663" y="492.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">0.10</text><text x="727" y="432.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">0.20</text><line x1="110" y1="560" x2="790" y2="560" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><rect x="140" y="640" width="18" height="18" rx="3" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="166" y="655" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">target p(x)</text><rect x="320" y="640" width="18" height="18" rx="3" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="346" y="655" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">draft q(x)</text><rect x="850" y="150" width="490" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="868" y="149" width="454" height="6" rx="3" fill="#2F5BEA"/><text x="880" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">Speculative sampling</text><text x="880" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">draft samples x from q</text><text x="880" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">accept with probability</text><text x="880" y="320" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">min(1, p(x) / q(x))</text><text x="880" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">&quot;card&quot;: p ≥ q → always kept</text><text x="880" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">&quot;next&quot;: 0.15 / 0.45 → kept 1 time in 3</text><text x="880" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">on rejection, sample from</text><text x="880" y="480" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">max(0, p − q), renormalized</text><text x="880" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">— what the draft under-weighted</text><text x="880" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Result: tokens distributed exactly</text><text x="880" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">as if the target sampled alone.</text><text x="880" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">α = overlap of p and q</text><text x="880" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">(1 − total variation distance)</text></svg>