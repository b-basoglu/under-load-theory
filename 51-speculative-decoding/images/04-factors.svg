<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="880" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 51 · SPECULATIVE DECODING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Three numbers decide the speedup</text><rect x="60" y="150" width="410" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="374" height="6" rx="3" fill="#2F5BEA"/><text x="88" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5BEA" text-anchor="start">α  acceptance rate</text><text x="88" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">how often the target agrees</text><text x="88" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">with the draft</text><text x="88" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start"></text><text x="88" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">high: boilerplate, copied text</text><text x="88" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">low: names, numbers, reasoning</text><rect x="490" y="150" width="410" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="508" y="149" width="374" height="6" rx="3" fill="#2B8A3E"/><text x="518" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">c  draft cost</text><text x="518" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">draft step ÷ target step</text><text x="518" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start"></text><text x="518" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">tiny draft: a few percent</text><text x="518" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">heavy draft: a third or a half —</text><text x="518" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">drafting eats the gain</text><rect x="920" y="150" width="410" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="938" y="149" width="374" height="6" rx="3" fill="#B7791F"/><text x="948" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#B7791F" text-anchor="start">verification cost</text><text x="948" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">k + 1 tokens in one pass</text><text x="948" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">≈ 1 step only if memory-bound</text><text x="948" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start"></text><text x="948" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">large batches or CPUs:</text><text x="948" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">close to k + 1 steps</text><rect x="60" y="510" width="1280" height="110" rx="14" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="560" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">speedup ≈ (1 − α^(k+1)) / ((1 − α) · (k·c + 1))</text><text x="700" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#B8BEC9" text-anchor="middle">tokens kept per round  ÷  cost of a round in target steps (assumes verify = 1 step)</text><rect x="60" y="650" width="1280" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Formula values at k = 4 (not benchmarks; real systems land below them)</text><text x="90" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">α 0.8 · c 0.05</text><rect x="90" y="748" width="260" height="30" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="90" y="748" width="242.66666666666663" height="30" rx="6" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="324.66666666666663" y="769" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="end">2.8×</text><line x1="176.66666666666669" y1="744" x2="176.66666666666669" y2="782" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="400" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">α 0.8 · c 0.5</text><rect x="400" y="748" width="260" height="30" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="400" y="748" width="95.33333333333334" height="30" rx="6" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="503.33333333333337" y="769" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">1.1×</text><line x1="486.6666666666667" y1="744" x2="486.6666666666667" y2="782" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="710" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">α 0.3 · c 0.05</text><rect x="710" y="748" width="260" height="30" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="710" y="748" width="103.99999999999999" height="30" rx="6" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="822.0" y="769" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">1.2×</text><line x1="796.6666666666666" y1="744" x2="796.6666666666666" y2="782" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="1020" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">α 0.3 · c 0.5</text><rect x="1020" y="748" width="260" height="30" rx="6" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="1020" y="748" width="43.33333333333333" height="30" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1071.3333333333333" y="769" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">0.5×</text><line x1="1106.6666666666667" y1="744" x2="1106.6666666666667" y2="782" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="90" y="814" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">dashed line = 1× (no change); the last case is twice as slow as plain decoding</text></svg>