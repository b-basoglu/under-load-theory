vetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start">Plain decoding</text><text x="90" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">one full pass of the big model per token</text><rect x="90" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="146" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 1</text><rect x="214" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="270" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 2</text><rect x="338" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="394" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 3</text><rect x="462" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="518" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 4</text><rect x="586" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="642" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 5</text><rect x="710" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="766" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 6</text><rect x="834" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="890" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 7</text><rect x="958" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1014" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 8</text><rect x="1082" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1138" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 9</text><rect x="1206" y="250" width="112" height="60" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1262" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">target 10</text><text x="90" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">10 tokens = 10 target passes, strictly one after another</text><rect x="60" y="410" width="1280" height="290" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="409" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">Speculative decoding</text><text x="90" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">a cheap draft guesses k tokens; one target pass checks them all</text><rect x="90" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><rect x="124" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><rect x="158" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><rect x="192" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="154" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">draft ×4</text><rect x="234" y="504" width="150" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="309" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">target verify</text><text x="309" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D24" text-anchor="middle">→ 4 tokens kept</text><rect x="404" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><rect x="438" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><rect x="472" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><rect x="506" y="512" width="28" height="44" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="468" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">draft ×4</text><rect x="548" y="504" width="150" height="60" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="623" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">target verify</text><text x="623" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" 