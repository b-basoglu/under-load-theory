nt-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Exports are back, baby! Let us…</text><rect x="964" y="402" width="345" height="60" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="982" y="439" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Behold: your CSVs, restored…</text><rect x="964" y="484" width="345" height="60" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="982" y="521" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Good news — the export bug is fixed…</text><text x="964" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">Some are off-tone; a person must review</text><rect x="60" y="690" width="1280" height="70" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="734" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Sample several, then let a person or a ranker choose — variety is only useful with a selection step.</text></svg>