<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="810" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 43 · SAMPLING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The decoding pipeline</text><rect x="60" y="170" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2.5" opacity="1"/><text x="175" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="middle">Logits</text><text x="175" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">one score per token</text><line x1="294" y1="230" x2="318" y2="230" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="322" y="170" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#D9480F" stroke-width="2.5" opacity="1"/><text x="437" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="middle">Penalties</text><text x="437" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">repetition, frequency, presence</text><line x1="556" y1="230" x2="580" y2="230" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="584" y="170" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2.5" opacity="1"/><text x="699" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#8A3FB8" text-anchor="middle">Temperature</text><text x="699" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">divide by T</text><line x1="818" y1="230" x2="842" y2="230" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="846" y="170" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><text x="961" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5BEA" text-anchor="middle">Truncation</text><text x="961" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">top-k, top-p, min-p</text><line x1="1080" y1="230" x2="1104" y2="230" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="1108" y="170" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5" opacity="1"/><text x="1223" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="middle">Pick a token</text><text x="1223" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">sample, or take the max</text><text x="60" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">Order shown is the common one (e.g. Hugging Face Transformers). Greedy decoding skips sampling — not the penalties.</text><rect x="60" y="370" width="1280" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="369" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">Where the effective settings come from</text><circle cx="110" cy="468" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="475" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="144" y="475" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Library defaults</text><text x="480" y="475" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">what the SDK or server does when nothing is set</text><circle cx="110" cy="518" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="144" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Model&#x27;s generation_config.json</text><text x="480" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">recommended temperature, top-k, top-p, repetition penalty — loaded automatically</text><circle cx="110" cy="568" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="575" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="144" y="575" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Provider API defaults</text><text x="480" y="575" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">often temperature 1 when the request omits it</text><circle cx="110" cy="618" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="110" y="625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="144" y="625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">The request</text><text x="480" y="625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">what the code actually sets</text><rect x="60" y="700" width="1280" height="70" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="744" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Log the merged, effective configuration with every request — not just what the code set.</text></svg>