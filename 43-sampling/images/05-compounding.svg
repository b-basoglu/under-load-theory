<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="840" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 43 · SAMPLING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Small per-token risks compound</text><rect x="60" y="150" width="1280" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Chance that every token of an n-token answer stays on the model&#x27;s top choice when sampling at T = 1</text><text x="90" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">illustrative: top token holds 0.98 of the probability at each step  ·  computed as 0.98ⁿ</text><text x="90" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">1 token</text><rect x="250" y="276" width="900" height="38" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="250" y="276" width="882.0" height="38" rx="8" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1146.0" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">0.98</text><text x="90" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">5 tokens</text><rect x="250" y="350" width="900" height="38" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="250" y="350" width="813.5287171199999" height="38" rx="8" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1077.5287171199998" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">0.90</text><text x="90" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">10 tokens</text><rect x="250" y="424" width="900" height="38" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="250" y="424" width="735.365526198792" height="38" rx="8" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="999.365526198792" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">0.82</text><text x="90" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">20 tokens</text><rect x="250" y="498" width="900" height="38" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="250" y="498" width="600.8471745795848" height="38" rx="8" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="864.8471745795848" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">0.67</text><text x="90" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">40 tokens</text><rect x="250" y="572" width="900" height="38" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="250" y="572" width="401.13036355585564" height="38" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="665.1303635558556" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">0.45</text><text x="90" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">a priority label ≈ 1–3 tokens  ·  an order number ≈ several  ·  a tool call&#x27;s JSON arguments ≈ dozens</text><rect x="60" y="700" width="1280" height="100" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="699" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="744" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Greedy decoding takes the top token every time and pays none of this.</text><text x="90" y="776" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">Lower temperature shrinks the risk per step; only the maximum removes it.</text></svg>