<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="730" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 39 · VECTOR CLOCKS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Detecting a conflict is half the job</text><rect x="60" y="180" width="300" height="90" rx="12" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="210.0" y="221.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8A3FB8" text-anchor="middle">mobile: [0,1,0]</text><text x="210.0" y="245.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">tags +vip</text><rect x="60" y="320" width="300" height="90" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="210.0" y="361.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="middle">region2: [2,0,1]</text><text x="210.0" y="385.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">tags +billing</text><rect x="470" y="240" width="300" height="110" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="620.0" y="291.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">siblings</text><text x="620.0" y="315.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">both kept, both visible</text><rect x="880" y="240" width="400" height="110" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1080.0" y="291.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">merge → [2,1,1] + new edit</text><text x="1080.0" y="315.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">tags = vip ∪ billing</text><line x1="364" y1="225" x2="466" y2="280" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="364" y1="365" x2="466" y2="315" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="774" y1="295" x2="876" y2="295" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="60" y="450" width="625" height="240" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">How to merge depends on the data</text><text x="90" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• sets (tags, watchers): union</text><text x="90" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• counters: per-replica counts, summed</text><text x="90" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• text: three-way merge, or CRDTs</text><text x="90" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• a status: a business rule, or ask the user</text><rect x="715" y="450" width="625" height="240" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="449" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">What the store does</text><text x="745" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">1. keeps concurrent versions as siblings</text><text x="745" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">2. a read returns all siblings + causal context</text><text x="745" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">3. the merged write supersedes them all</text><text x="745" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">older (dominated) versions are simply dropped</text></svg>