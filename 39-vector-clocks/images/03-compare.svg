<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="690" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 39 · VECTOR CLOCKS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Comparing two versions</text><rect x="60" y="150" width="1280" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="150" width="10" height="100" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="96" y="194" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400" fill="#1A1D24" text-anchor="start">[2,1,0]  vs  [2,2,0]</text><text x="96" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">every entry ≤, one strictly less</text><text x="1310" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="end">happened before — newer replaces older</text><rect x="60" y="270" width="1280" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="270" width="10" height="100" rx="4" fill="#6B7280" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="96" y="314" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400" fill="#1A1D24" text-anchor="start">[2,2,0]  vs  [2,2,0]</text><text x="96" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">all entries equal</text><text x="1310" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6B7280" text-anchor="end">the same version</text><rect x="60" y="390" width="1280" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="390" width="10" height="100" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="96" y="434" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400" fill="#1A1D24" text-anchor="start">[2,1,0]  vs  [1,2,0]</text><text x="96" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">web is ahead in one, mobile in the other</text><text x="1310" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="end">concurrent — neither saw the other</text><rect x="60" y="510" width="1280" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="510" width="10" height="100" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="96" y="554" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400" fill="#1A1D24" text-anchor="start">[3,0,0]  vs  [2,5,1]</text><text x="96" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">first is ahead on web, second on mobile and region2</text><text x="1310" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="end">concurrent — even though 2+5+1 &gt; 3</text><text x="60" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Each entry counts one replica&#x27;s edits that the version includes, so comparing entries is comparing histories.</text></svg>