<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 39 · VECTOR CLOCKS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Offline edits, synced later: what survives?</text><rect x="60" y="160" width="400" height="80" rx="12" fill="#F3E8FA" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="260.0" y="196.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A3FB8" text-anchor="middle">mobile (offline): tags + vip</text><text x="260.0" y="220.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">phone clock a little slow</text><rect x="60" y="270" width="400" height="80" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="260.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="middle">web, other region: tags + billing</text><text x="260.0" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">made without seeing the other edit</text><rect x="60" y="400" width="1280" height="90" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="400" width="10" height="90" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="96" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">Last-write-wins, wall clock</text><text x="96" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">keeps the edit with the later timestamp</text><text x="820" y="440" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">tags = {billing}</text><text x="820" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">vip lost — nobody told</text><rect x="60" y="504" width="1280" height="90" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="504" width="10" height="90" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="96" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Last-write-wins, Lamport clock</text><text x="96" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">keeps the edit with the larger counter</text><text x="820" y="544" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">tags = {one of them}</text><text x="820" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">the other lost — order is invented</text><rect x="60" y="608" width="1280" height="90" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="608" width="10" height="90" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="96" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Vector clocks + merge</text><text x="96" y="674" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">[0,1,0] vs [2,0,1]: concurrent → keep both</text><text x="820" y="648" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">tags = {vip, billing}</text><text x="820" y="676" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">both edits survive</text><line x1="464" y1="200" x2="600" y2="255" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="464" y1="310" x2="600" y2="265" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="610" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">sync: which version wins?</text><text x="60" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">A single number always produces an order. Concurrent edits need a summary of what each version has seen.</text></svg>