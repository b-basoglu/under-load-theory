<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="700" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 22 · TOKEN VS LEAKY BUCKET</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Same limit, very different behavior</text><rect x="60" y="150" width="1280" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">A sync job sends 300 requests in 1 second, then nothing for 59 · limit: 10/s on average</text><text x="90" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">requests accepted from the burst · worked example from each algorithm&#x27;s definition</text><text x="90" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">fixed window</text><rect x="410" y="256" width="880" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="410" y="256" width="29.333333333333332" height="44" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="449.3333333333333" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">10 of 300</text><text x="90" y="350.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">sliding window</text><rect x="410" y="322" width="880" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="410" y="322" width="29.333333333333332" height="44" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="449.3333333333333" y="350.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">10 of 300</text><text x="90" y="416.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">token bucket, capacity 10</text><rect x="410" y="388" width="880" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="410" y="388" width="58.666666666666664" height="44" rx="8" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="478.6666666666667" y="416.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">~20 of 300</text><text x="90" y="482.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">token bucket, capacity 100</text><rect x="410" y="454" width="880" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="410" y="454" width="322.6666666666667" height="44" rx="8" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="742.6666666666667" y="482.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">~110 of 300</text><text x="90" y="548.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">leaky bucket, queue 100</text><rect x="410" y="520" width="880" height="44" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="410" y="520" width="322.6666666666667" height="44" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="742.6666666666667" y="548.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">~110 of 300</text><text x="60" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">The leaky bucket accepts as many — but releases them at 10/s, so the last one waits about 10 s.</text></svg>