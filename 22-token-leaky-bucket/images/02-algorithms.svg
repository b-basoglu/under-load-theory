<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="680" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 22 · TOKEN VS LEAKY BUCKET</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Four rate limiters</text><rect x="60" y="150" width="625" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#D9480F" text-anchor="start">Fixed window</text><text x="90" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• count per clock second</text><text x="90" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• reset at the boundary</text><text x="90" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• cheap, but 2× at edges</text><rect x="715" y="150" width="625" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#B7791F"/><text x="745" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#B7791F" text-anchor="start">Sliding window</text><text x="745" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• count in the last 1 s from now</text><text x="745" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• log or weighted estimate</text><text x="745" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• strict, no bursts</text><rect x="60" y="410" width="625" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="409" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B8A3E" text-anchor="start">Token bucket</text><text x="90" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• capacity B, refill r/s</text><text x="90" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• each request takes a token</text><text x="90" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• bursts up to B, average r</text><rect x="530" y="470" width="110" height="140" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5" opacity="1"/><circle cx="560" cy="585" r="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2"/><circle cx="585" cy="585" r="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2"/><circle cx="610" cy="585" r="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2"/><circle cx="560" cy="559" r="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2"/><circle cx="585" cy="559" r="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2"/><line x1="585" y1="440" x2="585" y2="466" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="600" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="start">+r/s</text><rect x="715" y="410" width="625" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="409" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="745" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2F5BEA" text-anchor="start">Leaky bucket (queue)</text><text x="745" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• bounded queue</text><text x="745" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• leaves at exactly r/s</text><text x="745" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">• smooth output, adds waiting</text><rect x="1185" y="470" width="110" height="120" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><line x1="1240" y1="592" x2="1240" y2="624" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="1255" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="start">r/s</text></svg>