<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="770" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 44 · HALLUCINATIONS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Why a model makes things up</text><rect x="60" y="150" width="1280" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">How well the fact is represented in training data</text><text x="90" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">the model produces a likely continuation in every case — only on the left is likely also true</text><defs><linearGradient id="rep" x1="0" x2="1"><stop offset="0" stop-color="#2B8A3E"/><stop offset="0.5" stop-color="#B7791F"/><stop offset="1" stop-color="#D9480F"/></linearGradient></defs><rect x="120" y="300" width="1160" height="16" rx="8" fill="url(#rep)"/><circle cx="154.8" cy="308" r="11" fill="#FFFFFF" stroke="#1A1D24" stroke-width="3"/><text x="154.8" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">seen constantly</text><text x="154.8" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">capital of France, Python syntax</text><circle cx="502.8" cy="308" r="11" fill="#FFFFFF" stroke="#1A1D24" stroke-width="3"/><text x="502.8" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="start">seen a few times</text><text x="502.8" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">a niche library&#x27;s API</text><circle cx="990.0" cy="308" r="11" fill="#FFFFFF" stroke="#1A1D24" stroke-width="3"/><text x="990.0" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="end">seen once</text><text x="990.0" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="end">one page&#x27;s exact wording</text><circle cx="1245.2" cy="308" r="11" fill="#FFFFFF" stroke="#1A1D24" stroke-width="3"/><text x="1245.2" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="end">never seen</text><text x="1245.2" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="end">private, after cutoff</text><text x="120" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">usually right</text><text x="1280" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="end">the typical-sounding answer, stated just as fluently</text><rect x="60" y="510" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="264" height="6" rx="3" fill="#8A3FB8"/><text x="84" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="start">Likely ≠ true</text><text x="84" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">training rewards text that looks</text><text x="84" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">like the corpus, not accuracy</text><rect x="385" y="510" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="403" y="509" width="264" height="6" rx="3" fill="#8A3FB8"/><text x="409" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="start">Guessing is rewarded</text><text x="409" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">right/wrong grading gives no</text><text x="409" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">credit for “I don&#x27;t know”</text><rect x="710" y="510" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="728" y="509" width="264" height="6" rx="3" fill="#8A3FB8"/><text x="734" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="start">No marker on guesses</text><text x="734" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">memories and guesses come</text><text x="734" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">from the same mechanism</text><rect x="1035" y="510" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="1053" y="509" width="264" height="6" rx="3" fill="#8A3FB8"/><text x="1059" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="start">Early commitment</text><text x="1059" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">“refunded within …” already</text><text x="1059" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">demands a specific number</text><text x="60" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Bigger models know more well-known facts. No model can know a policy it was never shown.</text></svg>