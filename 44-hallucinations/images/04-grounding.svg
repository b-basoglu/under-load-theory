<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 44 · HALLUCINATIONS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Grounding: answers come from evidence</text><rect x="60" y="170" width="220" height="90" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="170.0" y="209.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="middle">Question</text><text x="170.0" y="235.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">from the customer</text><rect x="360" y="150" width="260" height="80" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="490.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">Retrieval</text><text x="490.0" y="210.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">policies, help center (Part 46)</text><line x1="284" y1="215" x2="356" y2="190" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="360" y="250" width="260" height="80" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="490.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">Tools</text><text x="490.0" y="310.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">plan, invoices (Part 47)</text><line x1="284" y1="215" x2="356" y2="290" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="360" y="350" width="260" height="80" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="490.0" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">Records</text><text x="490.0" y="410.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">account, contract</text><line x1="284" y1="215" x2="356" y2="390" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="700" y="150" width="330" height="280" rx="14" fill="#FFFFFF" stroke="#8A3FB8" stroke-width="2.5" opacity="1"/><text x="724" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A3FB8" text-anchor="start">Prompt</text><text x="724" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• evidence, with source IDs,</text><text x="738" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">versions and dates</text><text x="724" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• “answer only from it”</text><text x="724" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• “say if it&#x27;s not there”</text><text x="724" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• cite what you used</text><line x1="624" y1="190" x2="696" y2="290" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="624" y1="290" x2="696" y2="290" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="624" y1="390" x2="696" y2="290" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="1100" y="170" width="240" height="90" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1220.0" y="209.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="middle">Answer</text><text x="1220.0" y="235.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">with citations</text><line x1="1034" y1="260" x2="1096" y2="220" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="1100" y="300" width="240" height="90" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1220.0" y="339.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="middle">Verify</text><text x="1220.0" y="365.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">claims vs evidence</text><line x1="1220" y1="264" x2="1220" y2="296" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="60" y="470" width="1280" height="270" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="469" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">What changes</text><text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">The model&#x27;s job shifts from “recall the answer” to “read the evidence and answer from it”.</text><text x="90" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">Every claim can be traced to a source a person — or code — can check.</text><text x="90" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">When retrieval finds nothing relevant, the system answers “not found” and hands off instead of guessing.</text><text x="90" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">Citations are claims too: check that each cited passage actually supports its sentence.</text></svg>