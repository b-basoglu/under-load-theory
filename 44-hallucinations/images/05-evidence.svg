ica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">what the model tends to do</text><text x="960" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">design response</text><rect x="60" y="190" width="1280" height="110" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="190" width="10" height="110" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="90" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Right, current evidence</text><text x="90" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">refund policy v3 (current)</text><line x1="470" y1="245" x2="540" y2="245" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="560" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">“45 days” — usually correct</text><text x="960" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">verify faithfulness anyway</text><rect x="60" y="320" width="1280" height="110" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="320" width="10" height="110" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="90" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Wrong evidence</text><text x="90" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">monthly-plan policy, another contract</text><line x1="470" y1="375" x2="540" y2="375" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="560" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">answers from it anyway</text><text x="960" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">check relevance, scores, sources</text><rect x="60" y="450" width="1280" height="110" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="450" width="10" height="110" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="90" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Stale evidence</text><text x="90" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">old article: “30 days”</text><line x1="470" y1="505" x2="540" y2="505" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="560" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">wrong, with a citation</text><text x="960" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">version metadata; remove old versions</text><rect x="60" y="580" width="1280" height="110" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="580" width="10" height="110" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="90" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">No relevant evidence</text><text x="90" y="654" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">nothing above threshold</text><line x1="470" y1="635" x2="540" y2="635" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="560" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">falls back on memory</text><text x="960" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">decide “not found” in code</text><text x="60" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">A faithful answer from a stale document is fully grounded — and wrong.</text></svg>