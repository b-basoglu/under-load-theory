<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 44 · HALLUCINATIONS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Two kinds of hallucination</text><rect x="60" y="150" width="610" height="340" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="94" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D9480F" text-anchor="start">Factuality error</text><text x="94" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#6B7280" text-anchor="start">false about the world</text><text x="94" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">Question</text><rect x="210" y="272" width="426" height="52" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="228" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">“What&#x27;s the refund window?”</text><text x="94" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">Answer</text><rect x="210" y="356" width="426" height="52" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="228" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">“30 days” — real policy: 45</text><text x="94" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Main fix: ground it in authoritative evidence</text><rect x="730" y="150" width="610" height="340" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="764" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#B7791F" text-anchor="start">Faithfulness error</text><text x="764" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#6B7280" text-anchor="start">not supported by the sources it was given</text><text x="764" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">Source</text><rect x="880" y="272" width="426" height="52" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="898" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">ticket thread: no credit offered</text><text x="764" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">Summary</text><rect x="880" y="356" width="426" height="52" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="898" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">“the customer was offered a credit”</text><text x="764" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">Main fix: verify claims against the source</text><rect x="60" y="520" width="1280" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="519" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F5BEA" text-anchor="start">Within faithfulness errors</text><text x="90" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">Intrinsic — contradicts the source: the document says 45 days, the answer says 30.</text><text x="90" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">Extrinsic — adds what the source never mentions: a confident paragraph on partial refunds.</text><text x="90" y="682" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">Extrinsic additions are often true and still risky: nothing in the evidence can confirm them.</text></svg>