<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="790" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 44 · HALLUCINATIONS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Ask it about your own product</text><rect x="60" y="140" width="1280" height="60" rx="10" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="90" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="start">“How long do we have to request a refund on our annual plan?”</text><rect x="60" y="230" width="610" height="480" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="229" width="574" height="6" rx="3" fill="#D9480F"/><text x="94" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D9480F" text-anchor="start">From memory</text><text x="94" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#6B7280" text-anchor="start">no policy in the prompt</text><rect x="94" y="340" width="542" height="100" rx="12" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="116" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">“Annual plans can be refunded within</text><text x="116" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">30 days of the invoice date.”</text><circle cx="110" cy="484" r="6" fill="#D9480F" stroke="none" stroke-width="0"/><text x="130" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">fluent, specific, polite</text><circle cx="110" cy="528" r="6" fill="#D9480F" stroke="none" stroke-width="0"/><text x="130" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">the typical answer on the internet</text><circle cx="110" cy="572" r="6" fill="#D9480F" stroke="none" stroke-width="0"/><text x="130" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">no source to check it against</text><text x="94" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">Confidently wrong</text><rect x="730" y="230" width="610" height="480" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="229" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B8A3E" text-anchor="start">Grounded</text><text x="764" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#6B7280" text-anchor="start">current policy + account record in the prompt</text><rect x="764" y="340" width="542" height="100" rx="12" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="786" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">“Annual plans can be refunded within</text><text x="786" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1D24" text-anchor="start">45 days of the invoice date.” [Refund policy §2]</text><circle cx="780" cy="484" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="800" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">every number traceable to a source</text><circle cx="780" cy="528" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="800" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">citation can be checked in code</text><circle cx="780" cy="572" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="800" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">“not found” is an allowed answer</text><text x="764" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">Checkable</text><text x="60" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="start">Same model, same question. The difference is whether the answer comes from evidence or from what sounds typical.</text></svg>