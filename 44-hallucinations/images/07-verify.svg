<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 44 · HALLUCINATIONS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Verify claims against the source, independently</text><text x="560" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">catches</text><text x="960" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">misses</text><rect x="60" y="186" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="186" width="10" height="88" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="104" cy="230" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="136" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Deterministic checks</text><text x="136" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">numbers, dates, names, IDs appear in the evidence</text><text x="560" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B8A3E" text-anchor="start">invented details</text><text x="960" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">a faithful copy of the wrong page</text><rect x="60" y="290" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="290" width="10" height="88" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><circle cx="104" cy="334" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="341" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="136" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Citation checks</text><text x="136" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">cited passage exists, is authoritative, contains the claim</text><text x="560" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B8A3E" text-anchor="start">fake or irrelevant citations</text><text x="960" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">claims without citations</text><rect x="60" y="394" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="394" width="10" height="88" rx="4" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><circle cx="104" cy="438" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="104" y="445" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="136" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Business rules</text><text x="136" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">refund ≤ paid, date in range, plan exists</text><text x="560" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B8A3E" text-anchor="start">impossible values</text><text x="960" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">plausible wrong values</text><rect x="60" y="498" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="498" width="10" height="88" rx="4" fill="#8A3FB8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><circle cx="104" cy="542" r="17" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="104" y="549" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="136" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Separate judge model</text><text x="136" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">“is this claim supported by this passage?”</text><text x="560" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B8A3E" text-anchor="start">paraphrased unsupported claims</text><text x="960" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">has its own error rate</text><rect x="60" y="602" width="1280" height="88" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="602" width="10" height="88" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><circle cx="104" cy="646" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="104" y="653" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="136" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Human review</text><text x="136" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">for refunds, contracts, account changes</text><text x="560" y="654" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B8A3E" text-anchor="start">most things</text><text x="960" y="654" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">doesn&#x27;t scale — use by consequence</text><text x="60" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Cheap checks on every answer, people on the ones that matter. Self-review by the same model isn&#x27;t on the list.</text></svg>