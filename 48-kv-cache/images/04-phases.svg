dth="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="889" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="922" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="945" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="978" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1001" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="1034" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1057" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="1090" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1113" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="1146" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1169" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="1202" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1225" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><rect x="1258" y="230" width="46" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1281" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">t</text><line x1="90" y1="330" x2="510" y2="330" stroke="#2F5BEA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="300" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="middle">time to first token (TTFT)</text><line x1="530" y1="330" x2="576" y2="330" stroke="#2B8A3E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="600" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">inter-token latency, one token per step →</text><text x="90" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">Longer prompt → longer prefill bar. Longer cache → each decode step slightly slower.</text><rect x="60" y="450" width="610" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="574" height="6" rx="3" fill="#2F5BEA"/><text x="94" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2F5BEA" text-anchor="start">Prefill</text><text x="636" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="end">compute-bound</text><circle cx="104" cy="546" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="122" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">thousands of tokens at once = big matrix multiplies</text><circle cx="104" cy="594" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="122" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">time grows with prompt length</text><circle cx="104" cy="642" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="122" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">sets time to first token</text><circle cx="104" cy="690" r="6" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="122" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">chunked prefill keeps it from stalling others</text><rect x="730" y="450" width="610" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="449" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B8A3E" text-anchor="start">Decode</text><text x="1306" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="end">memory-bandwidth-bound</text><circle cx="774" cy="546" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="792" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">one token per step = little arithmetic</text><circle cx="774" cy="594" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="792" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">reads all weights + this sequence&#x27;s cache</text><circle cx="774" cy="642" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="792" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">e.g. 16 GB of weights ÷ 3.35 TB/s ≈ 5 ms per step</text><circle cx="774" cy="690" r="6" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="792" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1A1D24" text-anchor="start">batching shares weight reads across sequences</text></svg>