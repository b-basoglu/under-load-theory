<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 48 · KV CACHE</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What attention needs at each step</text><rect x="60" y="150" width="1280" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">One layer, one head — generating the token after “days”</text><text x="90" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">keys (K) and values (V) of earlier tokens never change: causal masking means they never see later tokens</text><rect x="90" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="148" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Refund</text><rect x="90" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="117" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="152" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="179" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="222" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="280" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">for</text><rect x="222" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="249" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="284" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="311" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="354" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="412" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">annual</text><rect x="354" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="381" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="416" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="443" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="486" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="544" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">plans</text><rect x="486" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="513" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="548" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="575" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="618" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="676" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">is</text><rect x="618" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="645" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="680" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="707" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="750" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="808" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">within</text><rect x="750" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="777" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="812" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="839" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="882" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="940" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">45</text><rect x="882" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="909" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="944" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="971" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="1014" y="260" width="116" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="1072" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">days</text><rect x="1014" y="330" width="54" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1041" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">K</text><rect x="1076" y="330" width="54" height="40" rx="6" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="1103" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">V</text><rect x="1146" y="260" width="116" height="44" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1204" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">new</text><rect x="1146" y="330" width="116" height="40" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1204" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">Q  K  V</text><rect x="86" y="322" width="1044" height="56" rx="10" fill="none" stroke="#2B8A3E" stroke-width="3" opacity="1" stroke-dasharray="8 6"/><text x="612" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">cached — read, never recomputed</text><text x="1204" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">computed now</text><path d="M 1176 380 Q 846 480 300 380" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B7791F)"/><text x="806" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#B7791F" text-anchor="middle">the new token&#x27;s query is compared with every cached key; matching values are mixed in</text><text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Only K and V are cached. A token&#x27;s query is used once, at its own step — later tokens never look at it.</text><text x="90" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start">Each step: compute Q, K, V for the new token → append K, V to the cache → attend over the whole cache.</text><rect x="60" y="650" width="1280" height="90" rx="14" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="90" y="704" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">The trade: GPU memory for compute. The cache grows with every token and exists once per sequence.</text></svg>