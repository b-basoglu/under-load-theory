<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 48 · KV CACHE</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What grows with context length</text><rect x="60" y="160" width="1280" height="92" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="160" width="10" height="92" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Prefill time</text><text x="92" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">every prompt token processed once; attention compares each with all earlier ones</text><text x="1310" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="end">grows faster than linearly</text><rect x="60" y="270" width="1280" height="92" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="270" width="10" height="92" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="92" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Per-step decode cost</text><text x="92" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">every new token attends over the whole cache</text><text x="1310" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="end">grows linearly</text><rect x="60" y="380" width="1280" height="92" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="380" width="10" height="92" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="92" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Cache memory per sequence</text><text x="92" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">every token adds the same bytes, until the sequence finishes</text><text x="1310" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="end">grows linearly</text><rect x="60" y="490" width="1280" height="92" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="60" y="490" width="10" height="92" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="92" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Sequences per GPU</text><text x="92" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">free cache memory ÷ cache per sequence</text><text x="1310" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="end">shrinks</text><rect x="60" y="610" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="609" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="654" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Context length is a cost on every request and every token</text><text x="90" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">Trim irrelevant history · summarize old turns · retrieve only what&#x27;s relevant (Part 46) · reuse shared prefixes (Part 49)</text><text x="90" y="728" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">Sliding-window attention bounds the cache in the layers that use it, at the cost of direct access to distant tokens.</text></svg>