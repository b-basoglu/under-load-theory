<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 16 · CIRCUIT BREAKERS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A dependency that hangs, with and without a breaker</text><rect x="60" y="220" width="1280" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="389.58333333333337" y="270" width="479.16666666666663" height="360" fill="#FDEBE3"/><text x="629.1666666666667" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">notification service hangs</text><line x1="150" y1="630" x2="1300" y2="630" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="630" x2="150" y2="270" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="140" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">ticket service latency</text><text x="1300" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><text x="140" y="620.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">normal</text><text x="140" y="293.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">seconds</text><polyline points="150.0,615.6 389.6,615.6 437.5,504.0 533.3,378.0 629.2,324.0 868.8,288.0 916.7,414.0 964.6,615.6 1300.0,615.6" fill="none" stroke="#B7791F" stroke-width="4" stroke-linejoin="round"/><line x1="90" y1="194" x2="120" y2="194" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/><text x="130" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">no breaker</text><polyline points="150.0,615.6 389.6,615.6 437.5,522.0 485.4,468.0 499.8,612.0 1300.0,612.0" fill="none" stroke="#2F5BEA" stroke-width="4" stroke-linejoin="round"/><line x1="245.0" y1="194" x2="275.0" y2="194" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="285.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">circuit breaker</text><text x="1340" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="end">illustrative · 20 workers · 2 s timeout</text><text x="701.0416666666666" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">queue grows until the dependency returns</text><text x="514.1666666666667" y="596.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="start">breaker opens → fast fallback</text><text x="935.8333333333334" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="start">queue still draining</text><text x="60" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">The breaker can&#x27;t stop the first seconds of waiting — but once open, the ticket service is fast again.</text></svg>