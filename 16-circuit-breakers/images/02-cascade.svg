"/><text x="90" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D9480F" text-anchor="start">ticket page, reply save, search — all waiting behind workers stuck on a non-essential call</text><text x="90" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">20 workers ÷ 2 s = at most 10 requests/s can be answered; 100/s arrive</text><text x="60" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Failures spread through waiting, not through errors — and then up to the ticket service&#x27;s own callers.</text></svg>