<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="720" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 16 · CIRCUIT BREAKERS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Thresholds: noise vs real failure</text><rect x="60" y="150" width="610" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D9480F" text-anchor="start">Aggressive</text><text x="94" y="238" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">open at 30% of the last 10 calls, min 5</text><text x="94" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">two unlucky errors in 5 calls = 40%</text><text x="94" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">opens on normal noise, again and again</text><text x="94" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">cuts off a healthy service: flapping</text><rect x="730" y="150" width="610" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B8A3E" text-anchor="start">Reasonable</text><text x="764" y="238" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">open at 50% of the last 20 calls, min 10</text><text x="764" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">a few % random errors almost never reach 50%</text><text x="764" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">a real outage fills the window fast</text><text x="764" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">noise ignored, failure caught</text><rect x="60" y="510" width="1280" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">A healthy dependency still fails a few percent of calls</text><text x="90" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• minimum calls before the rate counts  • failure rate, not a raw count  • only failures that mean &quot;unhealthy&quot; (timeouts, 5xx)</text><text x="90" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• one breaker per dependency  • short cooldowns, few probes  • one bad instance → outlier detection, not the breaker</text></svg>