<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="690" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 16 · CIRCUIT BREAKERS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Closed, open, half-open</text><rect x="150" y="190" width="240" height="140" rx="20" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="3" opacity="1"/><text x="270" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B8A3E" text-anchor="middle">Closed</text><text x="270" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="middle">calls go through</text><text x="270" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">count failures in a window</text><rect x="580" y="190" width="240" height="140" rx="20" fill="#FDEBE3" stroke="#D9480F" stroke-width="3" opacity="1"/><text x="700" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#D9480F" text-anchor="middle">Open</text><text x="700" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="middle">reject instantly</text><text x="700" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">use the fallback</text><rect x="1010" y="190" width="240" height="140" rx="20" fill="#FBF1DC" stroke="#B7791F" stroke-width="3" opacity="1"/><text x="1130" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#B7791F" text-anchor="middle">Half-open</text><text x="1130" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="middle">let a few probes through</text><text x="1130" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">after a cooldown</text><path d="M 394 230 C 460 200 510 200 574 230" fill="none" stroke="#D9480F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="484" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">failure rate ≥ 50%</text><path d="M 824 230 C 890 200 940 200 1004 230" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B7791F)"/><text x="914" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">cooldown 3 s</text><path d="M 1004 300 C 940 340 890 340 824 300" fill="none" stroke="#D9480F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="914" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">a probe fails</text><path d="M 1130 336 C 1130 440 270 440 270 336" fill="none" stroke="#2B8A3E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><text x="700" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">3 probes succeed</text><rect x="60" y="500" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="499" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Example configuration</text><text x="90" y="584" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">window: last 20 calls · minimum: 10 calls · open at 50% failures (or slow calls)</text><text x="90" y="614" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">cooldown: 3 s · half-open: 3 probes · count: timeouts, connection errors, 5xx — not 4xx</text></svg>