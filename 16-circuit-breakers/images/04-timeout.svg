<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 16 · CIRCUIT BREAKERS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A shorter timeout lets the breaker open sooner</text><rect x="60" y="150" width="1280" height="380" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><line x1="330.0" y1="190" x2="330.0" y2="500" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/><text x="330.0" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">dependency starts hanging</text><line x1="330" y1="480" x2="1290" y2="480" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="1290" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><text x="90" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8A3FB8" text-anchor="start">2 s timeout</text><rect x="330.0" y="240" width="640.0" height="40" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="340.0" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="start">calls wait; no failure seen yet</text><rect x="970.0" y="240" width="70" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="1005.0" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">fails</text><rect x="1044.0" y="240" width="246.0" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1056.0" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">breaker open → fast fallback</text><text x="90" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">300 ms timeout</text><rect x="330.0" y="360" width="96.0" height="40" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="340.0" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="start">wait</text><rect x="426.0" y="360" width="70" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="461.0" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">fails</text><rect x="500.0" y="360" width="790.0" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="512.0" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">breaker open → fast fallback</text><rect x="60" y="560" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="559" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">time to open ≈ timeout + time to collect the minimum number of failures</text><text x="90" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">No timeout → no failure is ever recorded → the breaker never opens. Breakers don&#x27;t replace timeouts.</text><text x="90" y="676" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">React sooner: count slow calls as failures; cap concurrency per dependency (Part 17).</text></svg>