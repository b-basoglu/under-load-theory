<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="630" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 30 · CHANGE DATA CAPTURE</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">When the connector falls behind the log</text><rect x="60" y="150" width="760" height="400" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">WAL retained by a paused connector&#x27;s slot · cap = max_slot_wal_keep_size</text><line x1="150" y1="480" x2="790" y2="480" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="288.0" x2="790" y2="288.0" stroke="#D9480F" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="790" y="280.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="end">cap</text><rect x="190" y="451.2" width="60" height="28.80000000000001" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="220" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">reserved</text><rect x="292" y="408.0" width="60" height="72.0" rx="4" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="322" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">reserved</text><rect x="394" y="360.0" width="60" height="120.0" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="424" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">extended</text><rect x="496" y="321.6" width="60" height="158.39999999999998" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="526" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">extended</text><rect x="598" y="252.0" width="60" height="228.0" rx="4" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="628" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">unreserved</text><rect x="700" y="470.4" width="60" height="9.600000000000023" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="730" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">lost</text><text x="150" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">wal_status as writes continue while the connector is down  →</text><text x="730" y="460.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#D9480F" text-anchor="middle">WAL gone</text><rect x="850" y="150" width="490" height="400" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="868" y="149" width="454" height="6" rx="3" fill="#D9480F"/><text x="880" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">After the connector resumes</text><text x="880" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">slot wal_status: lost</text><text x="880" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">task state may still say RUNNING</text><text x="880" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">new changes arriving: none</text><text x="880" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">logs: repeated replication-slot errors</text><text x="880" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Alert on the slot, not the task.</text><text x="880" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">Recovery: drop slot, new snapshot</text><text x="880" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">seconds for a small table, hours for a</text><text x="880" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">huge one; deletes in the gap need reconciling</text><text x="60" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Without a cap, the same lag fills the database disk instead. Either way, size retention for the longest outage to survive.</text></svg>