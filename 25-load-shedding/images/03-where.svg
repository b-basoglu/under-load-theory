<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="680" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 25 · LOAD SHEDDING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Reject at the door, before the expensive part</text><rect x="60" y="160" width="230" height="110" rx="14" fill="#EFEDE8" stroke="#6B7280" stroke-width="2.5" opacity="1"/><text x="175" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B7280" text-anchor="middle">Arrive</text><text x="175" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">TLS, parse headers</text><line x1="294" y1="215" x2="318" y2="215" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="322" y="160" width="230" height="110" rx="14" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5" opacity="1"/><text x="437" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="middle">Admit?</text><text x="437" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">check one cheap signal</text><line x1="556" y1="215" x2="580" y2="215" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="584" y="160" width="230" height="110" rx="14" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><text x="699" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="middle">Authenticate</text><text x="699" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">token, tenant lookup</text><line x1="818" y1="215" x2="842" y2="215" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="846" y="160" width="230" height="110" rx="14" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><text x="961" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="middle">Do the work</text><text x="961" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">DB queries, cache, render</text><line x1="1080" y1="215" x2="1104" y2="215" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="1108" y="160" width="230" height="110" rx="14" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><text x="1223" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="middle">Respond</text><text x="1223" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle"></text><line x1="437" y1="274" x2="437" y2="320" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="322" y="326" width="230" height="64" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="437" y="365" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">503 + Retry-After</text><text x="580" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">e.g. ~0.5 ms to reject vs ~20 ms to serve</text><rect x="60" y="430" width="405" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="429" width="369" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">In-flight requests</text><text x="90" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">concurrency above a limit → refuse</text><text x="90" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">fast, local, needs no history</text><rect x="497" y="430" width="405" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="429" width="369" height="6" rx="3" fill="#2F5BEA"/><text x="527" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">Queue age</text><text x="527" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">oldest waiting request &gt; budget → drop</text><text x="527" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">adapts when work gets slower</text><rect x="934" y="430" width="405" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="429" width="369" height="6" rx="3" fill="#2F5BEA"/><text x="964" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start">Latency / CPU</text><text x="964" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">recent P99 or CPU above target → refuse more</text><text x="964" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">lags; use with a fast signal</text><text x="60" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Admission signals measure the scarce resource directly. Requests per second does not.</text></svg>