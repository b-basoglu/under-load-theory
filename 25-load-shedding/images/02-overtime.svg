>accept everything</text><line x1="271.1" y1="165" x2="301.1" y2="165" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="311.1" y="171" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">shed at the door</text><rect x="60" y="195" width="1280" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="245.0" y="260" width="380.0" height="350" rx="0" fill="#FDEBE3" stroke="#FDEBE3" stroke-width="2" opacity="1"/><text x="435.0" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">spike: 3× capacity offered</text><line x1="150" y1="330.0" x2="1290" y2="330.0" stroke="#2B8A3E" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/><text x="1284" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="end">capacity</text><line x1="150" y1="610" x2="1290" y2="610" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="150" y1="610" x2="150" y2="250" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="1290" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><text x="158" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">answered in time, per second</text><polyline points="150,400 245,400 256,589 625,596 629,610 1195,610 1252,400 1290,400" fill="none" stroke="#B7791F" stroke-width="4" stroke-linejoin="round"/><polyline points="150,400 245,400 251,344 625,344 629,400 1290,400" fill="none" stroke="#2F5BEA" stroke-width="4" stroke-linejoin="round"/><text x="910.0" y="596.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">still ~0 after the spike: draining stale work</text><text x="435.0" y="372.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">near capacity</text><text x="720.0" y="505.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">backlog at the end ≈ 800/s × 20 s = 16,000</text><text x="720.0" y="529.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">drains at 400 − 300 = 100/s → minutes</text><text x="60" y="705" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Illustrative, from the arithmetic of the spike. Shedding keeps a backlog from forming at all.</text></svg>