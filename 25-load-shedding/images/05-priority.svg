<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 25 · LOAD SHEDDING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What gets shed matters as much as how much</text><rect x="60" y="150" width="1280" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">During the spike: 1,200 req/s offered, ~400 req/s of capacity</text><rect x="90" y="230" width="366.0" height="50" rx="6" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="102" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">interactive ~360/s (30%)</text><rect x="456.0" y="230" width="854.0" height="50" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="512.6666666666666" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">bulk syncs ~840/s (70%)</text><line x1="496.66666666666663" y1="214" x2="496.66666666666663" y2="300" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/><text x="504.66666666666663" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">capacity ≈ 400/s</text><text x="90" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">Interactive traffic alone fits under capacity — so it can be served almost entirely.</text><rect x="60" y="410" width="625" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="409" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">Reject at random</text><text x="90" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">every class served ~1 in 3</text><text x="90" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">two of three agent clicks fail</text><rect x="715" y="410" width="625" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="409" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">Shed bulk first</text><text x="745" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">interactive served almost entirely</text><text x="745" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">bulk gets what&#x27;s left, retries later</text><rect x="60" y="610" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="609" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Priority needs fairness safeguards</text><text x="90" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">starvation: give lower classes a small guaranteed share · tenants: fair share per tenant, shed the heaviest first</text><text x="90" y="722" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">trust: the server assigns priority from trusted attributes — clients can&#x27;t just label everything critical</text></svg>