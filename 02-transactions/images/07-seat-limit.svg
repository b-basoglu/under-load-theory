nt-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">51 agents on a 50-seat plan. Different rows, so even PostgreSQL&#x27;s Repeatable Read lets it through.</text></svg>