ented</text><rect x="675" y="554" width="205" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="777.5" y="597.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">✓ prevented</text><rect x="900" y="554" width="205" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1002.5" y="597.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">✓ prevented</text><rect x="1125" y="554" width="205" height="70" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1227.5" y="597.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="middle">✓ prevented</text><text x="70" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="start">Each level down is stricter: fewer anomalies, but more waiting and more aborted transactions to retry.</text><text x="70" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#B7791F" text-anchor="start">Amber cells: the SQL standard allows it, but databases differ.</text></svg>