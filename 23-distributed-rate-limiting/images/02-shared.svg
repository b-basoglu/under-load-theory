<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 23 · DISTRIBUTED RATE LIMITING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">One shared bucket: read-then-write vs atomic</text><rect x="60" y="150" width="610" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#D9480F" text-anchor="start">Read, compute, write</text><rect x="290" y="240" width="150" height="56" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="365" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Redis bucket</text><text x="365" y="286" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">tokens = 1</text><text x="94" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">server A</text><rect x="200" y="340" width="138" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="269" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">read: 1</text><rect x="348" y="340" width="138" height="40" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="417" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">1 ≥ 1 → allow</text><rect x="496" y="340" width="138" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="565" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">write: 0</text><text x="94" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">server B</text><rect x="200" y="430" width="138" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="269" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">read: 1</text><rect x="348" y="430" width="138" height="40" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="417" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">1 ≥ 1 → allow</text><rect x="496" y="430" width="138" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="565" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">write: 0</text><text x="94" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">server C</text><rect x="200" y="520" width="138" height="40" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="269" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">read: 1</text><rect x="348" y="520" width="138" height="40" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="417" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">1 ≥ 1 → allow</text><rect x="496" y="520" width="138" height="40" rx="6" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="565" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">write: 0</text><text x="94" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">all three read the same value in the gap:</text><text x="94" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">one token → three requests (a lost update)</text><rect x="730" y="150" width="610" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B8A3E" text-anchor="start">One atomic script</text><rect x="960" y="240" width="150" height="56" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="1035" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Redis bucket</text><text x="1035" y="286" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#1A1D24" text-anchor="middle">tokens = 1</text><text x="764" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">server A</text><rect x="870" y="340" width="280" height="40" rx="6" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="1010" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">read · refill · take → allow</text><text x="764" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">server B</text><rect x="870" y="430" width="280" height="40" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="1010" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">runs after → 0 tokens → 429</text><text x="764" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">server C</text><rect x="870" y="520" width="280" height="40" rx="6" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="1010" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">runs after → 0 tokens → 429</text><text x="764" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">the store runs each script to completion:</text><text x="764" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">one token → one request</text><text x="60" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="start">The overshoot grows with the number of servers checking concurrently and the gap between read and write.</text></svg>