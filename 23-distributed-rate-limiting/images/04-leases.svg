ty="1"/><text x="700" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="middle">global bucket (shared store)</text><text x="700" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="middle">hands out batches of tokens</text><text x="700" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">never more than the client&#x27;s limit</text><rect x="110" y="400" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="235" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">API server 1</text><text x="235" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B8A3E" text-anchor="middle">local lease: a few tokens</text><circle cx="205" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><circle cx="235" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><circle cx="265" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><path d="M 610.0 304 Q 235 340 235 392" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="420" y="400" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="545" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">API server 2</text><text x="545" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B8A3E" text-anchor="middle">local lease: a few tokens</text><circle cx="515" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><circle cx="545" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><circle cx="575" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><path d="M 670.0 304 Q 545 340 545 392" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="730" y="400" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="855" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">API server 3</text><text x="855" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B8A3E" text-anchor="middle">local lease: a few tokens</text><circle cx="825" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><path d="M 730.0 304 Q 855 340 855 392" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><rect x="1040" y="400" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1165" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">API server 4</text><text x="1165" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B8A3E" text-anchor="middle">local lease: a few tokens</text><circle cx="1135" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><circle cx="1165" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><circle cx="1195" cy="494" r="9" fill="#B7791F" stroke="none" stroke-width="0"/><path d="M 790.0 304 Q 1165 340 1165 392" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">1  checks are local memory operations — as fast as a per-server bucket</text><text x="90" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">2  the store sees one call per lease, not one per request</text><text x="90" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">3  a brief store outage: servers keep serving from their current lease</text><text x="90" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">cost: overshoot of about the outstanding leases, for about one sync interval</text><text x="60" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="start">Larger leases → fewer store calls, more overshoot. Smaller leases → more precise, more calls.</text></svg>