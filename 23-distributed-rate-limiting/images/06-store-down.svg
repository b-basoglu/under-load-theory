<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="730" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 23 · DISTRIBUTED RATE LIMITING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">When the limiter&#x27;s store is down</text><rect x="60" y="150" width="405" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="369" height="6" rx="3" fill="#D9480F"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#D9480F" text-anchor="start">Fail open</text><text x="90" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">allow everything</text><text x="90" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">no limit at all</text><text x="90" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">the API stays up</text><rect x="497" y="150" width="405" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="149" width="369" height="6" rx="3" fill="#D9480F"/><text x="527" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#D9480F" text-anchor="start">Fail closed</text><text x="527" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">reject everything</text><text x="527" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">the limit holds…</text><text x="527" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">…and the API is down</text><rect x="934" y="150" width="405" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="149" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="964" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B8A3E" text-anchor="start">Local fallback</text><text x="964" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">each server enforces 1/N</text><text x="964" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">approximately the limit</text><text x="964" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">the API stays up</text><text x="60" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Which one — decided per limit, before the outage</text><rect x="60" y="450" width="405" height="120" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Fairness / abuse</text><text x="90" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">local fallback, or fail open + alert</text><rect x="497" y="450" width="405" height="120" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="449" width="369" height="6" rx="3" fill="#D9480F"/><text x="527" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">Security limits</text><text x="527" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">fail closed, or a strict local fallback</text><rect x="934" y="450" width="405" height="120" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="449" width="369" height="6" rx="3" fill="#B7791F"/><text x="964" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Paid quotas</text><text x="964" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">fail open, reconcile from logs later</text><rect x="60" y="600" width="1280" height="90" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="90" y="638" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">A slow store is worse than a dead one: every request waits for the timeout.</text><text x="90" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5D9E0" text-anchor="start">Short timeout · circuit breaker → straight to the fallback · no retries on the limiter call · alert on fallback</text></svg>