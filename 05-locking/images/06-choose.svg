ck and the write be one statement?</text><line x1="706" y1="202" x2="760" y2="202" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="732" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">yes</text><rect x="770" y="160" width="570" height="84" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="800" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Atomic conditional write</text><rect x="60" y="272" width="640" height="84" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Long gap between read and write (a person, a form)?</text><line x1="706" y1="314" x2="760" y2="314" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="732" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">yes</text><rect x="770" y="272" width="570" height="84" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="800" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Optimistic · version + If-Match</text><rect x="60" y="384" width="640" height="84" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Short work in one transaction, frequent conflicts?</text><line x1="706" y1="426" x2="760" y2="426" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="732" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">yes</text><rect x="770" y="384" width="570" height="84" rx="12" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="800" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8A3FB8" text-anchor="start">Pessimistic · FOR UPDATE + lock_timeout</text><rect x="60" y="496" width="640" height="84" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Is a retry expensive?</text><line x1="706" y1="538" x2="760" y2="538" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="732" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">yes</text><rect x="770" y="496" width="570" height="84" rx="12" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="800" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8A3FB8" text-anchor="start">Pessimistic, or move the expensive part out</text><rect x="60" y="608" width="640" height="84" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">One extremely hot row?</text><line x1="706" y1="650" x2="760" y2="650" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="732" y="638" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">yes</text><rect x="770" y="608" width="570" height="84" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="800" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">Redesign: shorter critical section, split rows, batch</text><rect x="60" y="730" width="1280" height="60" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="768" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Always: never call another service or wait for a person while holding a lock.</text></svg>