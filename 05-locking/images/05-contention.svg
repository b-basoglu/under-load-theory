ct x="762.0" y="351" width="144.0" height="18" rx="4" fill="#F1E6F8" stroke="#8A3FB8" stroke-width="2" opacity="1"/><text x="1310" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="end">throughput capped at one per hold time</text><text x="1310" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="end">latency grows with the queue</text><rect x="60" y="400" width="1280" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="399" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#B7791F" text-anchor="start">Optimistic</text><text x="90" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">one wins per round; the rest redo T</text><text x="90" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">request 1</text><rect x="330.0" y="492" width="144.0" height="18" rx="4" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="90" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">request 2</text><rect x="330.0" y="515" width="144.0" height="18" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><rect x="486.0" y="515" width="144.0" height="18" rx="4" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="90" y="553" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">request 3</text><rect x="330.0" y="538" width="144.0" height="18" rx="4" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/>