<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="710" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 5 · LOCKING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">How a deadlock happens</text><rect x="60" y="150" width="760" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="724" height="6" rx="3" fill="#D9480F"/><rect x="130" y="250" width="220" height="70" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2.5" opacity="1"/><text x="240" y="293" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="middle">Transaction A</text><rect x="530" y="250" width="220" height="70" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5" opacity="1"/><text x="640" y="293" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="middle">Transaction B</text><rect x="130" y="480" width="220" height="70" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2.5" opacity="1"/><text x="240" y="523" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="middle">ticket 4</text><rect x="530" y="480" width="220" height="70" rx="12" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2.5" opacity="1"/><text x="640" y="523" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="middle">ticket 5</text><line x1="240" y1="474" x2="240" y2="326" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="252" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">held by A</text><line x1="640" y1="474" x2="640" y2="326" stroke="#B7791F" stroke-width="3" stroke-linecap="round" marker-end="url(#a-B7791F)"/><text x="652" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">held by B</text><line x1="356" y1="300" x2="600" y2="474" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-2F5BEA)"/><text x="440" y="512" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">A waits for 5</text><line x1="524" y1="300" x2="280" y2="474" stroke="#B7791F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-B7791F)"/><text x="440" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">B waits for 4</text><text x="90" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">A merges 4 → 5, B merges 5 → 4</text><text x="90" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">PostgreSQL finds the cycle after deadlock_timeout (1 s) and aborts one: 40P01</text><rect x="850" y="150" width="490" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="868" y="149" width="454" height="6" rx="3" fill="#2B8A3E"/><text x="880" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">The fix: one lock order</text><rect x="880" y="240" width="430" height="70" rx="10" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="900" y="270" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#fff" text-anchor="start">SELECT id FROM tickets</text><text x="900" y="294" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#fff" text-anchor="start">WHERE id IN (4, 5) ORDER BY id FOR UPDATE</text><text x="880" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">A</text><rect x="920" y="360" width="160" height="40" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1000.0" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">locks 4, 5</text><rect x="1080" y="360" width="50" height="40" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1105.0" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">✓</text><text x="880" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">B</text><rect x="940" y="420" width="190" height="40" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1" stroke-dasharray="6 5"/><text x="1035.0" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">waits</text><rect x="1130" y="420" width="170" height="40" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1215.0" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">locks 4, 5</text><text x="880" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">Both take ticket 4 first, so neither</text><text x="880" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">can hold what the other is waiting for.</text><text x="880" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">B waits for A, then continues —</text><text x="880" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">no deadlock</text></svg>