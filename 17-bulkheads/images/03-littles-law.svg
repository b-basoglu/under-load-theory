acity="1"/><text x="700" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">With one shared pool, whatever holds slots longest wins — regardless of how much it matters.</text></svg>