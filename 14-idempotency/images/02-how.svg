<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="680" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 14 · IDEMPOTENCY</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">How an idempotency key works</text><circle cx="90" cy="194" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="90" y="201" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="130" y="166" width="760" height="62" rx="10" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="150" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">client creates a key once per operation</text><text x="150" y="217" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">when the user taps Submit — not per HTTP attempt</text><line x1="90" y1="214" x2="90" y2="264" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="90" cy="294" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="90" y="301" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="130" y="266" width="760" height="62" rx="10" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="150" y="293" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">every attempt sends the same key</text><text x="150" y="317" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Idempotency-Key: 8c1f0d5e-…</text><line x1="90" y1="314" x2="90" y2="364" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="90" cy="394" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="90" y="401" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="130" y="366" width="760" height="62" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="150" y="393" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">server claims the key atomically</text><text x="150" y="417" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">INSERT … ON CONFLICT DO NOTHING on (workspace_id, key)</text><line x1="90" y1="414" x2="90" y2="464" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="90" cy="494" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="90" y="501" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="130" y="466" width="760" height="62" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="150" y="493" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">work + stored response in one transaction</text><text x="150" y="517" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">a crash rolls back the claim and the work together</text><line x1="90" y1="514" x2="90" y2="564" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="90" cy="594" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="90" y="601" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="130" y="566" width="760" height="62" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="150" y="593" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">a repeat gets the stored response</text><text x="150" y="617" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">same status and body; nothing runs twice</text><rect x="930" y="160" width="410" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="948" y="159" width="374" height="6" rx="3" fill="#2F5BEA"/><text x="960" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="Menlo, SFMono-Regular, Consolas, monospace">idempotency_keys</text><text x="960" y="250" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">workspace_id</text><text x="960" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">scope</text><text x="960" y="310" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">key</text><text x="960" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">from the client</text><text x="960" y="370" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">request_hash</text><text x="960" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">detects reuse</text><text x="960" y="430" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">status</text><text x="960" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">processing · done</text><text x="960" y="490" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">response_code, _body</text><text x="960" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">the stored answer</text><text x="960" y="550" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">created_at</text><text x="960" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">for expiry (24 h)</text><text x="960" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="Menlo, SFMono-Regular, Consolas, monospace">PRIMARY KEY (workspace_id, key)</text></svg>