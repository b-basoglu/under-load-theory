<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 14 · IDEMPOTENCY</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The crash after charging, before saving</text><rect x="60" y="150" width="400" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="364" height="6" rx="3" fill="#2F5BEA"/><text x="88" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5BEA" text-anchor="start">1 · record intent</text><text x="88" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">commit: refund 40 · ticket 9041</text><text x="88" y="282" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">status = pending</text><line x1="464" y1="245" x2="496" y2="245" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="500" y="150" width="400" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="518" y="149" width="364" height="6" rx="3" fill="#B7791F"/><text x="528" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#B7791F" text-anchor="start">2 · call provider</text><text x="528" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">Idempotency-Key:</text><text x="528" y="282" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">refund-ticket-9041</text><line x1="904" y1="245" x2="936" y2="245" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="940" y="150" width="400" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="958" y="149" width="364" height="6" rx="3" fill="#2B8A3E"/><text x="968" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">3 · record outcome</text><text x="968" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">status = succeeded</text><text x="968" y="282" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">+ provider reference</text><path d="M 640 344 L 640 420" fill="none" stroke="#D9480F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="660" y="395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">crash here: provider charged, outcome not saved</text><rect x="60" y="440" width="1280" height="240" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="439" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Recovery: a row stuck in pending means &quot;outcome unknown&quot;</text><circle cx="110" cy="532" r="17" fill="#D9480F" stroke="none" stroke-width="0"/><text x="110" y="539" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140" y="539" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">a retry of the request, or a sweeper job, finds the pending row</text><circle cx="110" cy="570" r="17" fill="#D9480F" stroke="none" stroke-width="0"/><text x="110" y="577" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="140" y="577" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">calls the provider again with the SAME key → first result is returned, no second refund</text><circle cx="110" cy="608" r="17" fill="#D9480F" stroke="none" stroke-width="0"/><text x="110" y="615" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="140" y="615" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">provider without keys? look the payment up by the reference sent in step 2, then decide</text><circle cx="110" cy="646" r="17" fill="#D9480F" stroke="none" stroke-width="0"/><text x="110" y="653" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="140" y="653" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">complete the row; alert on rows pending longer than a few minutes</text><rect x="60" y="710" width="1280" height="60" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Durable intent → idempotent call → recorded outcome → recovery for anything in between.</text></svg>