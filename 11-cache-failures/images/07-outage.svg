<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="740" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 11 · WHEN CACHES FAIL</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Redis down: uncapped vs capped fallback</text><text x="1340" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="end">illustrative · the cache is unavailable, dashboard requests keep arriving</text><rect x="60" y="190" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="189" width="574" height="6" rx="3" fill="#D9480F"/><text x="90" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">Every miss goes to the database</text><text x="90" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">dashboard queries running at once</text><text x="640" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="end">as many as the pool allows</text><line x1="90" y1="322" x2="640" y2="322" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">database CPU</text><text x="640" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="end">saturated</text><line x1="90" y1="394" x2="640" y2="394" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">dashboard requests</text><text x="640" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="end">slow, many time out</text><line x1="90" y1="466" x2="640" y2="466" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">unrelated, cheap queries</text><text x="640" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="end">slow too</text><line x1="90" y1="538" x2="640" y2="538" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="615" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">one failing feature slows everything</text><rect x="730" y="190" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="189" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="760" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">Miss path capped (a semaphore)</text><text x="760" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">dashboard queries running at once</text><text x="1310" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="end">at most N per server</text><line x1="760" y1="322" x2="1310" y2="322" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="760" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">database CPU</text><text x="1310" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="end">headroom left</text><line x1="760" y1="394" x2="1310" y2="394" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="760" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">dashboard requests</text><text x="1310" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="end">some served, rest shed fast</text><line x1="760" y1="466" x2="1310" y2="466" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="760" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">unrelated, cheap queries</text><text x="1310" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="end">normal speed</text><line x1="760" y1="538" x2="1310" y2="538" stroke="#EFEDE8" stroke-width="1.5" stroke-linecap="round"/><text x="760" y="615" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">a controlled, partial failure</text><text x="60" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">If the cache absorbs 95% of reads, losing it means 20× the database load. Size the cap from the database, not the traffic.</text></svg>