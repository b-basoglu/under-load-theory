<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="760" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 11 · WHEN CACHES FAIL</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Penetration: stop requests for ids that don&#x27;t exist</text><rect x="60" y="190" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="189" width="254" height="6" rx="3" fill="#2F5BEA"/><text x="84" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">validate</text><text x="84" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">format · range · workspace</text><text x="84" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">rejects ids that can&#x27;t exist</text><line x1="354" y1="290" x2="386" y2="290" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="205.0" y1="395" x2="205.0" y2="455" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="205.0" y="485" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">stopped here</text><rect x="390" y="190" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="408" y="189" width="254" height="6" rx="3" fill="#2F5BEA"/><text x="414" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">Bloom filter</text><text x="414" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">&quot;could this id exist?&quot;</text><text x="414" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">rejects ids never created</text><line x1="684" y1="290" x2="716" y2="290" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="535.0" y1="395" x2="535.0" y2="455" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="535.0" y="485" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">stopped here</text><rect x="720" y="190" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="738" y="189" width="254" height="6" rx="3" fill="#2F5BEA"/><text x="744" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">cache</text><text x="744" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">incl. negative entries</text><text x="744" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">answers repeats of missing ids</text><line x1="1014" y1="290" x2="1046" y2="290" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><line x1="865.0" y1="395" x2="865.0" y2="455" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="865.0" y="485" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">stopped here</text><rect x="1050" y="190" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="1068" y="189" width="254" height="6" rx="3" fill="#2B8A3E"/><text x="1074" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">database</text><text x="1074" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">the only real lookup</text><text x="1074" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">sees what&#x27;s left</text><text x="60" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6B7280" text-anchor="start">Each layer is cheaper than the one behind it</text><rect x="60" y="520" width="1280" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="519" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">What each layer misses</text><text x="90" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• Validation can&#x27;t know whether a well-formed id exists.</text><text x="90" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• Negative caching only helps when the same missing id comes back; random ids are written once, never read.</text><text x="90" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• A Bloom filter lets a small share of false positives through and must be updated on every create.</text><text x="90" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">• Rate limits on clients with many not-found responses catch what&#x27;s left.</text></svg>