ans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">capped fallback</text><rect x="934" y="150" width="405" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="149" width="369" height="6" rx="3" fill="#D9480F"/><text x="964" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1D24" text-anchor="start">Penetration</text><text x="964" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">keys that don&#x27;t exist</text><circle cx="982" cy="300" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="982" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="1012" y="307" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">validate requests</text><circle cx="982" cy="362" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="982" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="1012" y="369" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">negative caching (repeats)</text><circle cx="982" cy="424" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="982" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="1012" y="431" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">Bloom filter (random ids)</text><circle cx="982" cy="486" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="982" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="1012" y="493" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">rate limiting</text><rect x="60" y="600" width="1280" height="64" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">For all three: the cache is an optimization, not the only thing keeping the database alive.</text></svg>