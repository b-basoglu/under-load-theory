oke-width="1.8" stroke-linecap="round"/><line x1="761" y1="392" x2="980" y2="466" stroke="#B7791F" stroke-width="1.8" stroke-linecap="round"/><line x1="1153" y1="392" x2="980" y2="466" stroke="#B7791F" stroke-width="1.8" stroke-linecap="round"/><text x="980" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="middle">all 1 → maybe present</text><rect x="60" y="650" width="1280" height="130" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="649" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">It never says &quot;no&quot; to an id that was added, so rejecting every &quot;no&quot; is always safe.</text><text x="90" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">&quot;Maybe&quot; can be a false positive. About 10 bits per item gives ~1%; about 14–15 bits gives ~0.1%.</text><text x="90" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Standard filters can&#x27;t delete; every new id must be added when it&#x27;s created.</text></svg>