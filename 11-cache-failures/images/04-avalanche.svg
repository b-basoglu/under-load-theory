roke-linecap="round" marker-end="url(#a-2F5BEA)"/><line x1="580" y1="460" x2="1060" y2="460" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><text x="820.0" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="middle">spread over the jitter window</text><text x="60" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Same number of rebuilds, much lower peak. Jitter does nothing for one hot key — that&#x27;s a stampede.</text></svg>