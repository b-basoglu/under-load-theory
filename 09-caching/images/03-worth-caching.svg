<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="710" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 9 · CACHING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What a cache actually saves</text><rect x="60" y="150" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">Ticket page</text><text x="94" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">one ticket by primary key + its comments (indexed)</text><text x="94" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">PostgreSQL</text><rect x="94" y="304" width="108.33333333333334" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="204.33333333333334" y="304" width="52.0" height="44" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="94" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Redis</text><rect x="94" y="424" width="108.33333333333334" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="204.33333333333334" y="424" width="13.0" height="44" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="94" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="start">the cache saves little — fix indexes instead</text><rect x="730" y="150" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1D24" text-anchor="start">Workspace dashboard</text><text x="764" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">60 days of comments grouped by priority</text><text x="764" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">PostgreSQL</text><rect x="764" y="304" width="108.33333333333334" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="874.3333333333334" y="304" width="411.6666666666667" height="44" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1080.1666666666667" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">database work</text><text x="764" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Redis</text><rect x="764" y="424" width="108.33333333333334" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="874.3333333333334" y="424" width="13.0" height="44" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="764" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">the cache saves almost all the work</text><text x="60" y="670" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="start">Bar length = time per request (schematic). A fast indexed query is already mostly one network round trip.</text></svg>