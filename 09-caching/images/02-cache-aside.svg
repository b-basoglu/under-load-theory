e-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="112" cy="540" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="112" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="144" y="516" width="490" height="50" rx="10" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="164" y="548" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">SET … EX 300, then return</text><rect x="730" y="150" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1D24" text-anchor="start">Write</text><circle cx="782" cy="270" r="17" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="782" y="277" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="814" y="246" width="490" height="50" rx="10" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="834" y="278" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">UPDATE tickets … </text><line x1="782" y1="292" x2="782" y2="332" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="782" cy="360" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="367" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="814" y="336" width="490" height="50" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="834" y="368" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">COMMIT</text><line x1="782" y1="382" x2="782" y2="422" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><circle cx="782" cy="450" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="782" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="814" y="426" width="490" height="50" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="834" y="458" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">then: DEL ticket:48213</text><line x1="782" y1="472" x2="782" y2="512" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9D6CF)"/><rect x="814" y="516" width="490" height="50" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="834" y="548" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">(or SET, or wait for the TTL)</text><text x="60" y="670" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="start">The application talks to both. The cache never talks to the database — so the app survives a cache outage.</text></svg>