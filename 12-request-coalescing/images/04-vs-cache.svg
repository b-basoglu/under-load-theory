<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="780" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 12 · REQUEST COALESCING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Coalescing vs caching</text><rect x="60" y="150" width="610" height="270" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#2F5BEA"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2F5BEA" text-anchor="start">Caching</text><text x="94" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• reuses work that already finished</text><text x="94" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• helps every later request until the TTL</text><text x="94" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• can serve data as old as the TTL</text><rect x="730" y="150" width="610" height="270" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B8A3E" text-anchor="start">Coalescing</text><text x="764" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• shares work that is still running</text><text x="764" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• helps only requests that overlap in time</text><text x="764" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">• result is exactly as fresh as the call</text><rect x="60" y="450" width="1280" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="449" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Requests one after another</text><text x="730" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Requests at the same instant, right after expiry</text><rect x="90" y="520" width="90" height="26" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="200" y="520" width="90" height="26" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="310" y="520" width="90" height="26" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="420" y="520" width="90" height="26" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="530" y="520" width="90" height="26" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="90" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">coalescing: nothing to join → one call each</text><text x="90" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">cache: answers all but the first</text><rect x="730" y="520" width="300" height="22" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="744" y="526" width="300" height="22" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="758" y="532" width="300" height="22" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="772" y="538" width="300" height="22" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><rect x="786" y="544" width="300" height="22" rx="5" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="1100" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start"></text><text x="730" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">cache: entry gone → every request misses</text><text x="730" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">coalescing: one call shared by all</text><rect x="60" y="680" width="1280" height="60" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="718" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#fff" text-anchor="middle">value = cache.get(k) or flights.do(k, rebuild_and_store)</text></svg>