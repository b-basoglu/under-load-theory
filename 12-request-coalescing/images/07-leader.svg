<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="790" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 12 · REQUEST COALESCING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">When the leader is slow or fails</text><rect x="60" y="150" width="1280" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Slow leader: followers with a deadline</text><text x="90" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">leader</text><rect x="200" y="230" width="900" height="30" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="212" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="start">shared call — own timeout, keeps running if a caller cancels</text><text x="1110" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">→ refreshes cache</text><text x="90" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">follower 1</text><rect x="280" y="290" width="220" height="28" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" opacity="1" stroke-dasharray="6 5"/><text x="510" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">deadline → stale value</text><text x="90" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">follower 2</text><rect x="400" y="334" width="220" height="28" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" opacity="1" stroke-dasharray="6 5"/><text x="630" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">deadline → stale value</text><text x="90" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">follower 3</text><rect x="520" y="378" width="220" height="28" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" opacity="1" stroke-dasharray="6 5"/><text x="750" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">deadline → stale value</text><rect x="60" y="480" width="1280" height="270" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="479" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Failed leader: one error fans out to every follower</text><rect x="90" y="560" width="200" height="60" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="190" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">timeout</text><line x1="296" y1="590" x2="420" y2="560" stroke="#D9480F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-D9480F)"/><line x1="296" y1="590" x2="420" y2="580" stroke="#D9480F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-D9480F)"/><line x1="296" y1="590" x2="420" y2="600" stroke="#D9480F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-D9480F)"/><line x1="296" y1="590" x2="420" y2="620" stroke="#D9480F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="430" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">every follower gets the same error</text><circle cx="810" cy="568" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="810" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="840" y="575" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor=