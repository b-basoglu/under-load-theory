<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 12 · REQUEST COALESCING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A bad key leaks the leader&#x27;s answer</text><rect x="60" y="150" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="90" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">Key too coarse</text><text x="90" y="240" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">key = dash</text><rect x="90" y="290" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="190" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">team lead · en</text><line x1="296" y1="318" x2="400" y2="380" stroke="#D9480F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="90" y="380" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="190" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">agent · en</text><line x1="296" y1="408" x2="400" y2="380" stroke="#D9480F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="90" y="470" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="190" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">agent · tr</text><line x1="296" y1="498" x2="400" y2="380" stroke="#D9480F" stroke-width="2" stroke-linecap="round" marker-end="url(#a-D9480F)"/><rect x="410" y="330" width="230" height="100" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2.5" opacity="1"/><text x="525" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">one flight</text><text x="525" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">team lead&#x27;s dashboard</text><text x="90" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">If the team lead is the leader, agents see</text><text x="90" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">data they&#x27;re not allowed to see.</text><rect x="730" y="150" width="610" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="760" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">Key includes what the answer depends on</text><text x="760" y="240" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">key = dash:{org}:{role}:{lang}</text><rect x="760" y="290" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="860" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">team lead · en</text><line x1="966" y1="318" x2="1060" y2="318" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="1070" y="290" width="240" height="56" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1190" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">own flight, own answer</text><rect x="760" y="380" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="860" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">agent · en</text><line x1="966" y1="408" x2="1060" y2="408" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="1070" y="380" width="240" height="56" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1190" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">own flight, own answer</text><rect x="760" y="470" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="860" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="middle">agent · tr</text><line x1="966" y1="498" x2="1060" y2="498" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><rect x="1070" y="470" width="240" height="56" rx="10" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1190" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">own flight, own answer</text><text x="760" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">Better still: share the raw query,</text><text x="760" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">filter per user after it returns.</text><rect x="60" y="650" width="1280" height="64" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">If it changes the answer, it goes in the key. Derive the key from the inputs, not by hand.</text></svg>