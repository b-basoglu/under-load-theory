<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="740" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 38 · CLOCK SKEW</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A hybrid logical clock in one picture</text><line x1="160" y1="230" x2="1300" y2="230" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="420" x2="1300" y2="420" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="90" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5BEA" text-anchor="start">A</text><text x="90" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#8A3FB8" text-anchor="start">B</text><text x="90" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">accurate</text><text x="90" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">300 ms slow</text><circle cx="300" cy="230" r="10" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="300" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">write (1000, 0)</text><circle cx="520" cy="420" r="10" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="520" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">read sees (1000, 0)</text><circle cx="760" cy="420" r="10" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="760" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">write (1000, 1)</text><circle cx="1060" cy="230" r="10" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="1060" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">write (1450, 0)</text><line x1="306" y1="238" x2="512" y2="412" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#a-D9D6CF)"/><text x="760" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">B&#x27;s wall clock says 760 — but it has seen 1000, so its next timestamp is (1000, 1)</text><rect x="60" y="540" width="1280" height="160" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="539" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">HLC = (max wall time seen, counter)</text><text x="90" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• stays close to real time (for humans and TTLs)  • never runs backwards  • respects &#x27;happened before&#x27;</text><text x="90" y="654" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">used by CockroachDB, MongoDB and others to order events across machines with imperfect clocks</text></svg>