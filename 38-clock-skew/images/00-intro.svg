<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1600" height="920" fill="#FAFAF7"/><rect x="0" y="0" width="1600" height="96" rx="0" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="48" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8B93A7" text-anchor="start">UNDER LOAD  ·  PART 38  ·  DISTRIBUTED DATA &amp; COORDINATION</text><text x="48" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="start">Clock skew — revision card</text><text x="1552" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8B93A7" text-anchor="end">failure → mechanism → trade-off → safeguard → metric</text><rect x="40" y="116" width="1520" height="64" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="64" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5BEA" text-anchor="start">30 seconds</text><text x="64" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1A1D24" text-anchor="start">No two machines share identical time; NTP shrinks error but doesn’t erase it. Last-write-wins on wall clocks silently…</text><rect x="40" y="200" width="500" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="58" y="199" width="464" height="6" rx="3" fill="#D9480F"/><text x="64" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">1 · Failure</text><text x="64" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">Server B’s “earlier” write overwrites Server A’s…</text><text x="64" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">LWW uses wall-clock timestamps</text><text x="64" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">B’s clock is behind; its write looks newer</text><text x="64" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">A’s real-later write discarded</text><text x="64" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Logs reorder across hosts</text><text x="64" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">TLS / auth / lease TTLs mis-compare</text><text x="64" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">NTP step adjustments jump time backwards/forwards</text><rect x="64" y="500" width="452" height="52" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="290" y="534" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">LWW lied</text><text x="64" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">Time is a distributed opinion, not a fact.</text><rect x="560" y="200" width="500" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="578" y="199" width="464" height="6" rx="3" fill="#B7791F"/><text x="584" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">2 · Mechanism</text><text x="584" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Quartz drift + network delay → skew</text><text x="584" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">NTP bounds error; doesn’t give total order</text><text x="584" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Hybrid logical clocks / TrueTime reduce pain</text><text x="584" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Prefer causality (Part 39) over wall LWW</text><text x="584" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Leases need slack for skew (Part 42)</text><line x1="584" y1="442" x2="1020" y2="442" stroke="#D9D6CF" stroke-width="1.5" stroke-linecap="round"/><text x="584" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Monotonic clocks for durations within a host</text><text x="584" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Don’t trust timestamps across trust domains blindly</text><text x="584" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1A1D24" text-anchor="start">Design as if clocks are wrong — they are</text><rect x="1080" y="200" width="480" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="1098" y="199" width="444" height="6" rx="3" fill="#2B8A3E"/><text x="1104" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">3 · Safeguard</text><circle cx="1124" cy="286" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1124" y="293" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1156" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">Avoid LWW-on-wall-clock for…</text><text x="1540" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">causality</text><circle cx="1124" cy="334" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1124" y="341" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1156" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">Slack in lease/TTL comparisons</text><text x="1540" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">skew budget</text><circle cx="1124" cy="382" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1124" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1156" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">Monitor offset from NTP…</text><text x="1540" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">ops</text><circle cx="1124" cy="430" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1124" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1156" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">Use mono clocks for local…</text><text x="1540" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">within node</text><circle cx="1124" cy="478" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="1124" y="485" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1156" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">Store server id + logical…</text><text x="1540" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">debug</text><text x="1104" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">If correctness depends on perfect clocks, it isn’t…</text><rect x="40" y="644" width="500" height="200" rx="12" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="64" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">4 · Trade-offs</text><text x="64" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">Logical clocks need more metadata &amp; merge rules</text><text x="64" y="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">Strict sync time infra is expensive / regional</text><text x="64" y="776" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">Ignoring skew is cheaper until silent data loss</text><text x="64" y="804" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">Big NTP steps can break naive assumptions suddenly</text><rect x="560" y="644" width="500" height="200" rx="12" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="584" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">5 · Metric</text><text x="584" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">NTP offset / jump events per host</text><text x="584" y="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">conflict rates on LWW paths</text><text x="584" y="776" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">lease errors correlating with offset spikes</text><text x="584" y="804" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="start">cross-host log order anomalies</text><rect x="1080" y="644" width="480" height="200" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1104" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8B93A7" text-anchor="start">Remember</text><text x="1104" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Wall time is not a causality oracle.</text><text x="1104" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#B8BEC9" text-anchor="start">Budget for skew in every TTL,</text><text x="1104" y="808" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#B8BEC9" text-anchor="start">and don’t let LWW erase concurrent truth.</text></svg>