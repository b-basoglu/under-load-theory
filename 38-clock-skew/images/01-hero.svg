roke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><line x1="330" y1="410" x2="1250" y2="410" stroke="#D9D6CF" stroke-width="2" stroke-linecap="round"/><circle cx="636.6666666666667" cy="300" r="11" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="636.6666666666667" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">status = pending customer</text><text x="636.6666666666667" y="336" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#2F5BEA" text-anchor="middle">stamped 10:00:00.000</text><circle cx="943.3333333333334" cy="410" r="11" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="943.3333333333334" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8A3FB8" text-anchor="middle">status = urgent  (200 ms later)</text><text x="943.3333333333334" y="446" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#8A3FB8" text-anchor="middle">stamped 09:59:59.900</text><rect x="90" y="480" width="1220" height="110" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="120" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">Last-write-wins compares the stamps: 10:00:00.000 &gt; 09:59:59.900</text><text x="120" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">→ keeps &#x27;pending customer&#x27; and silently discards the later &#x27;urgent&#x27; update</text><text x="60" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Any two updates closer together than the skew can be put in the wrong order — busy items lose writes first.</text></svg>