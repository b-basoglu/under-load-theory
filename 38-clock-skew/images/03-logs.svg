<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="700" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 38 · CLOCK SKEW</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Merged logs, sorted by timestamp</text><rect x="60" y="150" width="625" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="589" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">What happened</text><text x="90" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">real time</text><line x1="110" y1="260" x2="110" y2="430" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><circle cx="110" cy="290" r="9" fill="#2F5BEA" stroke="none" stroke-width="0"/><text x="136" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">ticket.created on server A</text><circle cx="110" cy="380" r="9" fill="#8A3FB8" stroke="none" stroke-width="0"/><text x="136" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">reply.added on server B — 60 ms later</text><text x="136" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">(B&#x27;s clock is 300 ms behind)</text><rect x="715" y="150" width="625" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#D9480F"/><text x="745" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">What the merged log shows</text><text x="745" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">sorted by each server&#x27;s own timestamp</text><rect x="745" y="262" width="565" height="56" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="765" y="296" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">13.348  server-b  reply.added</text><rect x="745" y="334" width="565" height="56" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="765" y="368" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">13.588  server-a  ticket.created</text><text x="745" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">the reply appears before the ticket existed</text><rect x="60" y="510" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">Timestamps from different machines can&#x27;t establish cause and effect</text><text x="90" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">When the skew is larger than the gap between two events, their order flips — every time.</text><text x="90" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">Use a trace ID propagated between requests, sequence numbers from one source, or logical clocks.</text></svg>