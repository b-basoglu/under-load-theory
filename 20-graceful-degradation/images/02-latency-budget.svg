 text-anchor="start">All-or-nothing</text><text x="90" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">waits for the widget&#x27;s own timeout</text><rect x="400" y="210" width="108.0" height="36" rx="7" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="410" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="start">core</text><rect x="400" y="254" width="828.0" height="36" rx="7" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="410" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="start">search call (hung)</text><line x1="1228.0" y1="202" x2="1228.0" y2="314" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/><text x="1218.0" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="end">page renders late — or 504</text><text x="90" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Shared deadline + fallback</text><text x="90" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">optional work stops at the deadline</text><rect x="400" y="360" width="108.0" height="36" rx="7" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="410" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="start">core</text><rect x="400" y="404" width="180.0" height="36" rx="7" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="410" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="start">search</text><line x1="580.0" y1="352" x2="580.0" y2="464" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/><text x="590.0" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">page renders with a placeholder</text><text x="90" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Breaker open / kill switch</text><text x="90" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">the dead call isn&#x27;t even sent</text><rect x="400" y="510" width="108.0" height="36" rx="7" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="410" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="start">core</text><line x1="508.0" y1="502" x2="508.0" y2="614" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/><text x="518.0" y="614" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">page renders at core speed</text><line x1="580.0" y1="190" x2="580.0" y2="640" stroke="#B7791F" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="586.0" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="start">optional deadline</text><line x1="670.0" y1="190" x2="670.0" y2="640" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"/><text x="676.0" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="start">page latency budget (SLO)</text><line x1="400" y1="645" x2="1300" y2="645" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="13