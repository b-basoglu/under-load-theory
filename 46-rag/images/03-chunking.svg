<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 46 · RAG</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">How big should a chunk be?</text><rect x="60" y="150" width="405" height="350" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="369" height="6" rx="3" fill="#B7791F"/><text x="88" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#B7791F" text-anchor="start">Too small</text><text x="88" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">one sentence</text><rect x="88" y="252" width="349" height="130" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="104" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">“After 45 days, the remaining months</text><text x="104" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">are converted to account credit.”</text><text x="88" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">No “annual plan”, no “refund”:</text><text x="88" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">hard to find, hard to interpret</text><rect x="497" y="150" width="405" height="350" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="149" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="525" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B8A3E" text-anchor="start">Structural + overlap</text><text x="525" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">a section, with its title</text><rect x="525" y="252" width="349" height="130" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="541" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">Billing › Refunds › Annual plans:</text><text x="541" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">“…refunded within 45 days. After 45</text><text x="541" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">days, the remaining months are…”</text><text x="525" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">Answer intact, context included,</text><text x="525" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">little else</text><rect x="934" y="150" width="405" height="350" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="149" width="369" height="6" rx="3" fill="#D9480F"/><text x="962" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#D9480F" text-anchor="start">Too large</text><text x="962" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">the whole article</text><rect x="962" y="252" width="349" height="130" rx="10" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><text x="978" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">Refunds (12 paragraphs): monthly</text><text x="978" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">plans, annual plans, taxes, chargebacks,</text><text x="978" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1A1D24" text-anchor="start">currencies, invoices, …</text><text x="962" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">Answer is in there — buried in noise;</text><text x="962" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">blurry embedding, more tokens</text><rect x="60" y="530" width="1280" height="230" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="529" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">Overlap keeps an answer that straddles a boundary whole in at least one chunk</text><rect x="100" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="146" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="192" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="238" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="284" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="330" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="376" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="422" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="468" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="514" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="560" y="626" width="38" height="26" rx="4" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.5" opacity="1"/><rect x="606" y="626