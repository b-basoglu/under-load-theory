<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="720" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 28 · DEAD LETTER QUEUES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Retry what can succeed; dead-letter what can&#x27;t</text><text x="60" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Two kinds of failure: transient (a timeout, a 503) and permanent (bad schema, failed validation)</text><rect x="60" y="220" width="405" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="219" width="369" height="6" rx="3" fill="#D9480F"/><text x="90" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">No retries</text><text x="90" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">every failure → DLQ</text><text x="90" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">transient failures</text><text x="90" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">dead-lettered, though one</text><text x="90" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">more try would have worked</text><text x="90" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">permanent failures</text><text x="90" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">dead-lettered</text><text x="90" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">DLQ</text><text x="90" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">mostly noise; the real poison</text><text x="90" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">is hidden in it</text><rect x="497" y="220" width="405" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="515" y="219" width="369" height="6" rx="3" fill="#B7791F"/><text x="527" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start">Retry everything 5×</text><text x="527" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">same policy for all errors</text><text x="527" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">transient failures</text><text x="527" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">recovered by a retry</text><text x="527" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">permanent failures</text><text x="527" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">4 wasted attempts each,</text><text x="527" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">+ ~15 s of backoff (1+2+4+8)</text><text x="527" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">DLQ</text><text x="527" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">right messages, but late —</text><text x="527" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">ordered partitions stall meanwhile</text><rect x="934" y="220" width="405" height="420" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="952" y="219" width="369" height="6" rx="3" fill="#2B8A3E"/><text x="964" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Classify, then decide</text><text x="964" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">retryable vs non-retryable</text><text x="964" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">transient failures</text><text x="964" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">bounded retries with backoff</text><text x="964" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">and jitter</text><text x="964" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">permanent failures</text><text x="964" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">DLQ on the first failure</text><text x="964" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">DLQ</text><text x="964" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">only real failures,</text><text x="964" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">no attempts wasted</text><text x="60" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Non-retryable errors go to the DLQ at once. Retryable ones get bounded attempts with backoff. Unknown ones: retry, with a limit.</text></svg>