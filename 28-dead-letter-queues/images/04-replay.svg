<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="880" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 28 · DEAD LETTER QUEUES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Replay is a deployment, not a button</text><rect x="60" y="150" width="1280" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Dead-lettered after part of the work was done: the history entry was already written</text><circle cx="108" cy="252" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="108" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="140" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">one-off script / non-idempotent path</text><text x="560" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">history entry written a second time</text><circle cx="108" cy="306" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="108" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="140" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">normal path, unique key (ticket, version)</text><text x="560" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">repeated part is a no-op</text><line x1="60" y1="390" x2="90" y2="390" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/><text x="100" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">replay the whole backlog at once</text><line x1="405.6" y1="390" x2="435.6" y2="390" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"/><text x="445.6" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">replay throttled below spare capacity</text><rect x="60" y="420" width="860" height="380" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><line x1="120" y1="740" x2="890" y2="740" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="120" y1="740" x2="120" y2="470" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="120" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">wait of a live event (illustrative)</text><text x="890" y="770" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><line x1="216.25" y1="480" x2="216.25" y2="740" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><text x="208.25" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D24" text-anchor="end">replay starts</text><polyline points="120.0,738.1 216.2,738.1 216.2,506.0 235.5,519.9 254.8,533.9 274.0,547.8 293.2,561.7 312.5,575.6 331.8,589.6 351.0,603.5 370.2,617.4 389.5,631.4 408.8,645.3 428.0,659.2 447.2,673.1 466.5,687.1 485.8,701.0 505.0,714.9 524.2,728.9 543.5,738.1 543.5,738.1 890.0,738.1" fill="none" stroke="#B7791F" stroke-width="3.5" stroke-linejoin="round"/><polyline points="120.0,737.0 890.0,737.0" fill="none" stroke="#2F5BEA" stroke-width="3.5" stroke-dasharray="10 6"/><text x="346.25" y="511.8571428571429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">≈ 6 s behind the dump</text><text x="884.0" y="715.4285714285714" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="end">throttled: no backlog builds</text><rect x="950" y="420" width="390" height="380" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="968" y="419" width="354" height="6" rx="3" fill="#2F5BEA"/><text x="980" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">The arithmetic</text><text x="980" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">illustrative rates</text><text x="980" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">live traffic       150 / s</text><text x="980" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">consumer capacity  240 / s</text><text x="980" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">spare capacity      90 / s</text><text x="980" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">1,500 at once → 1,500 ÷ 240 ≈ 6 s</text><text x="980" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">wait, ~17 s to clear</text><text x="980" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">60 / s → 210 / s total &lt; 240,</text><text x="980" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">replay done in 25 s, unnoticed</text><text x="60" y="840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Keep the replay rate below spare capacity — on the consumer and on everything downstream of it.</text></svg>