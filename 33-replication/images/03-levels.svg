<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="700" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 33 · REPLICATION</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">synchronous_commit: how far a commit waits</text><rect x="60" y="150" width="1280" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">From least to most waiting — each level waits for everything the previous one did, plus one more step</text><text x="90" y="262" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">off</text><rect x="290" y="238" width="300" height="34" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="290" y="238" width="24.0" height="34" rx="8" fill="#D9480F" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="620" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">nothing: not even the primary&#x27;s own flush</text><text x="620" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">may lose the last commits on a primary crash</text><text x="90" y="336" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">local</text><rect x="290" y="312" width="300" height="34" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="290" y="312" width="66.0" height="34" rx="8" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="620" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">the primary&#x27;s WAL flush</text><text x="620" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">replicas trail asynchronously</text><text x="90" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">remote_write</text><rect x="290" y="386" width="300" height="34" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="290" y="386" width="135.0" height="34" rx="8" fill="#B7791F" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="620" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">+ standby wrote WAL to its OS</text><text x="620" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">survives a standby process crash</text><text x="90" y="484" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">on</text><rect x="290" y="460" width="300" height="34" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="290" y="460" width="210.0" height="34" rx="8" fill="#2F5BEA" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="620" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">+ standby flushed WAL to disk</text><text x="620" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">durable on two servers — not yet visible there</text><text x="90" y="558" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">remote_apply</text><rect x="290" y="534" width="300" height="34" rx="8" fill="#EFEDE8" stroke="#EFEDE8" stroke-width="2" opacity="1"/><rect x="290" y="534" width="285.0" height="34" rx="8" fill="#2B8A3E" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="620" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">+ standby replayed it</text><text x="620" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">readable on the standby at commit time</text><text x="290" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">wait before returning (illustrative)</text><text x="60" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Every level above local adds a network round trip to every commit: sub-ms in a zone, tens of ms across regions.</text></svg>