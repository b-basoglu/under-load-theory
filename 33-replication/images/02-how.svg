<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="670" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 33 · REPLICATION</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What &#x27;replicated&#x27; can mean</text><rect x="60" y="180" width="250" height="90" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="185.0" y="221.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="middle">primary COMMIT</text><text x="185.0" y="247.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">WAL flushed locally</text><rect x="380" y="180" width="290" height="90" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="525.0" y="221.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="middle">sent</text><text x="525.0" y="247.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">WAL streamed to replica</text><text x="525" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">remote_write: replica wrote it (OS)</text><rect x="710" y="180" width="290" height="90" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="855.0" y="221.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="middle">flushed</text><text x="855.0" y="247.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">on the replica&#x27;s disk</text><text x="855" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">on: survives replica crash</text><rect x="1040" y="180" width="290" height="90" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="1185.0" y="221.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="middle">applied</text><text x="1185.0" y="247.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">replayed — visible to queries</text><text x="1185" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">remote_apply: readable now</text><line x1="314" y1="225" x2="376" y2="225" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="674" y1="225" x2="736" y2="225" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="1004" y1="225" x2="1066" y2="225" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="185" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">local / off: don&#x27;t wait</text><rect x="60" y="350" width="625" height="280" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="349" width="589" height="6" rx="3" fill="#B7791F"/><text x="90" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="start">Asynchronous (default)</text><text x="90" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">commit returns after the primary&#x27;s own flush</text><text x="90" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">replica is some time behind: ms when quiet,</text><text x="90" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">seconds under load or a long replica query</text><text x="90" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">failover can lose acknowledged writes</text><text x="90" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">reads from replicas can be stale</text><rect x="715" y="350" width="625" height="280" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="349" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="start">Synchronous (synchronous_standby_names)</text><text x="745" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">commit waits for a standby to confirm</text><text x="745" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">every commit pays the round trip —</text><text x="745" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">cheap in one zone, expensive across regions</text><text x="745" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">no acknowledged write lost on failover</text><text x="745" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">standby down → commits wait</text></svg>