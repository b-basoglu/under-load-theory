<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="745" viewBox="0 0 1400 745"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="745" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 33 · REPLICATION</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Saved — then read from a replica</text><rect x="60" y="150" width="1280" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">One user, one save, one reload</text><text x="90" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">primary</text><rect x="420" y="240" width="166" height="36" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="505.0" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">COMMIT &#x27;Sam (Billing)&#x27;</text><text x="90" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">app → browser → app</text><rect x="590" y="310" width="306" height="36" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="745.0" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="middle">response, redirect, next request</text><text x="90" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">replica</text><rect x="420" y="380" width="596" height="36" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="720.0" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B7791F" text-anchor="middle">still applying WAL …</text><rect x="1020" y="380" width="196" height="36" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1120.0" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">applied</text><line x1="900" y1="230" x2="900" y2="440" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/><text x="910" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">reload reads the replica here → old name &#x27;Sam&#x27;</text><rect x="60" y="510" width="625" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="589" height="6" rx="3" fill="#B7791F"/><text x="90" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Quiet afternoon</text><text x="90" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">lag is a fraction of a millisecond — and the</text><text x="90" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">user&#x27;s own next read can still arrive first</text><rect x="715" y="510" width="625" height="150" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="509" width="589" height="6" rx="3" fill="#D9480F"/><text x="745" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">Bulk import or a long replica report</text><text x="745" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">lag grows to seconds: every read right after</text><text x="745" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">a write is stale</text><text x="60" y="705" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Other users read later and never notice. The person who made the change notices every time.</text></svg>