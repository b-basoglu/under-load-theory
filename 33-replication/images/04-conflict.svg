1A1D24" text-anchor="start">How far the replica is behind while a long report runs on it (illustrative)</text><line x1="150" y1="540" x2="780" y2="540" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="540" x2="150" y2="290" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="150" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">replica behind</text><text x="780" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><polyline points="150.0,537.6 213.0,537.6 213.0,537.6 654.0,372.0 672.9,535.2 780.0,537.6" fill="none" stroke="#D9480F" stroke-width="3.5" stroke-linejoin="round"/><polyline points="150.0,536.4 780.0,536.4" fill="none" stroke="#2B8A3E" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 6"/><line x1="654.0" y1="300" x2="654.0" y2="540" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><text x="646.0" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D24" text-anchor="end">max_standby_streaming_delay</text><text x="662.0" y="376.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="start">report cancelled</text><text x="213.0" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle">report starts</text><line x1="90" y1="228" x2="120" y2="228" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/><text x="130" y="233" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1D24" text-anchor="start">hot_standby_feedback off</text><line x1="360" y1="228" x2="390" y2="228" stroke="#2B8A3E" stroke-width="3" stroke-linecap="round"/><text x="400" y="233" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1D24" text-anchor="start">on</text><rect x="850" y="150" width="490" height="210" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="868" y="149" width="454" height="6" rx="3" fill="#D9480F"/><text x="880" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">feedback off (default)</text><text x="880" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">replay waits for the report — every</text><text x="880" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">query on the replica reads old data —</text><text x="880" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1D24" text-anchor="start">then: &#x27;canceling statement due to</text><text x="880" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1D24" text-anchor="start">conflict with recovery&#x27;</text><rect x="850" y="380" width="490" height="210" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="868" y="379" width="454" height="6" rx="3" fill="#2B8A3E"/><text x="880" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">feedback on</text><text x="880" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">no lag, no cancellation —</text><text x="880" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">but the primary can&#x27;t vacuum the</text><text x="880" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">rows the report still needs:</text><text x="880" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">dead rows pile up → bloat</text></svg>