<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="800" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 6 · WRITE-AHEAD LOG</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">What happens between COMMIT and the disk</text><rect x="60" y="150" width="1280" height="560" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">application</text><text x="420" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="start">database memory</text><text x="820" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">disk</text><rect x="90" y="230" width="260" height="70" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="220" y="273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">UPDATE ticket · COMMIT</text><rect x="420" y="230" width="320" height="70" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="580" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">dirty pages</text><text x="580" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">table page · index pages</text><rect x="820" y="230" width="480" height="70" rx="12" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="2" opacity="1" stroke-dasharray="7 6"/><text x="1060" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6B7280" text-anchor="middle">data files · random writes</text><text x="1060" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">later, in the background (checkpoint)</text><rect x="420" y="360" width="320" height="70" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="580" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="middle">WAL buffer</text><text x="580" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">&quot;change X on page 712&quot;</text><rect x="820" y="360" width="480" height="70" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2.5" opacity="1"/><text x="1060" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="middle">WAL files · sequential append</text><text x="1060" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B8A3E" text-anchor="middle">fsync at COMMIT</text><line x1="352" y1="265" x2="412" y2="265" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><circle cx="382" cy="228" r="17" fill="#1A1D24" stroke="none" stroke-width="0"/><text x="382" y="235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="580" y1="304" x2="580" y2="354" stroke="#B7791F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-B7791F)"/><line x1="744" y1="395" x2="812" y2="395" stroke="#2B8A3E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><circle cx="778" cy="358" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="778" y="365" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><path d="M 1060 436 V 470 H 220 V 306" fill="none" stroke="#2B8A3E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-2B8A3E)"/><circle cx="640" cy="470" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="640" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="744" y1="265" x2="812" y2="265" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#a-6B7280)"/><circle cx="778" cy="228" r="17" fill="#6B7280" stroke="none" stroke-width="0"/><text x="778" y="235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="110" cy="534" r="17" fill="#1A1D24" stroke="none" stroke-width="0"/><text x="110" y="541" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">change the pages in memory</text><circle cx="110" cy="574" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="110" y="581" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="140" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">append the change to the WAL and fsync it</text><circle cx="110" cy="614" r="17" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="110" y="621" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="140" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">only then does COMMIT return</text><circle cx="110" cy="654" r="17" fill="#6B7280" stroke="none" stroke-width="0"/><text x="110" y="661" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="140" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1D24" text-anchor="start">data pages are written later</text><text x="60" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">The log is written ahead of the data — so a crash can always be repaired by replaying it.</text></svg>