<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="710" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 6 · WRITE-AHEAD LOG</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">An unread replication slot</text><rect x="60" y="150" width="820" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">WAL kept for the slot while nobody reads it</text><text x="90" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="Menlo, SFMono-Regular, Consolas, monospace">max_slot_wal_keep_size = &lt;limit&gt;</text><line x1="140" y1="600" x2="840" y2="600" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="408.0" x2="840" y2="408.0" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/><text x="150" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">retention limit</text><rect x="180" y="531.0" width="100" height="67.0" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="230" y="626" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">reserved</text><rect x="340" y="462.0" width="100" height="136.0" rx="6" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="390" y="626" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#2F5BEA" text-anchor="middle">reserved</text><rect x="500" y="396.0" width="100" height="202.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="550" y="626" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">unreserved</text><rect x="660" y="327.0" width="100" height="271.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="710" y="626" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">unreserved</text><text x="490" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">time since the consumer stopped reading →</text><rect x="910" y="150" width="430" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="928" y="149" width="394" height="6" rx="3" fill="#D9480F"/><text x="940" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1D24" text-anchor="start">At a following checkpoint</text><rect x="940" y="230" width="370" height="60" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2.5" opacity="1"/><text x="1125" y="268" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">wal_status = lost</text><text x="940" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="Menlo, SFMono-Regular, Consolas, monospace">invalidation reason: wal_removed</text><text x="940" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">The WAL the consumer needed is gone.</text><text x="940" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">It can&#x27;t resume — it must start over</text><text x="940" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">with a full snapshot.</text><text x="940" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">With no limit (the default, -1):</text><text x="940" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">WAL piles up until the disk is full</text><text x="940" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9480F" text-anchor="start">and the database stops writing.</text></svg>