<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="816" viewBox="0 0 1400 816"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="816" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 6 · WRITE-AHEAD LOG</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Durability settings and what they risk</text><text x="90" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">setting</text><text x="760" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start">a crash can lose</text><rect x="60" y="186" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">PostgreSQL</text><text x="220" y="222" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">synchronous_commit = on</text><rect x="750" y="196" width="570" height="38" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="766" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">nothing</text><rect x="60" y="256" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">PostgreSQL</text><text x="220" y="292" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">synchronous_commit = off</text><rect x="750" y="266" width="570" height="38" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="766" y="291" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">last fraction of a second of commits</text><rect x="60" y="326" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">PostgreSQL</text><text x="220" y="362" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">fsync = off</text><rect x="750" y="336" width="570" height="38" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="766" y="361" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">corruption after a crash</text><rect x="60" y="396" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">PostgreSQL</text><text x="220" y="432" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">full_page_writes = off</text><rect x="750" y="406" width="570" height="38" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="766" y="431" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="start">corrupted pages after a crash</text><rect x="60" y="466" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">MySQL</text><text x="220" y="502" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">innodb_flush_log_at_trx_commit = 1</text><rect x="750" y="476" width="570" height="38" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="766" y="501" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B8A3E" text-anchor="start">nothing (with sync_binlog = 1)</text><rect x="60" y="536" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">MySQL</text><text x="220" y="572" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">innodb_flush_log_at_trx_commit = 2</text><rect x="750" y="546" width="570" height="38" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="766" y="571" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">~1 s on an OS crash or power cut</text><rect x="60" y="606" width="1280" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">MySQL</text><text x="220" y="642" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">innodb_flush_log_at_trx_commit = 0</text><rect x="750" y="616" width="570" height="38" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="766" y="641" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start">~1 s even on a MySQL crash</text><rect x="60" y="686" width="1280" height="90" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="90" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">Lost commits were acknowledged to the application — the caller believed they succeeded.</text><text x="90" y="754" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">Amber settings lose recent commits but stay consistent. Red settings can corrupt the database.</text></svg>