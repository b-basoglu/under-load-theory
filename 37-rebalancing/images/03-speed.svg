, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">Unthrottled copy</text><line x1="120" y1="420" x2="650" y2="420" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="120" y1="420" x2="120" y2="240" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="110" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">foreground p99</text><text x="650" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end">time →</text><rect x="240" y="250" width="180" height="170" rx="0" fill="#FDEBE3" stroke="#FDEBE3" stroke-width="2" opacity="0.8"/><text x="330.0" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">copy running</text><path d="M 120 380 L 240 380 L 260 300 L 400 290 L 420 380 L 650 380" fill="none" stroke="#D9480F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ finishes sooner</text><text x="90" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ competes with queries for CPU, disk, network</text><text x="90" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ pushes hot pages out of the cache</text><text x="90" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D9480F" text-anchor="start">✗ foreground p99 climbs for the whole copy</text><rect x="715" y="150" width="625" height="470" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Throttled, adaptive copy</text><line x1="775" y1="420" x2="1305" y2="420" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="775" y1="420" x2="775" y2="240" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="765" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">foreground p99</text><text x="1305" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end">time →</text><rect x="895" y="250" width="380" height="170" rx="0" fill="#FBF1DC" stroke="#FBF1DC" stroke-width="2" opacity="0.8"/><text x="1085.0" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">copy running</text><path d="M 775 380 L 895 380 L 955 372 L 1015 350 L 1045 380 L 1275 378 L 1305 380" fill="none" stroke="#2B8A3E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1015" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B8A3E" text-anchor="middle">brake</text><text x="745" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• takes longer</text><text x="745" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ rate set below the source&#x27;s spare capacity</text><text x="745" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ pauses when foreground p99 rises</text><text x="745" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B8A3E" text-anchor="start">✓ users don&#x27;t notice</text><rect x="60" y="650" width="1280" height="120" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="649" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="694" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="start">Even when the new node is empty, the cost lands on the source — the node that was already too busy</text><text x="90" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">Knobs: Kafka --throttle · Cassandra stream_throughput_outbound · Elasticsearch indices.recovery.max_bytes_per_sec</text></svg>