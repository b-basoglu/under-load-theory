<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="710" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 37 · REBALANCING</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The steps of a live move</text><rect x="60" y="170" width="295" height="100" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="207.5" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">1. plan</text><text x="207.5" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">new ownership map</text><line x1="359" y1="220" x2="381" y2="220" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="385" y="170" width="295" height="100" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="532.5" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">2. copy</text><text x="532.5" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">chunks, throttled; old owner serves</text><line x1="684" y1="220" x2="706" y2="220" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="710" y="170" width="295" height="100" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="857.5" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5BEA" text-anchor="middle">3. catch up</text><text x="857.5" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">replay changes made meanwhile</text><line x1="1009" y1="220" x2="1031" y2="220" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="1035" y="170" width="295" height="100" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1182.5" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="middle">4. fence</text><text x="1182.5" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">old owner rejects writes</text><rect x="60" y="320" width="295" height="100" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="207.5" y="366.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="middle">5. final catch-up</text><text x="207.5" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">the last few changes</text><line x1="359" y1="370" x2="381" y2="370" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="385" y="320" width="295" height="100" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="532.5" y="366.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="middle">6. switch</text><text x="532.5" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">routing → new owner, new version</text><line x1="684" y1="370" x2="706" y2="370" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="710" y="320" width="295" height="100" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="857.5" y="366.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="middle">7. verify</text><text x="857.5" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">counts, versions, checksums</text><line x1="1009" y1="370" x2="1031" y2="370" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="1035" y="320" width="295" height="100" rx="12" fill="#EFEDE8" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="1182.5" y="366.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6B7280" text-anchor="middle">8. retire</text><text x="1182.5" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">delete old copy later</text><path d="M 1300 274 L 1300 296 L 207 296 L 207 316" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="60" y="480" width="1280" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="479" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">Only steps 4–6 pause writes — and only for the moving partition</text><text x="90" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the copy and catch-up can take hours for a big partition; users keep using the old owner</text><text x="90" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the fence comes when the backlog is small, so the pause is short: milliseconds to seconds</text><text x="90" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• writes that hit the fence are rejected, re-routed and retried — not lost</text></svg>