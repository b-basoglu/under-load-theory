<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="790" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 15 · RETRIES</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">A 10-second outage, and what retries did to it</text><line x1="60" y1="160" x2="90" y2="160" stroke="#D9480F" stroke-width="4" stroke-linecap="round"/><text x="100" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">retry freely: the storm keeps it down</text><line x1="470" y1="160" x2="500" y2="160" stroke="#2F5BEA" stroke-width="4" stroke-linecap="round"/><text x="510" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">jitter + retry budget: recovers when the outage ends</text><text x="1340" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="end">illustrative</text><rect x="60" y="190" width="1280" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="348.33333333333337" y="250" width="188.33333333333337" height="380" fill="#FDEBE3"/><text x="442.50000000000006" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9480F" text-anchor="middle">provider down</text><line x1="160" y1="630" x2="1290" y2="630" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="630" x2="160" y2="250" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="146" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">emails sent per second</text><text x="1290" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><line x1="160" y1="379.2" x2="1290" y2="379.2" stroke="#EFEDE8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="1284" y="369.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="end">normal traffic</text><polyline points="160.0,379.2 348.3,379.2 352.1,630.0 536.7,630.0 544.2,516.0 555.5,546.4 1290.0,546.4" fill="none" stroke="#D9480F" stroke-width="4" stroke-linejoin="round"/><polyline points="160.0,379.2 348.3,379.2 352.1,630.0 536.7,630.0 542.3,307.0 649.7,307.0 668.5,379.2 1290.0,379.2" fill="none" stroke="#2F5BEA" stroke-width="4" stroke-linejoin="round"/><text x="913.3333333333334" y="576.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">overloaded by retries, degraded capacity: stuck</text><text x="678.5" y="295.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="start">backlog drains, then normal</text><text x="60" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">The outage ended at the same moment in both runs. What differed was how much retry load arrived with it.</text></svg>