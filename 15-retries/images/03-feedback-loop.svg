amily="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">requests fail</text><rect x="910" y="360" width="300" height="80" rx="40" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5" opacity="1"/><text x="1060" y="407" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="middle">clients retry</text><rect x="550" y="530" width="300" height="80" rx="40" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5" opacity="1"/><text x="700" y="577" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B7791F" text-anchor="middle">more load arrives</text><rect x="190" y="360" width="300" height="80" rx="40" fill="#FDEBE3" stroke="#D9480F" stroke-width="2.5" opacity="1"/><text x="340" y="395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">service overloaded,</text><text x="340" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="middle">less efficient</text><path d="M 850 245 Q 1010 260 1050 356" fill="none" stroke="#6B7280" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-6B7280)"/><path d="M 1050 444 Q 1010 545 852 565" fill="none" stroke="#6B7280" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-6B7280)"/><path d="M 548 565 Q 390 545 350 444" fill="none" stroke="#6B7280" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-6B7280)"/><path d="M 350 356 Q 390 260 548 245" fill="none" stroke="#6B7280" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-6B7280)"/><text x="700" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="middle">trigger: a 10-second outage</text><text x="700" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">sustaining effect: retries</text><text x="700" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">→ stays broken after the trigger is gone</text><rect x="60" y="700" width="1280" height="110" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="699" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="746" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">Break the loop by removing load, not by waiting:</text><text x="90" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">retry budget · circuit breaker (Part 16) · load shedding (Part 25) · deadlines that make clients give up</text></svg>