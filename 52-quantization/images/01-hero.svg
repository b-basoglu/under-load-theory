-anchor="start">A 70B model on one 80 GB GPU — weight memory = parameters × bytes per weight</text><text x="90" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">BF16</text><rect x="330" y="250" width="787.5" height="56" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="344" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">weights</text><text x="1133.5" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">140 GB — doesn&#x27;t fit</text><text x="90" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">INT8 / FP8</text><rect x="330" y="370" width="393.75" height="56" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="344" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="start">weights</text><rect x="729.75" y="370" width="50.25" height="56" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1" stroke-dasharray="6 4"/><text x="743.75" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="start">KV</text><text x="796.0" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">~70 GB — fits, little room left</text><text x="90" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="start">4-bit, group-wise</text><rect x="330" y="490" width="202.5" height="56" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="344" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">weights</text><rect x="538.5" y="490" width="241.5" height="56" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1" stroke-dasharray="6 4"/><text x="552.5" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F5BEA" text-anchor="start">free: KV cache</text><text x="796.0" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">~36 GB — fits, room for KV cache</text><line x1="780.0" y1="228" x2="780.0" y2="610" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="780.0" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">80 GB GPU</text><text x="90" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Arithmetic, not a benchmark. 4-bit includes ~0.1 bit/weight of scales.</text></svg>