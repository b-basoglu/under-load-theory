t">keep activations in 16-bit</text><text x="880" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">LLM.int8()</text><text x="880" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">outlier dimensions in 16-bit, rest in</text><text x="880" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">8-bit</text><text x="880" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">SmoothQuant</text><text x="880" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">divide activation channels, multiply</text><text x="880" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">weights: X·W unchanged</text><text x="880" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">FP8</text><text x="880" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">exponent gives the range INT8 lacks</text><rect x="60" y="680" width="1280" height="100" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="679" width="1244" height="6" rx="3" fill="#2F5BEA"/><text x="90" y="722" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F5BEA" text-anchor="start">Weights are fixed and well-behaved: scales can be chosen carefully ahead of time.</text><text x="90" y="752" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">Activations change with every input — so most LLM quantization is weight-only.</text></svg>