or="start">Symmetric 4-bit: 15 levels, −7 … +7.  scale = max |w| ÷ 7 = 0.084 ÷ 7 = 0.012</text><line x1="120" y1="320" x2="1280" y2="320" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><line x1="120.0" y1="306" x2="120.0" y2="334" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="120.0" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">-7</text><line x1="202.85714285714283" y1="306" x2="202.85714285714283" y2="334" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="202.85714285714283" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">-6</text><line x1="285.71428571428567" y1="306" x2="285.71428571428567" y2="334" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="285.71428571428567" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">-5</text><line x1="368.57142857142856" y1="306" x2="368.57142857142856" y2="334" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="368.57142857142856" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">-4</text><line x1="451.4285714285714" y1="306" x2="451.4285714285714" y2="334" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="451.4285714285714" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">-3</text><line x1="534.2857142857142" y1="306" x2="534.2857142857142" y2="334" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/><text x="534.2857142857142" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">-2</text><line x1="617.14285714285