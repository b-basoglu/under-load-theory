 y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start">Each weight snaps to the nearest level; the gap between levels is the scale.</text><rect x="60" y="510" width="305" height="130" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="269" height="6" rx="3" fill="#2F5BEA"/><text x="84" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">1. scale</text><text x="84" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">largest |w| in the group ÷ 7</text><rect x="385" y="510" width="305" height="130" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="403" y="509" width="269" height="6" rx="3" fill="#2F5BEA"/><text x="409" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">2. store</text><text x="409" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">round(0.031 ÷ 0.012) = 3</text><rect x="710" y="510" width="305" height="130" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="728" y="509" width="269" height="6" rx="3" fill="#2F5BEA"/><text x="734" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="start">3. recover</text><text x="734" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">3 × 0.012 = 0.036</text><rect x="1035" y="510" width="305" height="130" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="1053" y="509" width="269" height="6" rx="3" fill="#D9480F"/><text x="1059" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">error</text><text x="1059" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">0.005 here — halves with every</text><text x="1059" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">extra bit</text></svg>