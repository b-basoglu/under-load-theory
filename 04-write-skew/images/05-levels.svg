<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="776" viewBox="0 0 1400 776"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="776" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 4 · WRITE SKEW</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Which isolation levels stop write skew?</text><rect x="60" y="150" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">PostgreSQL</text><text x="290" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">Read Committed (default)</text><rect x="700" y="162" width="420" height="40" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">✕ allows it</text><text x="1310" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">snapshot per statement</text><rect x="60" y="228" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">PostgreSQL</text><text x="290" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">Repeatable Read</text><rect x="700" y="240" width="420" height="40" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">✕ allows it</text><text x="1310" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">snapshot</text><rect x="60" y="306" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">PostgreSQL</text><text x="290" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">Serializable</text><rect x="700" y="318" width="420" height="40" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="720" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">✓ prevents it — aborts one (40001)</text><text x="1310" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">SSI</text><rect x="60" y="384" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">MySQL</text><text x="290" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">Repeatable Read (default)</text><rect x="700" y="396" width="420" height="40" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">✕ allows it</text><text x="1310" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">snapshot</text><rect x="60" y="462" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">MySQL</text><text x="290" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">Serializable</text><rect x="700" y="474" width="420" height="40" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="720" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">✓ prevents it — deadlock kills one (1213)</text><text x="1310" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">shared locks</text><rect x="60" y="540" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">SQL Server</text><text x="290" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">SNAPSHOT</text><rect x="700" y="552" width="420" height="40" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">✕ allows it</text><text x="1310" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">snapshot</text><rect x="60" y="618" width="1280" height="64" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Oracle</text><text x="290" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1A1D24" text-anchor="start">SERIALIZABLE (= snapshot)</text><rect x="700" y="630" width="420" height="40" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="720" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">✕ allows it</text><text x="1310" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">snapshot</text><text x="60" y="736" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Only truly serializable levels stop it — by aborting a transaction. Retries are mandatory.</text></svg>