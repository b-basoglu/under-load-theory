<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="710" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 4 · WRITE SKEW</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Lost update vs write skew</text><rect x="60" y="150" width="610" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1D24" text-anchor="start">Lost update</text><text x="94" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">both write the same row</text><rect x="100" y="280" width="120" height="50" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="160" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="middle">T1</text><rect x="510" y="280" width="120" height="50" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="570" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="middle">T2</text><rect x="265" y="420" width="200" height="60" rx="10" fill="#FDEBE3" stroke="#D9480F" stroke-width="2.5" opacity="1"/><text x="365" y="457" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="middle">ticket 48213</text><line x1="170" y1="336" x2="320" y2="414" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><line x1="560" y1="336" x2="410" y2="414" stroke="#B7791F" stroke-width="3" stroke-linecap="round" marker-end="url(#a-B7791F)"/><text x="94" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#D9480F" text-anchor="start">The second write erases the first.</text><text x="94" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Detectable: PostgreSQL&#x27;s Repeatable Read raises</text><text x="94" y="618" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">&quot;could not serialize access&quot;</text><rect x="730" y="150" width="610" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#D9480F"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1D24" text-anchor="start">Write skew</text><text x="764" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">each writes a different row</text><rect x="770" y="280" width="120" height="50" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="830" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="middle">T1</text><rect x="1180" y="280" width="120" height="50" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1240" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="middle">T2</text><rect x="790" y="420" width="180" height="60" rx="10" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="880" y="457" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="middle">maya&#x27;s row</text><rect x="1100" y="420" width="180" height="60" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="1190" y="457" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="middle">omar&#x27;s row</text><line x1="830" y1="336" x2="870" y2="414" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round" marker-end="url(#a-2F5BEA)"/><line x1="1240" y1="336" x2="1200" y2="414" stroke="#B7791F" stroke-width="3" stroke-linecap="round" marker-end="url(#a-B7791F)"/><path d="M 880 486 V 506 H 1190 V 486" fill="none" stroke="#D9480F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1035" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">rule: at least one admin — broken</text><text x="764" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Nothing is erased. The rule spans both rows,</text><text x="764" y="618" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">and the database doesn&#x27;t know it exists.</text></svg>