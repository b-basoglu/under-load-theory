<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="720" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 31 · SAGAS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Every step has an undo — except the last</text><rect x="60" y="170" width="380" height="90" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="250.0" y="211.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="middle">T1 charge card</text><text x="250.0" y="237.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">billing</text><line x1="444" y1="215" x2="496" y2="215" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="60" y="340" width="380" height="80" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="250.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">C1 refund</text><line x1="250" y1="264" x2="250" y2="334" stroke="#D9480F" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="500" y="170" width="380" height="90" rx="12" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="2" opacity="1"/><text x="690.0" y="211.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5BEA" text-anchor="middle">T2 grant seats</text><text x="690.0" y="237.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">entitlements</text><line x1="884" y1="215" x2="936" y2="215" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><rect x="500" y="340" width="380" height="80" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="690.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="middle">C2 revoke seats</text><line x1="690" y1="264" x2="690" y2="334" stroke="#D9480F" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="940" y="170" width="380" height="90" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="1130.0" y="211.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B8A3E" text-anchor="middle">T3 activate plan</text><text x="1130.0" y="237.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">accounts</text><rect x="940" y="340" width="380" height="80" rx="12" fill="#EFEDE8" stroke="#6B7280" stroke-width="2" opacity="1"/><text x="1130.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6B7280" text-anchor="middle">(pivot: no undo needed)</text><path d="M 1190 424 L 1190 446 L 250 446 L 250 428" fill="none" stroke="#D9480F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="250" y1="440" x2="250" y2="426" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-D9480F)"/><text x="720" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D9480F" text-anchor="middle">T3 fails → run C2, then C1, in reverse order</text><rect x="60" y="490" width="1280" height="190" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="489" width="1244" height="6" rx="3" fill="#B7791F"/><text x="90" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="start">A compensation is not a rollback</text><text x="90" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• the charge happened; a refund is a new, visible transaction (the customer sees both)</text><text x="90" y="608" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• some effects can&#x27;t be undone: an email sent, a shipment dispatched — put those after the pivot</text><text x="90" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">• compensations can fail too: they must be retried until they succeed, so they must be idempotent</text></svg>