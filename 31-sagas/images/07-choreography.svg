<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="770" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 31 · SAGAS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">Choreography: the plumbing is the saga</text><defs><marker id="a-8A3FB8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A3FB8"/></marker></defs><rect x="60" y="160" width="260" height="70" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="190.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="middle">billing</text><line x1="324" y1="195" x2="496" y2="195" stroke="#8A3FB8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-8A3FB8)"/><text x="410" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="middle">payment.charged</text><rect x="500" y="160" width="260" height="70" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="630.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="middle">entitlements</text><line x1="764" y1="195" x2="936" y2="195" stroke="#8A3FB8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-8A3FB8)"/><text x="850" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A3FB8" text-anchor="middle">seats.granted</text><rect x="940" y="160" width="260" height="70" rx="12" fill="#EFEDE8" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="1070.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="middle">accounts</text><text x="60" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">No saga record anywhere: the saga is the chain of events, each carrying the saga ID as correlation ID.</text><rect x="60" y="300" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="299" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">Commit, then crash before publishing</text><circle cx="108" cy="388" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="108" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="138" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">the next event is never sent</text><text x="90" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">charged, seats granted, plan never activated</text><text x="90" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">nothing fails loudly — found only by comparing databases</text><rect x="715" y="300" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="299" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">Same crash, outbox in each service</text><circle cx="763" cy="388" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="763" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="793" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">no event is lost</text><text x="745" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">event written in the same tx as the change</text><text x="745" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">relay crashes turn lost events into duplicates</text><rect x="60" y="520" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="519" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9480F" text-anchor="start">Events delivered twice, plain handlers</text><circle cx="108" cy="608" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="108" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="138" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D9480F" text-anchor="start">side effects repeated</text><text x="90" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">a second charge, a second refund</text><text x="90" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">at-least-once delivery is the normal case</text><rect x="715" y="520" width="625" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="519" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B8A3E" text-anchor="start">Same duplicates, idempotent handlers</text><circle cx="763" cy="608" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="763" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="793" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B8A3E" text-anchor="start">duplicates are no-ops</text><text x="745" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">processed-event table + idempotency keys</text><text x="745" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">what makes the outbox&#x27;s duplicates safe</text></svg>