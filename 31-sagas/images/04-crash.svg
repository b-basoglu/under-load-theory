<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="720" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 31 · SAGAS</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">The orchestrator crashes too</text><rect x="60" y="150" width="625" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="589" height="6" rx="3" fill="#D9480F"/><text x="90" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">Saga state only in memory</text><circle cx="100" cy="246" r="5" fill="#D9480F" stroke="none" stroke-width="0"/><text x="116" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">crash between &#x27;charged&#x27; and &#x27;grant&#x27;</text><circle cx="100" cy="290" r="5" fill="#D9480F" stroke="none" stroke-width="0"/><text x="116" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">restart: no record the saga exists</text><circle cx="100" cy="334" r="5" fill="#D9480F" stroke="none" stroke-width="0"/><text x="116" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">nobody resumes it, nobody refunds</text><circle cx="108" cy="404" r="18" fill="#D9480F" stroke="none" stroke-width="0"/><text x="108" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="138" y="411" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">charged without Premium, silently</text><rect x="715" y="150" width="625" height="300" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="733" y="149" width="589" height="6" rx="3" fill="#2B8A3E"/><text x="745" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Saga state in a table + recovery</text><circle cx="755" cy="246" r="5" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="771" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">state row written before each step</text><circle cx="755" cy="290" r="5" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="771" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">restart: find sagas not done/compensated</text><circle cx="755" cy="334" r="5" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="771" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1D24" text-anchor="start">redo the current step (idempotent) or undo</text><circle cx="763" cy="404" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="763" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="793" y="411" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">every crash becomes a delay</text><rect x="60" y="480" width="1280" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><text x="90" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">sagas table — written before each step</text><rect x="90" y="552" width="180" height="50" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="180" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">charging</text><rect x="295" y="552" width="180" height="50" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="385" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">granting</text><rect x="500" y="552" width="180" height="50" rx="8" fill="#E6ECFD" stroke="#2F5BEA" stroke-width="1.5" opacity="1"/><text x="590" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F5BEA" text-anchor="middle">activating</text><rect x="705" y="552" width="180" height="50" rx="8" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="1.5" opacity="1"/><text x="795" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="middle">done</text><rect x="910" y="552" width="180" height="50" rx="8" fill="#FDEBE3" stroke="#D9480F" stroke-width="1.5" opacity="1"/><text x="1000" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">compensating</text><rect x="1115" y="552" width="180" height="50" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.5" opacity="1"/><text x="1205" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">compensated</text><text x="90" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">On restart: SELECT … WHERE state NOT IN (&#x27;done&#x27;,&#x27;compensated&#x27;) → redo the current step (idempotent) or compensate.</text></svg>