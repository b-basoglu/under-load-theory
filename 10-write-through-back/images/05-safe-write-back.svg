<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="760" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 10 · WRITE-THROUGH VS WRITE-BACK</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">From risky to safe write-back</text><rect x="60" y="160" width="1240" height="96" rx="12" fill="#FDEBE3" stroke="#D9480F" stroke-width="2" opacity="1"/><text x="90" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#D9480F" text-anchor="start">In-memory buffer</text><text x="90" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">lose everything since the last flush</text><text x="1280" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">view counts, analytics, presence</text><rect x="100" y="280" width="1200" height="96" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="2" opacity="1"/><text x="130" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start">Redis + AOF everysec</text><text x="130" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">lose up to ~1 s on a machine crash</text><text x="1280" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">high-volume, nice-to-have data</text><rect x="140" y="400" width="1160" height="96" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="170" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Durable log as the buffer</text><text x="170" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">acknowledged = durable; batched apply</text><text x="1280" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Kafka · persistent Redis Streams · append table</text><rect x="180" y="520" width="1120" height="96" rx="12" fill="#E3F4E6" stroke="#2B8A3E" stroke-width="2" opacity="1"/><text x="210" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Write-through</text><text x="210" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1D24" text-anchor="start">acknowledged after the database commit</text><text x="1280" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">anything a user would miss</text><rect x="60" y="660" width="1280" height="64" rx="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" opacity="1"/><text x="700" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Every write-back path: versioned or idempotent apply · bounded buffer · failure path · rebuild plan</text></svg>