<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 10 · WRITE-THROUGH VS WRITE-BACK</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">When to choose which</text><rect x="60" y="150" width="610" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="149" width="574" height="6" rx="3" fill="#2B8A3E"/><text x="94" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B8A3E" text-anchor="start">Write-through</text><circle cx="112" cy="262" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">losing an acknowledged write is unacceptable</text><circle cx="112" cy="328" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">other systems read the database</text><circle cx="112" cy="394" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="112" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="144" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">the database handles the write rate</text><rect x="730" y="150" width="610" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="748" y="149" width="574" height="6" rx="3" fill="#B7791F"/><text x="764" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#B7791F" text-anchor="start">Write-back</text><circle cx="782" cy="262" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">writes are frequent and can be coalesced</text><circle cx="782" cy="328" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">losing seconds is OK — or the buffer is a durable log</text><circle cx="782" cy="394" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="782" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="814" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">readers tolerate the database lagging</text><rect x="60" y="510" width="1280" height="200" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="509" width="1244" height="6" rx="3" fill="#D9480F"/><text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D24" text-anchor="start">Ordering: two status changes applied out of order by two flush workers</text><text x="90" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#D9480F" text-anchor="start">no guard → final status: pending (the older change won)</text><text x="90" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B8A3E" text-anchor="start">WHERE version &lt; $new → final status: solved; the late update changes 0 rows</text><text x="90" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Counters don&#x27;t care about order; anything that replaces a value does.</text></svg>