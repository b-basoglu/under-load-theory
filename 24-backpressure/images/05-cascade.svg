stroke-width="0"/><text x="94" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="82" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Database slows</text><text x="82" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">lock, bad plan, vacuum</text><line x1="299" y1="255" x2="318" y2="255" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="321" y="170" width="236" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="339" y="169" width="200" height="6" rx="3" fill="#D9480F"/><circle cx="355" cy="214" r="17" fill="#D9480F" stroke="none" stroke-width="0"/><text x="355" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="343" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Pool runs out</text><text x="343" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">queries hold connections longer</text><line x1="560" y1="255" x2="579" y2="255" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="582" y="170" width="236" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="600" y="169" width="200" height="6" rx="3" fill="#B7791F"/><circle cx="616" cy="214" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="616" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="604" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Request threads block</text><text x="604" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">waiting for a connection</text><line x1="821" y1="255" x2="840" y2="255" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="843" y="170" width="236" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="861" y="169" width="200" height="6" rx="3" fill="#B7791F"/><circle cx="877" cy="214" r="17" fill="#B7791F" stroke="none" stroke-width="0"/><text x="877" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="865" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Request queue grows</text><text x="865" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">callers time out; work still runs</text><line x1="1082" y1="255" x2="1101" y2="255" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-6B7280)"/><rect x="1104" y="170" width="236" height="170" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="1122" y="169" width="200" height="6" rx="3" fill="#D9480F"/><circle cx="1138" cy="214" r="17" fill="#D9480F" stroke="none" stroke-width="0"/><text x="1138" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1126" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Callers retry</text><text x="1126" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">upstream services block too</text><rect x="60" y="380" width="1280" height="330" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="78" y="379" width="1244" height="6" rx="3" fill="#2B8A3E"/><text x="90" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B8A3E" text-anchor="start">Where the chain is broken</text><circle cx="104" cy="468" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="136" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">short pool-acquire timeout</text><text x="520" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">fail fast instead of waiting forever</text><circle cx="104" cy="514" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="136" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">bounded request queue</text><text x="520" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">excess rejected with a fast 503</text><circle cx="104" cy="560" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="136" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">deadline propagation</text><text x="520" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">drop work whose caller gave up</text><circle cx="104" cy="606" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="614" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="136" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">retry budgets + backoff</text><text x="520" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">rejections don&#x27;t multiply load</text><circle cx="104" cy="652" r="18" fill="#2B8A3E" stroke="none" stroke-width="0"/><text x="104" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="136" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D24" text-anchor="start">circuit breakers</text><text x="520" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1D24" text-anchor="start">stop hammering a saturated dependency</text><text x="60" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D24" text-anchor="start">Backpressure turns &quot;everything slowly stops&quot; into &quot;some requests are refused quickly; the rest succeed.&quot;</text></svg>