<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750"><defs><marker id="a-1A1D24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1D24"/></marker><marker id="a-6B7280" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a-2F5BEA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="a-D9480F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker><marker id="a-2B8A3E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/></marker><marker id="a-B7791F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="a-D9D6CF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9D6CF"/></marker></defs><rect width="1400" height="750" fill="#FAFAF7"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">UNDER LOAD · PART 24 · BACKPRESSURE</text><text x="60" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1D24" text-anchor="start">How an unbounded queue grows</text><rect x="60" y="150" width="800" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><line x1="150" y1="590" x2="820" y2="590" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><line x1="150" y1="590" x2="150" y2="210" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" marker-end="url(#a-1A1D24)"/><text x="820" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="end">time →</text><text x="160" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="start">items waiting</text><rect x="250.5" y="230" width="469.0" height="360" fill="#FDEBE3" opacity="0.6"/><text x="485.0" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="middle">overload: arrivals λ &gt; service μ</text><path d="M 150 586 L 250.5 586 L 719.5 270 L 820.0 340" fill="none" stroke="#D9480F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="297.4" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9480F" text-anchor="start">unbounded: slope = λ − μ</text><path d="M 150 586 L 263.9 586 L 297.4 520 L 719.5 520 L 753.0 586 L 820 586" fill="none" stroke="#2B8A3E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="284.0" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B8A3E" text-anchor="start">bounded: stops at the bound — the rest waits upstream</text><text x="726.2" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">after the burst it</text><text x="726.2" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">still has to drain</text><rect x="890" y="150" width="450" height="520" rx="16" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="2" opacity="1"/><rect x="908" y="149" width="414" height="6" rx="3" fill="#2F5BEA"/><text x="920" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D24" text-anchor="start">The arithmetic</text><text x="920" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">growth while overloaded</text><text x="920" y="278" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">λ − μ per second</text><text x="920" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">wait for a new item</text><text x="920" y="356" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">depth ÷ μ</text><text x="920" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">Little&#x27;s law</text><text x="920" y="434" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">in flight = λ × time</text><text x="920" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="start">a sensible bound</text><text x="920" y="512" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#1A1D24" text-anchor="start">μ × max acceptable wait</text><text x="920" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">larger bound: more burst tolerance,</text><text x="920" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1D24" text-anchor="start">longer worst-case wait and recovery</text><text x="920" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F5BEA" text-anchor="start">throughput is μ either way</text><text x="60" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="start">Illustrative. A buffer absorbs bursts; against sustained overload it only delays the moment it&#x27;s full.</text></svg>